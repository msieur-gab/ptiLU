<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ptiLU engine</title>
<style>
  :root { --bg: #f6f4ef; --ink: #1d1c1a; --soft: #77736b; --line: #dcd7cc; --me: #e8e3d8; --accent: #3b5b4a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171716; --ink: #ecebe6; --soft: #9a968d; --line: #33322f; --me: #26251f; --accent: #8fb89f; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; gap: 1rem; align-items: baseline; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  header b { font-weight: 600; } header button { margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 1rem; }
  .turn { margin: 0 0 .9rem; max-width: 38rem; }
  .me { margin-left: auto; background: var(--me); padding: .45rem .75rem; border-radius: .8rem; width: fit-content; }
  .why { color: var(--soft); font-size: .78rem; margin-top: .2rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .4rem; }
  button { font: inherit; font-size: .9rem; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 1rem; padding: .25rem .7rem; }
  button.go { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  form.say { display: flex; gap: .5rem; padding: .7rem 1rem; border-top: 1px solid var(--line); }
  form.say input { flex: 1; font: inherit; padding: .55rem .8rem; border-radius: 1.2rem; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  #inbox { display: none; } body.inbox #inbox { display: block; } body.inbox #log, body.inbox form.say { display: none; }
  .item { border-bottom: 1px solid var(--line); padding: .8rem 0; }
  .item select, .item input { font: inherit; font-size: .9rem; margin: .3rem .3rem 0 0; padding: .2rem .4rem; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: .3rem; }
  pre { white-space: pre-wrap; font-size: .8rem; color: var(--soft); }
</style>
</head>
<body>
<header><b>ptiLU</b><span class="why">engine · offline</span><button id="tab">Inbox</button></header>
<main id="log"></main>
<main id="inbox"></main>
<form class="say"><input id="q" placeholder="Ask or tell me something" autocomplete="off"><button class="go">Send</button></form>
<script>
// Dependency-free NLU runtime. Mirrors nlu/features.py + nlu/runtime.py exactly.
const NLURuntime = (() => {
  const TOKEN_RE = /[A-Za-z0-9_](?:[A-Za-z0-9_.\-]*[A-Za-z0-9_])?|[^\sA-Za-z0-9_]/g;
  const WORD_RE = /^[A-Za-z0-9_]/;
  const ALNUM = /^[A-Za-z0-9]/;
  const EXT_RE = /[a-z0-9_]\.[a-z0-9]{1,5}$/;
  const QUOTES = new Set(["'", '"', "‘", "’", "“", "”", "`"]);

  function tokenize(text) {
    const out = [];
    for (const m of text.matchAll(TOKEN_RE)) out.push([m[0], m.index, m.index + m[0].length]);
    return out;
  }

  function intentFeatures(text) {
    const toks = tokenize(text).map(t => t[0]).filter(t => WORD_RE.test(t)).map(t => t.toLowerCase());
    const feats = [];
    let prev = "<s>";
    for (const t of toks) {
      feats.push("w:" + t, "b:" + prev + "_" + t);
      const p = "<" + t + ">";
      for (const n of [3, 4]) for (let i = 0; i + n <= p.length; i++) feats.push("c:" + p.slice(i, i + n));
      prev = t;
    }
    feats.push("b:" + prev + "_</s>");
    return feats;
  }

  function shape(tok) {
    let out = "";
    for (const ch of tok) {
      const c = ch >= "A" && ch <= "Z" ? "X" : ch >= "a" && ch <= "z" ? "x" : ch >= "0" && ch <= "9" ? "d" : ch;
      if (out[out.length - 1] !== c) out += c;
    }
    return out;
  }

  function quoteMask(text, toks) {
    let inside = false;
    return toks.map(([tok, s, e]) => {
      if (QUOTES.has(tok)) {
        const before = s > 0 ? text[s - 1] : " ";
        const after = e < text.length ? text[e] : " ";
        if (!(ALNUM.test(before) && ALNUM.test(after))) { inside = !inside; return false; }
      }
      return inside;
    });
  }

  function tokenFeatures(text, toks) {
    const low = toks.map(t => t[0].toLowerCase());
    const q = quoteMask(text, toks);
    const n = low.length;
    const at = i => (i < 0 ? "BOS" : i >= n ? "EOS" : low[i]);
    return low.map((w, i) => {
      const f = ["bias", "w=" + w, "s3=" + w.slice(-3), "sh=" + shape(toks[i][0]),
        "w-1=" + at(i - 1), "w-2=" + at(i - 2), "w+1=" + at(i + 1), "w+2=" + at(i + 2),
        "w-1|w=" + at(i - 1) + "|" + w, "w|w+1=" + w + "|" + at(i + 1)];
      if (EXT_RE.test(w)) f.push("ext");
      if (q[i]) f.push("inq");
      return f;
    });
  }

  function f32(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Float32Array(bytes.buffer);
  }

  // format 2: only the kept weights, 1 byte each. Per feature: count, then (intent, value) pairs.
  function unpack(m, nf) {
    const bin = atob(m.weights), K = m.intents.length, coef = new Float32Array(K * nf);
    let o = 0;
    for (let j = 0; j < nf; j++) {
      const n = bin.charCodeAt(o++);
      for (let q = 0; q < n; q++) {
        const k = bin.charCodeAt(o++), v = bin.charCodeAt(o++);
        coef[k * nf + j] = (v > 127 ? v - 256 : v) * m.scale;
      }
    }
    return coef;
  }

  function spansFromLabels(text, toks, labels) {
    const out = [];
    let cur = null;
    toks.forEach(([, s, e], i) => {
      const lab = labels[i];
      if (lab.startsWith("B-") || (lab.startsWith("I-") && (!cur || cur[2] !== lab.slice(2)))) {
        if (cur) out.push(cur);
        cur = [s, e, lab.slice(2)];
      } else if (lab.startsWith("I-") && cur) cur[1] = e;
      else { if (cur) out.push(cur); cur = null; }
    });
    if (cur) out.push(cur);
    return out.map(([s, e, n]) => ({ name: n, value: text.slice(s, e) }));
  }

  class NLU {
    constructor(m) {
      this.m = m;
      this.vocab = new Map(m.vocab.map((f, i) => [f, i]));
      this.idf = f32(m.idf);
      this.nf = m.vocab.length;
      this.coef = m.format === 2 ? unpack(m, this.nf) : f32(m.coef);
      this.L = m.labels.length;
    }
    classify(text) {
      const counts = new Map();
      for (const f of intentFeatures(text)) {
        const j = this.vocab.get(f);
        if (j !== undefined) counts.set(j, (counts.get(j) || 0) + 1);
      }
      const vec = [];
      let norm = 0;
      for (const [j, c] of counts) { const v = (1 + Math.log(c)) * this.idf[j]; vec.push([j, v]); norm += v * v; }
      norm = Math.sqrt(norm) || 1;
      const scores = this.m.intents.map((_, k) => {
        let s = this.m.intercept[k];
        const base = k * this.nf;
        for (const [j, v] of vec) s += this.coef[base + j] * v / norm;
        return s;
      });
      const mx = Math.max(...scores);
      const ex = scores.map(s => Math.exp(s - mx));
      const sum = ex.reduce((a, b) => a + b, 0);
      return ex.map((e, i) => [this.m.intents[i], e / sum]).sort((a, b) => b[1] - a[1]);
    }
    tag(text, toks) {
      const L = this.L, st = this.m.state, tr = this.m.trans;
      const em = tokenFeatures(text, toks).map(feats => {
        const row = new Array(L).fill(0);
        for (const f of feats) {
          const w = st[f];
          if (w) for (let q = 0; q < w.length; q += 2) row[w[q]] += w[q + 1];
        }
        return row;
      });
      if (!em.length) return [];
      let score = em[0].slice();
      const back = [];
      for (let t = 1; t < em.length; t++) {
        const nw = new Array(L), bp = new Array(L);
        for (let b = 0; b < L; b++) {
          let best = -1e18, arg = 0;
          for (let a = 0; a < L; a++) { const v = score[a] + tr[a][b]; if (v > best) { best = v; arg = a; } }
          nw[b] = best + em[t][b]; bp[b] = arg;
        }
        score = nw; back.push(bp);
      }
      let last = 0;
      for (let i = 1; i < L; i++) if (score[i] > score[last]) last = i;
      const path = [last];
      for (let i = back.length - 1; i >= 0; i--) path.push(back[i][path[path.length - 1]]);
      return path.reverse().map(i => this.m.labels[i]);
    }
    parse(text) {
      const t0 = performance.now();
      const ranked = this.classify(text);
      const toks = tokenize(text);
      const labels = this.tag(text, toks);
      const slots = {};
      for (const { name, value } of spansFromLabels(text, toks, labels)) if (!(name in slots)) slots[name] = value;
      return { intent: ranked[0][0], confidence: ranked[0][1], ranking: ranked.slice(0, 3),
        slots, labels, ms: performance.now() - t0 };
    }
  }
  return { NLU, tokenize, intentFeatures, tokenFeatures };
})();
if (typeof module !== "undefined") module.exports = NLURuntime;

// Rule-based date / time / duration / recurrence entities. No model, no dependencies.
// Shared by every skill that needs time: reminders, timers, calendar, "what day is ...".
// Usage: NLUEntities.parse("remind me next friday at 3pm", { now: new Date() })
// Every result carries `ambiguous` + `alternatives` so the dialogue can ask instead of guessing.

const NLUEntities = (() => {
  // ---------- numbers ----------
  const SMALL_N = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
    eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
  const TENS_N = { twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60 };
  const SMALL = "thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve";
  const NUM = `(?:\\d+(?:[.,]\\d+)?|(?:twenty|thirty|forty|fifty|sixty)(?:[\\s-](?:one|two|three|four|five|six|seven|eight|nine))?|a\\s+couple\\s+of|couple\\s+of|a\\s+couple|a\\s+few|few|several|${SMALL}|an?)`;
  const HOURW = "one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve";
  const ORD_N = { first: 1, second: 2, third: 3, fourth: 4, fifth: 5, sixth: 6, seventh: 7, eighth: 8, ninth: 9, tenth: 10,
    eleventh: 11, twelfth: 12, thirteenth: 13, fourteenth: 14, fifteenth: 15, sixteenth: 16, seventeenth: 17, eighteenth: 18,
    nineteenth: 19, twentieth: 20, thirtieth: 30 };
  const ORDW = "(?:twenty|thirty)[\\s-](?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth)|thirtieth|twentieth|nineteenth|eighteenth|seventeenth|sixteenth|fifteenth|fourteenth|thirteenth|twelfth|eleventh|tenth|ninth|eighth|seventh|sixth|fifth|fourth|third|second|first";
  // "21", "21st", "twenty-first" → 21
  function ordNum(s) {
    s = s.toLowerCase().replace(/(st|nd|rd|th)$/, m => (/^\d/.test(s) ? "" : m));
    if (/^\d+$/.test(s)) return +s;
    const [a, b] = s.split(/[\s-]/);
    return b ? (a === "twenty" ? 20 : 30) + ORD_N[b] : ORD_N[a];
  }

  function num(s) {
    s = s.trim().toLowerCase().replace(/\s+/g, " ");
    if (/^\d/.test(s)) return parseFloat(s.replace(",", "."));
    if (/couple/.test(s)) return 2;
    if (/few|several/.test(s)) return 3;
    if (s === "a" || s === "an") return 1;
    const [t, u] = s.split(/[\s-]/);
    if (t in TENS_N) return TENS_N[t] + (u ? SMALL_N[u] : 0);
    return SMALL_N[s];
  }

  // ---------- durations ----------
  const UNIT = "seconds?|secs?|minutes?|mins?|hours?|hrs?|days?|weeks?|wks?|fortnights?|months?|years?|yrs?";
  const unitKey = u => {
    u = u.toLowerCase();
    if (/^s/.test(u)) return "seconds";
    if (/^mi|^m$/.test(u)) return "minutes";
    if (/^h/.test(u)) return "hours";
    if (/^d/.test(u)) return "days";
    if (/^w/.test(u)) return "weeks";
    if (/^f/.test(u)) return "fortnight";
    if (/^mo/.test(u)) return "months";
    return "years";
  };
  const comp = named => {
    const g = n => (named ? `?<${n}>` : "?:");
    return [
      `(${g("n1")}${NUM})\\s+and\\s+a\\s+half\\s+(${g("u1")}${UNIT})\\b`,
      `(?:an?\\s+)?half\\s+(?:an?\\s+)?(${g("u2")}hour|day|minute|week|month|year)\\b`,
      `(${g("q")}(?:a\\s+)?quarter\\s+(?:of\\s+)?an?\\s+hour)\\b`,
      `(${g("hh")}\\d+)\\s*h\\s*(${g("hm")}\\d+)\\s*(?:m|min|mins)?\\b`,
      `(${g("n3")}${NUM})[\\s-]+(${g("u3")}${UNIT})\\b(${g("hf")}\\s+and\\s+a\\s+half)?`,
      `(${g("n4")}\\d+)\\s*(${g("u4")}h|m|min|mins|s|sec|secs|d)\\b`,
    ].join("|");
  };
  const COMP = `(?:${comp(false)})`;
  const DUR = `${COMP}(?:(?:\\s*,\\s*|\\s+and\\s+|\\s+)${COMP})*`;
  const COMP_RE = new RegExp(comp(true), "gi");
  const DOWN = { years: ["months", 12], months: ["days", 30], weeks: ["days", 7], days: ["hours", 24], hours: ["minutes", 60], minutes: ["seconds", 60] };

  function parseDuration(s) {
    const d = { years: 0, months: 0, weeks: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };
    const add = (unit, amount) => {
      if (unit === "fortnight") { unit = "weeks"; amount *= 2; }
      const whole = Math.floor(amount), frac = amount - whole;
      d[unit] += whole;
      if (frac > 1e-9 && DOWN[unit]) add(DOWN[unit][0], frac * DOWN[unit][1]);
      else if (frac > 1e-9) d[unit] += frac;
    };
    let any = false;
    for (const m of s.matchAll(COMP_RE)) {
      const x = m.groups;
      any = true;
      if (x.n1) add(unitKey(x.u1), num(x.n1) + 0.5);
      else if (x.u2) add(unitKey(x.u2), 0.5);
      else if (x.q) add("minutes", 15);
      else if (x.hh) { add("hours", +x.hh); add("minutes", +x.hm); }
      else if (x.n3) add(unitKey(x.u3), num(x.n3) + (x.hf ? 0.5 : 0));
      else if (x.n4) add(unitKey(x.u4), +x.n4);
    }
    return any ? d : null;
  }
  const subDay = d => d.hours || d.minutes || d.seconds;
  function shift(now, d, sign = 1) {
    const y = now.getFullYear() + sign * d.years, mo = now.getMonth() + sign * d.months;
    const day = Math.min(now.getDate(), daysIn(y, mo));
    return new Date(y, mo, day + sign * (d.days + 7 * d.weeks), now.getHours() + sign * d.hours,
      now.getMinutes() + sign * d.minutes, now.getSeconds() + sign * Math.round(d.seconds));
  }
  function durText(d) {
    const out = [];
    for (const [k, l] of [["years", "y"], ["months", "mo"], ["weeks", "w"], ["days", "d"], ["hours", "h"], ["minutes", "min"], ["seconds", "s"]])
      if (d[k]) out.push(`${+d[k].toFixed(2)} ${l}`);
    return out.join(" ");
  }
  const durSeconds = d => Math.round(((((d.years * 365 + d.months * 30 + d.weeks * 7 + d.days) * 24 + d.hours) * 60 + d.minutes) * 60) + d.seconds);

  // ---------- calendar helpers (local time, weeks start Monday) ----------
  const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
  const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const dow = d => (d.getDay() + 6) % 7; // Mon=0
  const weekStart = d => addDays(day0(d), -dow(d));
  const sameDay = (a, b) => a && b && a.getTime() === b.getTime();

  const WD = { monday: 0, mon: 0, tuesday: 1, tues: 1, tue: 1, wednesday: 2, wed: 2, thursday: 3, thurs: 3, thur: 3,
    friday: 4, fri: 4, saturday: 5, sunday: 6 };
  const WD_RE = "monday|tuesday|wednesday|thursday|friday|saturday|sunday|tues|thurs|thur|mon|wed|fri";
  const MONTHS = { january: 0, jan: 0, february: 1, feb: 1, march: 2, mar: 2, april: 3, apr: 3, may: 4, june: 5, jun: 5,
    july: 6, jul: 6, august: 7, aug: 7, september: 8, sept: 8, sep: 8, october: 9, oct: 9, november: 10, nov: 10, december: 11, dec: 11 };
  const MO_RE = "january|february|march|april|may|june|july|august|september|october|november|december|sept|jan|feb|mar|apr|jun|jul|aug|sep|oct|nov|dec";
  const RR_DAY = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"];

  // a date with no year: this year, or next year if it already passed
  function futureDate(now, m, d, y) {
    if (y) return new Date(y, m, d);
    const t = new Date(now.getFullYear(), m, d);
    return t < day0(now) ? new Date(now.getFullYear() + 1, m, d) : t;
  }
  const validDMY = (y, m, d) => m >= 0 && m < 12 && d >= 1 && d <= daysIn(y, m);

  // ---------- rules ----------
  // Each rule returns a "part"; adjacent parts (date + time, recurrence + time ...) are merged afterwards.
  const DAYPART_HOUR = { morning: 9, afternoon: 15, evening: 19, night: 21, tonight: 20 };
  const R = [];
  const rule = (src, fn) => R.push({ re: new RegExp(src, "gi"), fn });

  rule(`\\b(?:right\\s+)?now\\b`, (m, c) => ({ kind: "instant", date: c.now }));
  rule(`\\b(?:in|within|after)\\s+(?:the\\s+next\\s+)?(${DUR})`, (m, c) => rel(c, m[1], 1));
  rule(`(${DUR})\\s+(?:from\\s+now|from\\s+today|later)\\b`, (m, c) => rel(c, m[1], 1));
  rule(`(${DUR})\\s+ago\\b`, (m, c) => rel(c, m[1], -1));
  rule(`\\b(?:for\\s+)?(${DUR})`, (m) => { const d = parseDuration(m[1]); return d && { kind: "duration", dur: d }; });
  function rel(c, s, sign) {
    const d = parseDuration(s);
    if (!d) return null;
    const t = shift(c.now, d, sign);
    return subDay(d) ? { kind: "instant", date: t } : { kind: "date", date: day0(t) };
  }

  rule(`\\b(?:the\\s+)?day\\s+after\\s+tomorrow\\b`, (m, c) => ({ kind: "date", date: addDays(day0(c.now), 2) }));
  rule(`\\b(?:the\\s+)?day\\s+before\\s+yesterday\\b`, (m, c) => ({ kind: "date", date: addDays(day0(c.now), -2) }));
  rule(`\\b(today|tonight|tomorrow|tomorow|tommorow|tmrw|tmr|yesterday)\\b`, (m, c) => {
    const w = m[1].toLowerCase(), off = w === "today" || w === "tonight" ? 0 : w === "yesterday" ? -1 : 1;
    return { kind: "date", date: addDays(day0(c.now), off), daypart: w === "tonight" ? "tonight" : null };
  });
  rule(`\\b(?:(this|in\\s+the|at)\\s+)?(morning|afternoon|evening|night)\\b`, (m, c) =>
    ({ kind: "daypart", name: m[2].toLowerCase(), date: m[1] && /this/i.test(m[1]) ? day0(c.now) : null }));

  // weekdays: "friday", "this friday", "next friday", "last friday", "friday next week"
  rule(`\\b(?:(next|this|coming|last|past|on)\\s+)?(${WD_RE})\\b(?:\\s+(next\\s+week|this\\s+week|week))?`, (m, c) => {
    const mod = (m[1] || "").toLowerCase(), target = WD[m[2].toLowerCase()], suffix = (m[3] || "").toLowerCase();
    const today = day0(c.now);
    let ahead = (target - dow(today) + 7) % 7;
    if (mod === "last" || mod === "past") return { kind: "date", date: addDays(today, -(((dow(today) - target + 7) % 7) || 7)) };
    if (mod === "this" && ahead === 0) return { kind: "date", date: today };
    const coming = addDays(today, ahead || 7);
    const inNextWeek = addDays(weekStart(today), 7 + target);
    if (suffix === "this week") return { kind: "date", date: addDays(weekStart(today), target) };
    if (suffix) return { kind: "date", date: inNextWeek };
    if (mod === "next") {
      // "next friday" on a Monday: the 16th or the 23rd? Both readings are common, so flag it.
      return sameDay(coming, inNextWeek)
        ? { kind: "date", date: coming }
        : { kind: "date", date: c.opts.nextWeekday === "coming" ? coming : inNextWeek,
            ambiguous: true, alternatives: [c.opts.nextWeekday === "coming" ? inNextWeek : coming] };
    }
    return { kind: "date", date: coming };
  });
  // "on mondays" → recurrence
  rule(`\\bon\\s+(${WD_RE})s\\b`, (m) => ({ kind: "recur", freq: "WEEKLY", interval: 1, byday: [RR_DAY[WD[m[1].toLowerCase()]]] }));

  // periods: next week / this month / last year / next weekend / the week after next
  rule(`\\b(next|this|coming|last|past|the\\s+following|following)\\s+(week|weekend|month|year)\\b`, (m, c) =>
    period(c, m[2].toLowerCase(), { next: 1, coming: 1, following: 1, this: 0, last: -1, past: -1 }[m[1].toLowerCase().replace(/^the\s+/, "")]));
  rule(`\\bthe\\s+week\\s+after\\s+next\\b`, (m, c) => period(c, "week", 2));
  function period(c, unit, off) {

const FILES = {"conversation.md":"# Conversation\n\nWhat every pack shares: how people say yes and no, the words that carry no request, and what the\nengine says in its own name. One line can hold several words, separated by commas.\n\n## Yes\n- yes, yeah, yep, yup, sure, ok, okay, go ahead, do it, please do, correct, right, exactly, of course\n\n## No\n- no, nope, nah, cancel, don't, do not, never mind, not now, stop, wrong\n\n## Fillers\nTaken off the start or the end of a sentence, never from the middle.\n- please, can you, could you, would you, will you, can you please, could you please, i want you to\n- i'd like you to, just, quickly, for me, now please, so, ok so\n\n## Small words\nWords that say nothing about which skill is meant: the taught-words check doesn't count them.\n- the, a, an, to, me, my, i, i'm, it, it's, is, are, be, of, for, in, on, at, and, or, this, that\n- you, your, can, could, would, will, please, now, just, some, any, do, does, did, what, what's\n- with, from, about, there, here, up, so, then, also, us, we, our, mine, again, one, by, as\n- which, who, whom, whose, how, why, when, where, much, many, should, must, may, might, shall, was, were, been\n- have, has, had, he, she, his, her, they, them, their, these, those, if, but, not, very, too, more, most, than\n\n## Follow-up\nA sentence starting with these may complete the request before it.\n- and, and what about, what about, how about, and for, same for, also, and also, then\n\n## More\n- more, tell me more, go on, continue, and then, what else, keep going, anything else, more please\n\n## Question words\nA sentence starting with one of these is a question, and may be answered from the content.\n- what, what's, who, who's, why, how, when, where, which, is, are, does, do, did, tell, explain, describe\n\n## Chips\n- yes\n- no\n\n## Replies\n- cant: I can't do that yet. | That's not something I can do yet.\n- not sure: Do you want me to {label}?\n- unknown word: I don't know {word} yet. Do you want me to {label}?\n- ok no: OK, I won't. | Alright, never mind.\n- which one: {a}, or {b}?\n- nothing written: I don't have anything written about that. | Nothing I've been given covers that.\n- no more: That's all I have written about {title}.\n- me name: You're {value}.\n- me place: You live in {value}.\n","packs":{"about":{"pack.md":"---\nname: about\nkind: content\nabout: ptiLU itself\nfiles:\n- README.md\n- ENGINE.md\n- REVIEW-2026-10-21.md\n---\n# About ptiLU\n\nQuestions about ptiLU itself, answered from its own documents: the README, the engine's plan and the\nreview of 21 October. Any Markdown file can be listed here; headings make the sections.\n\n## Also said\nHow people ask about content, for the model to tell a question from a command.\n- what is it\n- tell me about it\n- how does it work\n- why did you build it\n- who made this\n- what went wrong\n- explain the engine\n- what does it mean\n- what is designing by abstention\n- how do you measure it\n","skills":{},"docs":[{"id":"readme","md":"# ptiLU\n\n**ptiLU** (*p'tit LU*): **P**rivate, **T**eachable, **I**nterpretable **L**anguage **U**nderstanding.\nA model of about 350 KB that understands short commands on the device, offline, and says\n\"I can't\" rather than guessing. Formerly MiniOS NLU.\n\nThe first ptiLU is a tiny, CPU-only natural language understanding model for a mini operating system running on an Orange Pi Zero 2W (Armbian). It understands an English command, picks the intent, extracts the parameters, and a small dialogue manager decides what to do and what to answer.\n\nInspired by Snips NLU: no deep learning, no network, deterministic at runtime.\n\n## Why this exists\n\nAssistants today usually sit on a large language model, a cloud connection, or both. For a\nsmall device that should do a handful of things well (make a folder, set a reminder, tell the\ntime) that is far more than needed, and it comes with the wrong trade-offs: heavy, opaque,\nonline, and confidently wrong when it hasn't understood.\n\nThis project tries the opposite: small, single-purpose \"mini-brains\" that run on the CPU of a\ncheap single-board computer, or offline in a phone's browser. It started as a way to replace a\nMiniLM sentence-embedding model with something lighter that needs no retraining from scratch\neach time a capability is added.\n\nWhat it aims for:\n\n- **Small and local.** The model is about 350 KB and trains in about a minute, on a laptop or on\n  the phone itself.\n- **Designed by abstention.** What it leaves out is part of the design: no cloud, no large\n  model, no generated text, no account, nothing collected beyond what a skill declares it\n  sends (the weather skill sends a place name). And it abstains at run time too: below its confidence threshold it says it can't,\n  before changing anything it asks when unsure, and what it didn't understand waits in an\n  inbox to be taught, never guessed. A confident wrong action is worse than \"I can't do that\".\n- **Readable without machine-learning knowledge.** What a skill understands, asks and answers\n  is written in a Markdown file. Adding a skill means writing a file, not changing the engine.\n- **Teachable by the person using it.** In that inbox, on the phone, a sentence can be added to\n  a skill, become a new skill with its own answer, or be refused; the model retrains right there.\n- **Toward permacomputing.** Plain JavaScript and Python with no frameworks or dependencies, a\n  model of about 350 KB, plain-text skill files: it should keep running offline on modest or\n  old hardware for years and stay readable by whoever inherits it. (Training and the demo\n  still rely on a modern browser and GitHub Pages.)\n\nWhat it is not: a general conversational assistant. It recognises the words its skills were\ntaught, not meaning. \"Is precipitation likely tomorrow?\" fails until a weather example uses\n\"precipitation\"; open questions are refused.\n\n## How it works\n\n- **Intent:** TF-IDF features (words, word pairs, character 3–4-grams) and a logistic regression.\n- **Slots:** a linear-chain CRF tagger (BIO labels).\n- **Training:** plain JavaScript, no dependencies (`web/trainer.js`). The same file trains in Node (`node train.js`) and in the browser, so the PWA can retrain itself on the phone. Weak weights are dropped and the rest stored as 1-byte numbers: 358 KB for 22 skills.\n- **Skills as folders:** every skill is `skills/<name>/`: a `skill.md` in plain Markdown and, only where needed, a short `skill.js`. The `skill.md` holds the example sentences, the values the skill takes and their types (`## Slots`: text, place, date or time, duration, a value from a list), the questions to ask when one is missing or wrong, what it says, the API request it makes, and whether it changes something (`acts: yes`) or needs the network (`uses: network`). The examples are also the training data: `node skills.js` turns them into sentences and checks every file, stopping with the file and the reason when something doesn't add up. `web/agent.js` is the dialogue only and knows no skill by name; `web/services.js` holds what skills share (dates in words, folders, network, memory). See `skills/README.md`.\n- **Real APIs:** weather and the time in other places come from Open-Meteo (free, no key). Only the place name and its coordinates are sent; your name and place are stored on the device only.\n- **Inbox:** every sentence the agent can't handle lands in an inbox on the device (plus any reply you flag as wrong). For each one: add it to an existing skill (tap words, then pick which of the skill's declared values they are), make a new skill from it with the answer it should give, or mark it \"not for me\". Retrain on the phone, keep the trained model across reloads, and export what was taught: training lines for existing skills, and a draft `skills/<name>/skill.md` for each new skill, ready to commit.\n- **Runtime:** the model runs in plain JavaScript (`web/runtime.js`) and in dependency-free Python (`nlu/`), both reading the same `model.json`; `python evaluate.py` checks the Python side. The dialogue, the date parser and the skills run in JavaScript only for now. How the Pi will run them (a Python port, or one JavaScript brain with the Pi executing declared commands) is still open: see `HANDOFF.md`.\n- **Dates, times, durations:** a rule-based parser (`web/entities.js`), not part of the model. It reads \"next friday at 3pm\", \"in 2 days\", \"next year\", \"timer 1h30\", \"every weekday at 8\" and flags what is ambiguous (\"next friday\" on a Monday, \"at 9\", \"3/4\") or already past, so the agent asks instead of guessing. Every skill that needs time shares it; adding one needs no retraining of this layer.\n- **Dialogue:** asks for missing or invalid values with the skill's own questions, confirms risky actions (power), asks \"Do you want me to…?\" when unsure before anything that changes something, offers a choice when a date or time is ambiguous (\"20:00 today, or 08:00 tomorrow?\"), says it needs the network when a skill does, abstains below a confidence threshold, and finds list values named anywhere in the sentence (\"it's too loud\", \"rebot the pi\") when the model didn't mark them.\n\nTry it: the `docs/` folder is a Progressive Web App that runs the model fully offline. Commands are simulated: the trace shows the shell command that would run on the device.\n\n## Skills\n\nThe values each skill takes, as declared in its `skill.md`. Dates, times and durations are read\nby the date parser, not marked by the model.\n\n| skill | values | changes something |\n|---|---|---|\n| `create_folder` | name, location | yes |\n| `create_file` | name, file_type, location | yes |\n| `open_file` | name, location | yes |\n| `open_app` | app (from a list) | yes |\n| `adjust_volume`, `adjust_brightness` | direction (from a list), level | yes |\n| `power` | power_action (from a list) | confirms every time |\n| `system_status` | metric | no |\n| `get_time` | place | no |\n| `get_date` | day (date) | no |\n| `get_weather` | place (home by default), day (date); needs the network | no |\n| `set_timer` | duration | yes |\n| `set_reminder` | task, when (date and time) | yes |\n| `remember_me` | name, place | yes |\n| `recall_me` | none | no |\n| `forget_me` | none | yes |\n| `greet`, `thanks`, `help` | none | no |\n| `affirm`, `deny`, `out_of_scope` | none (the dialogue's yes, no and \"I can't\") | no |\n\n## Layout\n\n```\ndata/\n  synth_*.md            externally generated batches, cleaned\n  synth_moved.md        time requests that were labelled out_of_scope before the time skills\n  test.md               handwritten held-out set\n  skills.md             generated from skills/ (don't edit)\nnlu/\n  features.py           tokenizer and features (mirrored in web/runtime.js)\n  dataset.py            annotated Markdown parser\n  runtime.py            dependency-free inference (the Pi side)\nskills/                 one folder per skill: skill.md + optional skill.js (see skills/README.md)\nweb/\n  runtime.js            JS inference, same model.json\n  trainer.js            JS training: TF-IDF + logistic regression (L-BFGS), CRF, pruning, export\n  inbox.js              inbox storage, triage decisions, Markdown export (on the device)\n  entities.js           rule-based dates, times, durations, recurrences\n  agent.js              dialogue: routes to skills, questions, confirmations, choices, sequences\n  services.js           shared services for skills: dates in words, folders, network, memory\n  template.html         the page; build_web.py fills in model, code and data\npwa/                    PWA assets (manifest, icons, service worker template)\ndocs/                   built PWA, served by GitHub Pages\nmodels/model.json       exported model (with its held-out scores)\ntests/                  recorded API answers, expected dialogue transcript\n```\n\n## Data format\n\n```\n## intent: create_folder\n- make a folder called [reports](name) in [documents](location)\n```\n\n## Commands\n\n```\nnode train.js                    # compile the skills, train the shipped model, print held-out scores\npython build_web.py              # build the PWA in docs/ (standard library only)\nTZ=Europe/Berlin node test_entities.js   # date/time parser against fixed phrases\nTZ=Europe/Berlin node test_dialogue.js   # replay scripted conversations; fails if a reply changed\n                                         # (--update accepts the new replies, -v prints them)\npython evaluate.py               # the Python runtime (Pi side) against the test set\n```\n\nTraining takes about a minute on a laptop, in Node or in the browser (training files are listed in `data/manifest.json`). Inference runs in well under a millisecond per sentence.\n\nHeld-out, on the 144 handwritten test sentences that appear in no training file: intent accuracy 97.2%, slot F1 0.96.\n\nThe scikit-learn reference trainer, the dataset cleaning and cross-validation scripts and the raw generated batches were removed on 13 October 2026; they are in the git history before that date.\n"},{"id":"engine","md":"# The ptiLU engine\n\nBranch `engine`, started 20 November 2026. Gab: \"the engine is the correct direction\", after reading how\nNod (n8n Labs' personal agent) is built and setting it beside TermNL's skills. `main` is untouched: this\nis a new core in `engine/`, reusing what was measured and works (the model, the date parser).\n\n**What it is.** A teachable core that understands short requests and questions on the device, offline,\nwith no generated text. It has no domain of its own: domains come as **packs** of plain Markdown files.\nAnyone retrains it by writing sentences.\n\n**The rule that keeps it honest.** The engine never exists without a real pack on it, tested on real\nconversations. The first two packs are `everyday` (time, timers, reminders, you) and `about` (questions\nabout written content, with follow-ups: what my-agent was trying to do).\n\n## Four outcomes\n\nEvery turn ends in one of four, as in TermNL:\n\n- **act**: understood and complete. A command runs, or an answer is given.\n- **ask**: a value is missing or unclear, or the request isn't surely understood.\n- **approve**: the action is risky; the person says yes first.\n- **abstain**: \"I can't\", said plainly. The sentence waits in the inbox to be taught.\n\n## What was borrowed, and from where\n\n**From Nod: a small index first, the detail on demand.** Every pack declares its skills in one line\neach (`does: set timer`, `label: set a timer`). The engine reads only that index to decide *where* a\nsentence goes: a skill, the content, or nowhere. Then it opens the one skill file it needs, for its\nvalues, questions and replies. Each pack owns its vocabulary, so the content doesn't blur the commands.\n\n**From Nod: memory and content without embeddings.** Found by word matching (BM25), always with its\nsource. An answer is a sentence that exists in a file, never one composed by a model. What the engine\nkeeps about you is stored only with the quote you said it in, and refused if the quote doesn't hold\nthe value.\n\n**From Nod: learned skills.** A sentence taught in the inbox becomes a pattern with placeholders\n(\"remind me to {task} when I'm home\"), written under `## Learned` in that skill's file, with the\nsentence it came from. It works at once, without retraining. Lines you write yourself under\n`## People say` are yours: the engine never changes them.\n\n**From TermNL: the skill file.** Action × object, \"People say\" patterns read exactly before any model,\n\"What it needs\" in plain words, replies with variants, a `tests.md` per skill of sentences never trained on.\n\n**From ptiLU main: the model and the date parser.** Patterns come first; when none reads the sentence,\nthe trained model (TF-IDF + logistic regression, `web/trainer.js`) picks the skill. Measured on 20\nNovember on ptiLU's held-out sentences: the model 96.4%, nearest-sentence matching 89.7%. So the model\nstays as the fallback. Dates, times and durations come from `web/entities.js` (rule-based).\n\n**Not borrowed:** Nod's trust check exists in ptiLU already (`acts: yes`, `approve: yes`), and its LLM\nparts have no place here.\n\n## A skill file\n\n`engine/packs/<pack>/skills/<action-object>/skill.md`\n\n```markdown\n---\ndoes: set timer\nlabel: set a timer\nacts: yes          # changes something: when unsure, ask \"Do you want me to…?\" first\napprove: no        # yes: always ask first\n---\nWhat it does, for whoever reads this file.\n\n## People say\n- set a timer for {duration}\n- (start/set) (a/the) timer (for) {duration}\n\n## Also said\n- wake me in twenty minutes\n\n## What it needs\n- {duration}: a duration. If it's missing, ask: For how long? | How long should it run?\n\n## Does\ntimer.start {duration}\n\n## Replies\n- done: Timer set for {duration}. | OK, {duration} on the clock.\n\n## Learned\n- give me {duration} on the clock  ← \"give me 10 minutes on the clock\" (2026-11-20)\n```\n\nPatterns: `(a/the)` is optional, `to/into` is one of, `{name}` is a value. Kinds of value: *a duration*,\n*a date and time*, *a date*, *a name*, *a place*, *some text*, *one of: low, medium, high*. A reply can\nread the device: `{@time}`, `{@date}`, `{@me.name}`.\n\n## A content pack\n\n`engine/packs/<pack>/pack.md` says `kind: content` and lists the files it reads. Any Markdown file works:\nheadings make sections. A file can also say, in its front matter, which questions it answers:\n\n```markdown\n---\ntitle: ptiLU\nquestions:\n- what is ptilu\n- why is it so small\nanswer: A model of about 350 KB that understands short commands on the device, offline.\nnext: engine\n---\n```\n\nA question matching one of those gets the written answer. Otherwise the best section answers with its\nfirst sentences and says where they come from. \"Tell me more\" continues the same section, then the next;\n\"and how does it learn?\" stays in the same file first. Nothing found: \"I don't have anything written\nabout that.\"\n\n## The budget\n\nThe engine's own code (`engine/*.js`, without the packs, the tests and the reused model and date parser)\nstays under main's core: 1,009 lines in `web/agent.js`, `services.js`, `inbox.js` and `skills.js`. Every pack ships with tests of its own, and the conversations from\n`REVIEW-2026-10-21.md` that concern its skills are its acceptance test.\n\n## The model, rethought (20 November)\n\nGab: \"our current model was perhaps not trained in the best way or aligned with our new plan\". Nod's\nlesson is that the model is the first layer, never the last. So:\n\n- **It only proposes where a sentence goes**: a skill, `ask` (the content), or `out_of_scope`. No slot\n  model: values come from the patterns and their kinds.\n- **It learns from the pack files alone**: every pattern with its optional parts on and off, every \"Also\n  said\" line, the content's questions and headings, the out-of-scope lines. 332 sentences, trained in\n  0.2 s, 29 KB (main: 6,286 sentences, about a minute, 358 KB). Teaching on the phone retrains it at once.\n- **A check decides**: the skill acts only if every word that isn't a value is one the skill was taught\n  (or one letter from one). Otherwise it asks, naming the word: \"I don't know “clock” yet. Do you want me\n  to set a timer?\" A yes puts the sentence in the inbox with that skill already picked.\n- **Small talk only when sure**: a model guess never says hello or thank you below 0.7.\n- **A command is never answered with a quote**: the content is searched only for a question (a question\n  word, a \"?\", or the model saying `ask`). \"move ideas to documnet\" is in the review word for word; it\n  isn't an answer to itself.\n\n## Where it stands (20 November)\n\n`node engine/test.js`:\n\n| | sentences | right | asked first | \"I can't\" | wrong action |\n|---|---|---|---|---|---|\n| dialogue scripts | 15 scripts | all pass | | | |\n| `tests.md`, every skill | 46 | 29 | 10 | 7 | 0 |\n| main's handwritten held-out, skills in the packs | 51 | 25 | 19 | 7 | 0 |\n| main's handwritten held-out, skills elsewhere (files, weather…) | 140 | 135 | 5 | | 0 |\n| the 21 October conversations | 6 | 5 | 1 | | 0 |\n\nRead honestly:\n- **It never did the wrong thing**, including \"create a new seed.md inside ideas folder\" and \"xyzzy flurb\n  remind me plonk\", the two that broke main.\n- **It asks much more than main.** Main's model gets 50 of those 51 intents right, but that is the intent\n  alone, with no check, from 6,286 training sentences. The engine knows only the words its packs teach:\n  \"is it past midnight already\" is \"I can't\" until a time sentence uses \"midnight\". Each one taught in\n  the inbox becomes right at once. That is the trade, chosen: ask, never guess.\n- **The `tests.md` files were written alongside the patterns, so they aren't truly blind.** Sentences\n  written by someone else are the next real measure.\n- Main's held-out set wasn't used to tune anything here; it only measures.\n\n## Content as a search engine (20 November, later)\n\nGab: the content skill \"should act as a search engine, finding keywords or concepts that match the\nquestion, then use part of the content to formulate replies, moving the search window in the document\nwhen a follow-up comes\". That is how it works now:\n\n- **Search:** words (BM25, endings off, ise/ize as one, a typo read as the known word one letter away),\n  plus what a file declares: `keywords:` and `themes:` say what it is about, `answers:` the questions the\n  whole piece answers (with its `answer:`), and `questions:` with `see:` point a question to the passage\n  that answers it. my-agent's work files are read as they are.\n- **The bar:** half of the question found in a passage whose title or heading is the topic; a little under\n  half for a question a file lists. A sentence that isn't asked as a question (\"my kids live abroad with\n  their mother\") only reaches what the files list, never a passage that happens to share its words.\n- **The reply:** sentences from the file, with where they come from. A sentence that ends on \":\" brings its\n  list; a very short one brings the next.\n- **The moving window:** \"tell me more\" goes on from the last sentence said; a follow-up question looks\n  in the same file first, and the passage it's on and the ones beside it most (\"why a stone?\", then \"how\n  is it made?\" stays in Pebbble's stone section).\n- **Teaching:** a question it had nothing for is pointed, from the inbox, to the passage that answers it\n  (`questions: - q: … see: …`). Accepted only if the passage is in the file and the question then finds it.\n\nMeasured on my-agent's five work pages, with its own `tests/held-out.json` (56 answerable questions, 10\nnear-misses, 25 off-topic, 10 requests for services), through the whole engine with the everyday pack:\n\n| | right piece | of which the expected passage | wrong piece | nothing | off-topic answered | requests answered |\n|---|---|---|---|---|---|---|\n| my-agent's matcher (main) | 29 | (pieces only) | 3 | 24 | 0 | 3 (1 + 2 partial) |\n| the engine | 41 | 19 | 1 | 14 | 0 | 1 |\n\nmy-agent's own `tests/check.js` cases on those pieces: 17 of 19 (it passes its own 20 of 20). Read\nhonestly: the bar for listed questions (0.45) was chosen on this held-out set, so it is no longer blind;\nthe questions and labels were written by Claude, not visitors. The 14 it can't find are concepts the\nwords don't share (\"democratise prototyping\"): teaching is how they get found, one question at a time.\n\n## Not done yet\n\n- Follow-ups carry only values with a shape (durations, dates): \"and 5 minutes\" works, \"and for buy milk\"\n  doesn't.\n- To try it on the phone: in the repository's Settings → Pages, set the branch to `engine` (folder\n  `/docs`). The engine is then at `/ptiLU/engine/`, and main's app stays at `/ptiLU/` (this branch still\n  holds it). Set it back to `main` afterwards.\n- TermNL's board skills as a pack, my-agent's content as a pack, the same engine on the board.\n\n## Run\n\n```\nnode engine/train.js            # the packs → engine/model.json\nnode engine/test.js             # the dialogue scripts, tests.md, the held-out set, the review, teaching\nnode engine/chat.js             # talk to it in the terminal (/inbox, /teach <skill> slot=words)\nnode engine/build.js            # engine/index.html and docs/engine/: the engine, packs and model in one offline page\n```\n\nCore size: 871 lines in `engine/*.js` (without test.js, chat.js and build.js), against 1,009 for main's\n`web/agent.js`, `services.js`, `inbox.js` and `skills.js`.\n"},{"id":"review-2026-10-21","md":"\n# Review of 21 October 2026: the vision, the technique, the derailment\n\nWritten at Gab's request (\"document this and push\") after a phone test of the `principles`\nbranch, and his question: \"So we created ptiLU with a vision, and built all of it to learn it\ncannot fulfil the vision, or rather to learn you derailed it? Be honest and critical.\"\nThe assessment below is Claude's; Gab's words are quoted.\n\n## The test that settled it\n\nA plain conversation on the phone, `principles` branch (2ce6ab3):\n\n- \"move ideas to documnet\" → \"I don't know “ideas”, “documnet” yet. Which file or folder?\"\n  The value finder marked nothing, so the values looked like untaught words.\n- \"move the ideas folder inside the document folder\", while that question was pending →\n  \"OK, move the ideas folder moves to Documents.\" The whole new sentence was taken as the name.\n- \"please create a new seed.md inside ideas folder\" → a *folder* named seed.md. The skill picker\n  saw \"create\", \"new\", \"folder\"; it can't see that \"seed.md\" has the shape of a file.\n- \"I don't know a folder called “ideas”\", a folder it had just created: no picture of the device.\n\nGab: \"This tells me our model is confidently doing the wrong thing. And rather than patching we\nshould reflect on the vast amount of code rules and principles that increase the state size and\nstill let it drift.\"\n\n## Both: the first use case outran the technique, and Claude derailed it\n\n**The technique's limit is real.** The model reads a sentence as a bag of words. It works where\nwords alone decide: few intents, closed values, short commands (time, date, weather, timers,\nreminders, volume, brightness, power, opening apps, sending to the phone). It cannot see\nstructure: which word is the action, which the object, what shape a value has, what exists on\nthe device. The first concrete test chosen for ptiLU, a mini OS that creates files and folders,\nneeds exactly that. The evidence was in the 13 October handoff: names containing \"and\", names\nwith an apostrophe, 5 of 9 held-out errors being values cut short or missed. Nobody said plainly\nthen: this model will carry closed commands, not file operations.\n\n**The derailment is real too, and it is Claude's.**\n- *Scope across sessions:* declarative requests, webhooks, Telegram, maps, value types, the\n  lexicon, proposed and built eagerly by Claude instances on a model whose first use case was\n  not proven. Gab pulled the webhooks back himself on 13 October (\"Back to light\").\n- *Patching in this session:* the night's diagnosis was sound (the model counts evidence for a\n  skill, never against; the cross-validation was leaking). After it, each phone test got code:\n  dropped values, folder checks, folder guessing, a runner-up rule (held, never pushed). At\n  01:47 Gab asked whether the fix would inflate the code; Claude said no; the core grew 9%.\n  Claude reported \"0 wrong actions\" on test sets that held no real conversation with files.\n  The brain's rule to ask \"what is it for?\" when a feature arrives was not followed once.\n\nGab, 10:29: \"I am feeling that the version on main was simpler and perhaps better. I think you\nhave overengineered without considering the purpose nor asking or validating the direction it\nshould have taken ... Or it is on me not being clear enough.\" Claude's reading: the purpose was\nclear (light, teachable, readable, no inflation); the failure to check against it was Claude's.\n\n## What the honest path would have been\n\nTest a few real conversations per skill early. Say around 13 October that this technique carries\nclosed commands, not file operations. Give files a grammar. Freeze the core. Grow through the\nskill files and the inbox.\n\n## What the day still established (measured)\n\n- Choosing the skill: 97.5% on handwritten sentences; the model alone is fine for closed commands.\n- The cross-validation used until 20 October leaked: random folds put each sentence's twin from\n  the same example line in training. Holding out whole example lines doubles the abstentions.\n- The model's confidence can't tell \"understood\" from \"recognised one word\" (\"xyzzy flurb remind\n  me plonk\" → set_reminder 0.99). The taught-words check (ask instead of act) cut wrong actions\n  without asking from 178 to 21–24 in 7,108 sentences under the strict cross-check, but it does\n  not see structure, so it let \"seed.md\" through.\n- The exact-match layer (example lines as patterns) changed no decision: removed.\n- Value typing for routing measured flat: removed.\n- Several commands per sentence: Gab, \"interesting on paper but bad in practice\": removed.\n- Folders were found right 99% of the time; the folder trouble came from names the model had\n  never seen and from having no picture of the device, not from the value finder.\n\n## Where the branches stand\n\n- `main` (17e13ff): the simpler version, unchanged. Gab: \"perhaps better\".\n- `principles` (2ce6ab3): four principles in the dialogue, two thresholds instead of seven, values\n  read for the chosen skill, the taught-words check, the tokenizer reading any alphabet. Core code\n  1,083 lines against 993 on main. Kept as a record; nothing is merged.\n- `act-ask-abstain`, `act-ask-cant`, `value-types`: superseded by `principles`.\n- Worth carrying to main if Gab wants, each small: the tokenizer fix (Kraków, Tübingen were cut),\n  the move skills' reply fix (they crashed: reply named `done`, not `say`), maybe the taught-words\n  check. Gab to say.\n\n## The direction proposed (not decided)\n\nFor a natural-language interface to a Linux board, a different technique for the shell part:\na small grammar of commands (create / open / move / delete / list + file / folder + in / to),\nvalues recognised by their shape and checked against the real disk, \"I can't\" for any phrasing\nit doesn't know. The ptiLU model stays for closed commands, where it works. Not an LLM: hundreds of\nMB, no \"why\", and the same memory wall MiniLM hit on Babiban. Babiban is the precedent: when the\nmodel didn't fit, a hand-written tagger and match grammar did. Gab to decide whether the file\nsystem belongs in ptiLU at all, and whether to pause.\n"},{"id":"ptilu","md":"---\ntitle: ptiLU\nquestions:\n- what is ptilu\n- what does ptilu mean\n- what is this\n- who are you\n- what does the name mean\nanswer: ptiLU (p'tit LU) stands for Private, Teachable, Interpretable Language Understanding: a small model that understands short commands on the device, offline, and says \"I can't\" rather than guessing.\nnext: engine\n---\n# ptiLU\n\nptiLU (p'tit LU) stands for Private, Teachable, Interpretable Language Understanding. It understands\nshort requests on the device, offline, and says \"I can't\" rather than guessing.\n\n## Why it is small\nAssistants usually sit on a large language model, a cloud connection, or both. For a small device that\nshould do a handful of things well, that is far more than needed: heavy, opaque, online, and confidently\nwrong when it hasn't understood. ptiLU tries the opposite: small, single-purpose minds that run on the CPU\nof a cheap board, or offline in a phone's browser.\n\n## How you teach it\nWhat it didn't understand waits in an inbox. There, a sentence can be added to a skill, become a new skill\nwith its own answer, or be refused. A taught sentence becomes a pattern with placeholders, written in the\nskill's own file, and works at once.\n"}]},"everyday":{"pack.md":"---\nname: everyday\nkind: skills\n---\n# Everyday\n\nWhat a phone or a small board can do alone, offline: the time and the date, timers and reminders, and\nwhat you tell it about yourself. Nothing here needs an account or the network.\n","skills":{"check-date":{"skill.md":"---\ndoes: check date\nlabel: tell the date\n---\nToday's date on this device.\n\n## People say\n- what's the date (today)\n- what is the date (today)\n- what day is it (today)\n- what's today's date\n- what is today's date\n- what's today\n- which day is it (today)\n- (tell me) the date (please)\n- what's the day today\n\n## Also said\n- what day of the week is it\n- can you tell me the date\n- what's the date, I need it for a form\n- is it friday today\n- which date are we\n\n## Replies\n- done: Today is {@date}. | It's {@date}.\n","tests.md":"# Tests: check-date\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- what's the date today please\n- tell me today's date\n- what day are we\n- which day of the week is today\n- date please\n- do you know the date\n"},"check-time":{"skill.md":"---\ndoes: check time\nlabel: tell the time\n---\nThe time on this device.\n\n## People say\n- what time is it (now/please)\n- what's the time (now/please)\n- what is the time (now)\n- (tell me) the time (please)\n- time (please)\n- do you know what time it is\n- have you got the time\n\n## Also said\n- what's the time right now\n- could you tell me what time it is\n- what hour is it\n- is it late already\n- how late is it\n\n## Replies\n- done: It's {@time}. | {@time}.\n","tests.md":"# Tests: check-time\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- what time is it right now\n- tell me the current time\n- do you have the time\n- time check\n- what's the clock say\n- is it noon yet\n"},"forget-me":{"skill.md":"---\ndoes: forget me\nlabel: forget what it knows about you\napprove: yes\n---\nClears everything it keeps about you. Asks first, every time.\n\n## People say\n- forget (everything) (about) me\n- forget my name\n- forget where i live\n- forget (everything) (what) you know about me\n- delete (everything) (you know) about me\n- (please) forget everything\n\n## Also said\n- erase what you know about me\n- wipe my data\n- I want you to forget me\n\n## Does\nmemory.forget\n\n## Replies\n- approve: Forget everything I know about you?\n- done: Done, I've forgotten everything about you.\n- empty: I didn't know anything about you.\n","tests.md":"# Tests: forget-me\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- forget all about me\n- remove what you know about me\n- clear my details\n"},"greet":{"skill.md":"---\ndoes: greet\nlabel: say hello\nrole: talk\n---\n## People say\n- hi (there)\n- hello (there)\n- hey (there)\n- good morning/afternoon/evening\n- morning\n- hiya\n- yo\n\n## Also said\n- hello ptilu\n- hi, how are you\n- hey, good to see you\n\n## Replies\n- done: Hello! What can I do for you? | Hi. What do you need?\n","tests.md":"# Tests: greet\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- hello hello\n- good morning ptilu\n- hey hey\n"},"help":{"skill.md":"---\ndoes: help\nlabel: say what it can do\nrole: talk\n---\n## People say\n- help\n- what can you do\n- what do you do\n- how can you help (me)\n- what are you able to do\n- what can i ask (you)\n\n## Also said\n- what are your skills\n- show me what you can do\n- I'm lost, help me\n\n## Replies\n- done: I can {@skills}. And I can answer questions about {@content}.\n","tests.md":"# Tests: help\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- what are you good at\n- what can I say to you\n- help me please\n"},"recall-me":{"skill.md":"---\ndoes: recall me\nlabel: say what it knows about you\n---\nWhat it keeps about you, and nothing else.\n\n## People say\n- what's my name\n- what is my name\n- who am i\n- where do i live\n- what do you know about me\n- (do you) know my name\n- (do you) remember my name\n- what do you remember about me\n- tell me what you know about me\n\n## Also said\n- what have I told you about me\n- do you remember where I live\n- say my name\n\n## Does\nmemory.recall\n\n## Replies\n- done: {@me}\n- empty: I don't know anything about you yet. Tell me your name: \"call me …\".\n","tests.md":"# Tests: recall-me\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- do you know who I am\n- what did I tell you my name was\n- what do you have on me\n"},"remember-name":{"skill.md":"---\ndoes: remember name\nlabel: remember your name\nacts: yes\n---\nWhat to call you. Kept on this device only, with the sentence you said it in.\n\n## People say\n- (you can) call me {name}\n- my name is {name}\n- my name's {name}\n- i'm called {name}\n- (remember (that)) my name is {name}\n- (please) call me {name} from now on\n\n## Also said\n- I'd like you to call me Sam\n- the name is Eva\n- you can address me as Gab\n\n## What it needs\n- {name}: a name. If it's missing, ask: What should I call you?\n\n## Samples\n- name: Gab | Eva | Sam | Noor | Kenji\n\n## Does\nmemory.set name {name}\n\n## Replies\n- done: Nice to meet you, {name}. | OK, I'll call you {name}.\n- refused: I didn't catch your name.\n","tests.md":"# Tests: remember-name\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- call me Noor\n- my name is Kenji\n- you can call me Lou\n- from now on call me Gab\n"},"remember-place":{"skill.md":"---\ndoes: remember place\nlabel: remember where you live\nacts: yes\n---\nWhere home is. Kept on this device only, with the sentence you said it in.\n\n## People say\n- i live in {place}\n- (remember (that)) i live in {place}\n- my home is (in) {place}\n- home is {place}\n- i'm living in {place}\n- i've moved to {place}\n\n## Also said\n- I'm based in Munich\n- I stay in Lyon these days\n- my town is Kyoto\n\n## What it needs\n- {place}: a place. If it's missing, ask: Where do you live?\n\n## Samples\n- place: Munich | Paris | Kyoto | Lisbon | Shenzhen\n\n## Does\nmemory.set place {place}\n\n## Replies\n- done: OK, home is {place}. | Noted: you live in {place}.\n- refused: I didn't catch the place.\n","tests.md":"# Tests: remember-place\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- I live in Lisbon\n- I moved to Berlin\n- home is Shenzhen now\n"},"set-reminder":{"skill.md":"---\ndoes: set reminder\nlabel: set a reminder\nacts: yes\n---\nA reminder on this device, once. A day without a time is 9:00. When a time could be two (\"at 9\"),\nit asks which one.\n\n## People say\n- remind me (to) {task} {when}\n- remind me {when} to {task}\n- {when} remind me to {task}\n- remind me to {task}\n- remind me (about) {task} {when}\n- remind me about {task}\n- remind me {when}\n- (set/add/make/create) a reminder (to/for/about) {task} {when}\n- (set/add/make/create) a reminder (for/at/on) {when}\n- (set/add/make/create) a reminder (to/for/about) {task}\n- (set/add/make/create) a reminder\n- don't let me forget to {task} ({when})\n- (ping/nudge) me {when} (to/about) {task}\n\n## Also said\n- I need a reminder to water the plants tonight\n- make sure I don't forget to pay the rent\n- can you remind me later\n- remember to buy milk tomorrow\n- I keep forgetting to call the bank, remind me on monday\n\n## What it needs\n- {task}: some text. If it's missing, ask: What should I remind you of? | Remind you to do what?\n- {when}: a date and time. If it's missing, ask: When? | When should I remind you?\n\n## Samples\n- task: call mum | buy milk | water the plants | send the invoice | oil the cedar box | book the dentist\n\n## Does\nreminder.add {when} {task}\n\n## Replies\n- done: I'll remind you to {task} on {when}. | OK: {task}, {when}.\n","tests.md":"# Tests: set-reminder\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- remind me to call the bank tomorrow at 10\n- could you remind me to feed the cat tonight\n- set a reminder to print the tickets on friday\n- remind me next monday to pay the rent\n- don't let me forget to charge the camera\n- create a reminder\n"},"set-timer":{"skill.md":"---\ndoes: set timer\nlabel: set a timer\nacts: yes\n---\nA countdown on this device. It rings when the time is up.\n\n## People say\n- (set/start) (a/the) timer (for) {duration}\n- (set/start) (a/the) {duration} timer\n- timer (for) {duration}\n- {duration} timer\n- (set/start) (a/the) timer\n- countdown (of/for) {duration}\n- (set/start) (a) countdown (of/for) {duration}\n\n## Also said\n- wake me in twenty minutes\n- give me ten minutes\n- I need a timer\n- let me know when 5 minutes are up\n- time 3 minutes for the eggs\n- ring in an hour\n\n## What it needs\n- {duration}: a duration. If it's missing, ask: For how long? | How long should it run?\n\n## Does\ntimer.start {duration}\n\n## Replies\n- done: Timer set for {duration}. | OK, {duration} on the clock.\n","tests.md":"# Tests: set-timer\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- put a timer on for 25 minutes\n- start a ten minute countdown\n- timer twelve minutes\n- could you set a timer of 45 seconds\n- I need a 2 hour timer\n- set the timer\n"},"thanks":{"skill.md":"---\ndoes: thank\nlabel: say thanks\nrole: talk\n---\n## People say\n- thanks (a lot)\n- <script>
const store = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const packs = EngineLoad.fromFiles(FILES);
const memory = store.get("ptilu.engine.me") || {};
const engine = new EngineCore.Engine({ skills: packs.skills, talk: packs.talk, memory,
  content: packs.docs.length ? new EngineContent.Content(packs.docs, packs.talk.small, packs.topics) : null,
  model: new NLURuntime.NLU(MODEL) });
const taught = store.get("ptilu.engine.taught") || [];
for (const t of taught) EngineLearn.teach(engine, t.sentence, t.skill, t.marks);
const retrain = () => { engine.model = new NLURuntime.NLU(NLUTrainer.train(EngineTrain.examples(packs), { log: () => {} })); };
if (taught.length) retrain();

const $ = s => document.querySelector(s), log = $("#log");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
function say(text) {
  const me = el("div", "turn me", text); log.append(me);
  const r = engine.respond(text);
  store.set("ptilu.engine.me", engine.memory);
  const t = el("div", "turn"); t.append(el("div", "", r.say));
  t.append(el("div", "why", `${r.outcome} · ${r.why || ""}${r.command ? " → " + r.command : ""}${r.source ? " · from " + r.source : ""}`));
  if (r.chips && r.chips.length) { const c = el("div", "chips"); for (const x of r.chips) { const b = el("button", "", x); b.onclick = () => say(x); c.append(b); } t.append(c); }
  log.append(t); log.scrollTop = log.scrollHeight;
}
$("form.say").onsubmit = e => { e.preventDefault(); const v = $("#q").value.trim(); if (v) say(v); $("#q").value = ""; };
$("#tab").onclick = () => { document.body.classList.toggle("inbox"); $("#tab").textContent = document.body.classList.contains("inbox") ? "Chat" : "Inbox"; drawInbox(); };

// the inbox: pick the skill a sentence meant, mark its values, and it's learned at once
function drawInbox() {
  const box = $("#inbox"); box.innerHTML = "";
  if (!engine.inbox.length) box.append(el("p", "why", "Nothing waiting. What I can't do lands here, to be taught."));
  for (const item of engine.inbox) {
    const d = el("div", "item"); d.append(el("div", "", item.sentence), el("div", "why", item.why));
    const sel = el("select"); sel.append(el("option", "", "teach it to…"));
    for (const s of engine.skills) { const o = el("option", "", s.label); o.value = s.name; sel.append(o); }
    const slots = el("div"), msg = el("div", "why");
    sel.onchange = () => {
      slots.innerHTML = "";
      const s = engine.byName.get(sel.value); if (!s) return;
      for (const slot of Object.keys(s.needs)) { const i = el("input"); i.placeholder = `${slot}: the words that are it`; i.dataset.slot = slot; slots.append(i); }
      const b = el("button", "go", "Teach"); slots.append(b);
      b.onclick = () => {
        const marks = {};
        for (const i of slots.querySelectorAll("input")) if (i.value.trim()) marks[i.dataset.slot] = i.value.trim();
        const r = EngineLearn.teach(engine, item.sentence, sel.value, marks);
        msg.textContent = r.ok ? "Learned: " + r.pattern : "Not learned: " + r.why;
        if (r.ok) { taught.push({ sentence: item.sentence, skill: sel.value, marks }); store.set("ptilu.engine.taught", taught); retrain(); setTimeout(drawInbox, 900); }
      };
    };
    const no = el("button", "", "not for me"); no.onclick = () => { engine.inbox.splice(engine.inbox.indexOf(item), 1); drawInbox(); };
    d.append(sel, no, slots, msg); box.append(d);
    if (item.suggest) { sel.value = item.suggest; sel.onchange(); }
  }
  if (taught.length) {
    const lines = taught.map(t => `${t.skill}: ${(engine.byName.get(t.skill).patterns.find(p => p.quote === engine.clean(t.sentence)) || {}).pattern}  ← "${t.sentence}"`);
    box.append(el("h3", "", "Taught on this phone"), el("pre", "", lines.join("\n") + "\n\nCopy these under ## Learned in each skill.md to keep them."));
  }
}
say("hello");
</script>
