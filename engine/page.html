<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ptiLU engine</title>
<style>
  :root { --bg: #f6f4ef; --ink: #1d1c1a; --soft: #77736b; --line: #dcd7cc; --me: #e8e3d8; --accent: #3b5b4a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171716; --ink: #ecebe6; --soft: #9a968d; --line: #33322f; --me: #26251f; --accent: #8fb89f; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; gap: 1rem; align-items: baseline; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  header b { font-weight: 600; } header button { margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 1rem; }
  .turn { margin: 0 0 .9rem; max-width: 38rem; }
  .me { margin-left: auto; background: var(--me); padding: .45rem .75rem; border-radius: .8rem; width: fit-content; }
  .why { color: var(--soft); font-size: .78rem; margin-top: .2rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .4rem; }
  button { font: inherit; font-size: .9rem; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 1rem; padding: .25rem .7rem; }
  button.go { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  form.say { display: flex; gap: .5rem; padding: .7rem 1rem; border-top: 1px solid var(--line); }
  form.say input { flex: 1; font: inherit; padding: .55rem .8rem; border-radius: 1.2rem; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  #inbox { display: none; } body.inbox #inbox { display: block; } body.inbox #log, body.inbox form.say { display: none; }
  .item { border-bottom: 1px solid var(--line); padding: .8rem 0; }
  .item select, .item input { font: inherit; font-size: .9rem; margin: .3rem .3rem 0 0; padding: .2rem .4rem; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: .3rem; }
  pre { white-space: pre-wrap; font-size: .8rem; color: var(--soft); }
</style>
</head>
<body>
<header><b>ptiLU</b><span class="why">engine · <span id="built"></span></span><button id="tab">Inbox</button></header>
<main id="log"></main>
<main id="inbox"></main>
<form class="say"><input id="q" placeholder="Ask or tell me something" autocomplete="off"><button class="go">Send</button></form>
<script>
/*SCRIPTS*/
</script>
<script>
const store = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const packs = EngineLoad.fromFiles(FILES);
const memory = store.get("ptilu.engine.me") || {};
const engine = new EngineCore.Engine({ skills: packs.skills, talk: packs.talk, memory,
  content: packs.docs.length ? new EngineContent.Content(packs.docs, packs.talk.small, packs.topics) : null,
  model: new NLURuntime.NLU(MODEL) });
const taught = store.get("ptilu.engine.taught") || [];
for (const t of taught) EngineLearn.teach(engine, t.sentence, t.skill, t.marks);
const retrain = () => { engine.model = new NLURuntime.NLU(NLUTrainer.train(EngineTrain.examples(packs), { log: () => {} })); };
if (taught.length) retrain();

const $ = s => document.querySelector(s), log = $("#log");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
function say(text) {
  const me = el("div", "turn me", text); log.append(me);
  const r = engine.respond(text);
  store.set("ptilu.engine.me", engine.memory);
  const t = el("div", "turn"); t.append(el("div", "", r.say));
  t.append(el("div", "why", `${r.outcome} · ${r.why || ""}${r.command ? " → " + r.command : ""}${r.source ? " · from " + r.source : ""}`));
  if (r.chips && r.chips.length) { const c = el("div", "chips"); for (const x of r.chips) { const b = el("button", "", x); b.onclick = () => say(x); c.append(b); } t.append(c); }
  log.append(t); log.scrollTop = log.scrollHeight;
}
$("form.say").onsubmit = e => { e.preventDefault(); const v = $("#q").value.trim(); if (v) say(v); $("#q").value = ""; };
$("#tab").onclick = () => { document.body.classList.toggle("inbox"); $("#tab").textContent = document.body.classList.contains("inbox") ? "Chat" : "Inbox"; drawInbox(); };

// the inbox: pick the skill a sentence meant, mark its values, and it's learned at once
function drawInbox() {
  const box = $("#inbox"); box.innerHTML = "";
  if (!engine.inbox.length) box.append(el("p", "why", "Nothing waiting. What I can't do lands here, to be taught."));
  for (const item of engine.inbox) {
    const d = el("div", "item"); d.append(el("div", "", item.sentence), el("div", "why", item.why));
    const sel = el("select"); sel.append(el("option", "", "teach it to…"));
    for (const s of engine.skills) { const o = el("option", "", s.label); o.value = s.name; sel.append(o); }
    const slots = el("div"), msg = el("div", "why");
    sel.onchange = () => {
      slots.innerHTML = "";
      const s = engine.byName.get(sel.value); if (!s) return;
      for (const slot of Object.keys(s.needs)) { const i = el("input"); i.placeholder = `${slot}: the words that are it`; i.dataset.slot = slot; slots.append(i); }
      const b = el("button", "go", "Teach"); slots.append(b);
      b.onclick = () => {
        const marks = {};
        for (const i of slots.querySelectorAll("input")) if (i.value.trim()) marks[i.dataset.slot] = i.value.trim();
        const r = EngineLearn.teach(engine, item.sentence, sel.value, marks);
        msg.textContent = r.ok ? "Learned: " + r.pattern : "Not learned: " + r.why;
        if (r.ok) { taught.push({ sentence: item.sentence, skill: sel.value, marks }); store.set("ptilu.engine.taught", taught); retrain(); setTimeout(drawInbox, 900); }
      };
    };
    const no = el("button", "", "not for me"); no.onclick = () => { engine.inbox.splice(engine.inbox.indexOf(item), 1); drawInbox(); };
    d.append(sel, no, slots, msg); box.append(d);
    if (item.suggest) { sel.value = item.suggest; sel.onchange(); }
  }
  if (taught.length) {
    const lines = taught.map(t => `${t.skill}: ${(engine.byName.get(t.skill).patterns.find(p => p.quote === engine.clean(t.sentence)) || {}).pattern}  ← "${t.sentence}"`);
    box.append(el("h3", "", "Taught on this phone"), el("pre", "", lines.join("\n") + "\n\nCopy these under ## Learned in each skill.md to keep them."));
  }
}
document.getElementById("built").textContent = "built " + BUILT;
say("what can you do");
</script>
</body>
</html>
