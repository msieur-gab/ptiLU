<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ptiLU agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

/* Layout: one-screen console. Header with model card, scrolling log of turns
   (command → trace → reply), composer pinned at the bottom with suggestion chips. */
:root {
  /* Single light theme by choice: yellow for the person, light grey for the agent. */
  --bg: #f7f7f4;
  --surface: #ffffff;
  --trace: #f1f1ed;
  --fg: #1d1d1b;
  --muted: #6b6a64;
  --line: #e2e1db;
  --user: #ffd84a;
  --user-ink: #1d1d1b;
  --agent: #ebebe7;
  --agent-ink: #1d1d1b;
  --accent: #2e5bd6;
  --exec: #1d6b4a;
  --warn: #9a5a00;
  --slot-name: #d9e4ff;
  --slot-location: #d6f0e2;
  --slot-file_type: #f6e3c8;
  --slot-app: #ecdcf7;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-ui); }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); max-width: 720px; margin: 0 auto; }

header { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
h1 span { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
button { font: inherit; color: inherit; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.ghost:focus-visible, .chip:focus-visible, .send:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
details { font-size: 13px; color: var(--muted); }
summary { cursor: pointer; font-family: var(--font-mono); font-size: 12px; list-style: none; }
summary::-webkit-details-marker { display: none; }
#about > summary::before { content: "▸ "; }
#about[open] > summary::before { content: "▾ "; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px 16px; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-family: var(--font-mono); font-weight: 500; color: var(--fg); font-size: 14px; }
.stats small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.note { margin: 8px 0 2px; max-width: 62ch; }

.log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.turn { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cmd { align-self: flex-end; max-width: 88%; background: var(--user); color: var(--user-ink); padding: 8px 12px; border-radius: 16px 16px 4px 16px; overflow-wrap: anywhere; }
.trace { background: var(--trace); border-radius: 8px; padding: 10px 12px; font: 12.5px/1.6 var(--font-mono); overflow-x: auto; min-width: 0; }
.row { display: grid; grid-template-columns: 4.5em 1fr; gap: 8px; }
.row > span:first-child { color: var(--muted); }
.row > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.conf { font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }
.tagged mark { color: var(--fg); border-radius: 3px; padding: 0 3px; }
.tagged mark sub { font-size: 9.5px; color: var(--muted); margin-left: 3px; vertical-align: baseline; }
mark.name { background: var(--slot-name); }
mark.location { background: var(--slot-location); }
mark.file_type { background: var(--slot-file_type); }
mark.app { background: var(--slot-app); }
.exec { color: var(--exec); }
.exec em { font-style: normal; font-size: 10.5px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; opacity: 0.8; }
.state { color: var(--fg); }
.abstain { color: var(--warn); }
.reply { align-self: flex-start; max-width: 88%; background: var(--agent); color: var(--agent-ink); padding: 8px 12px; border-radius: 16px 16px 16px 4px; overflow-wrap: anywhere; white-space: pre-line; }
.why { margin-top: -2px; padding-left: 4px; }
.typing { display: inline-flex; gap: 5px; align-items: center; padding: 13px 14px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: 0.55; }
@media (prefers-reduced-motion: no-preference) {
  .typing span { animation: hop 1s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
}
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-5px); opacity: 0.9; } }
.why > summary { display: inline-flex; align-items: center; gap: 6px; font: 11.5px var(--font-mono); color: var(--muted); cursor: pointer; padding: 4px 6px 4px 2px; border-radius: 6px; list-style: none; }
.why > summary::-webkit-details-marker { display: none; }
.why > summary::before { content: none; }
.why > summary svg { width: 14px; height: 14px; flex: none; transition: transform 0.15s ease; }
.why[open] > summary svg { transform: rotate(90deg); }
.why > summary .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--exec); flex: none; }
.why > summary .dot.ask { background: var(--accent); }
.why > summary .dot.skip { background: var(--warn); }
.why .trace { margin-top: 4px; }
.divider { text-align: center; font: 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 10px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.composer { min-width: 0; border-top: 1px solid var(--line); padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font: 12.5px var(--font-mono); color: var(--fg); cursor: pointer; white-space: nowrap; }
form { display: flex; gap: 8px; }
input { flex: 1; min-width: 0; font: 16px var(--font-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
input:focus { outline: 2px solid var(--fg); outline-offset: -1px; border-color: transparent; }
.send { background: var(--user); color: var(--user-ink); border: 0; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
.pending { font: 12px var(--font-mono); color: var(--warn); }
.reply.waiting { color: var(--muted); }
.retrain { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; }
.retrain button:disabled { opacity: 0.5; cursor: progress; }
.rlog { font: 12px var(--font-mono); color: var(--dim, #777); min-width: 0; overflow-wrap: anywhere; }

/* Inbox: a sheet over the console */
.actions { display: flex; gap: 6px; }
.count { display: inline-block; min-width: 1.5em; margin-left: 5px; padding: 0 5px; border-radius: 999px; background: var(--user); color: var(--user-ink); font: 500 11px/1.6 var(--font-mono); text-align: center; }
.sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); max-width: 720px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.sheet-body { overflow-y: auto; padding: 14px 16px 32px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.hint { margin: 0; font-size: 13px; color: var(--muted); max-width: 62ch; }
.empty { font-size: 13px; color: var(--muted); padding: 18px 0; text-align: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.said { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.meta { margin: 0; font: 11.5px var(--font-mono); color: var(--muted); }
.card-actions, .ed-buttons, .sheet-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font-size: 13px; cursor: pointer; }
.btn.primary, .primary { background: var(--fg); color: var(--bg); border-color: var(--fg); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn.quiet { color: var(--muted); }
.primary:disabled, .btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, .primary:focus-visible, .word:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.editor { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.editor label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.editor select, .editor input, .editor textarea { font: 14px var(--font-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.editor textarea { resize: vertical; font-size: 13px; }
.words { display: flex; flex-wrap: wrap; gap: 5px; }
.word { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 7px; font: 13.5px var(--font-ui); cursor: pointer; }
.word.sel { background: var(--user); border-color: var(--user); }
.word.marked { background: var(--slot-name); border-color: var(--slot-name); }
.word sub { font: 10px var(--font-mono); color: var(--accent); margin-left: 3px; }
.mark-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.preview { font: 12.5px var(--font-mono); background: var(--trace); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; }
.err { color: var(--warn); font-size: 12.5px; min-height: 1em; }
.learned h3 { margin: 6px 0 8px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.lrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.lrow span { min-width: 0; overflow-wrap: anywhere; }
.lrow em { font: normal 11.5px var(--font-mono); color: var(--muted); margin-left: 6px; }
.tag-new { color: var(--exec); }
.inboxed { font: 11.5px var(--font-mono); color: var(--muted); }
.send-inbox { margin-top: 8px; font-size: 12px; }
.notice { align-self: stretch; font-size: 13px; color: var(--warn); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
@media (prefers-reduced-motion: no-preference) { .turn { animation: rise 0.18s ease-out; } }
@keyframes rise { from { transform: translateY(4px); } to { transform: none; } }

/* the agent's own additions */
.turn .follow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.turn .follow .chip { white-space: normal; text-align: left; }
.cards { display: flex; gap: 8px; max-width: 100%; }
.cards.many { overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
.cards.many .pcard { cursor: pointer; flex: 0 0 78%; max-width: none; scroll-snap-align: start; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; max-width: 92%; display: flex; flex-direction: column; gap: 4px; }
.pcard .t { font-weight: 600; }
.pcard .w { font: 11.5px var(--font-mono); color: var(--muted); }
.pcard .l { font-style: italic; }
.pcard .x { font-size: 14px; color: var(--fg); }
.part { font: 11.5px var(--font-mono); color: var(--muted); display: block; margin-top: 6px; }
.notit { background: none; border: none; color: var(--muted); font: 12px var(--font-ui); text-decoration: underline; cursor: pointer; padding: 0; align-self: flex-start; }
.sheet[hidden], .count[hidden] { display: none; }
.card select, .card input, .card textarea { font: 14px var(--font-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <h1>ptiLU<span id="ver"></span></h1>
      <div class="actions">
        <button class="ghost" id="inboxBtn" type="button">Inbox<span class="count" id="inboxCount" hidden></span></button>
        <button class="ghost" id="reset" type="button">Clear</button>
      </div>
    </div>
  </header>
  <main class="log" id="log" aria-live="polite"></main>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="q" type="text" enterkeyhint="send" autocapitalize="none" spellcheck="false" placeholder="Ask me something" aria-label="Ask me something">
      <button class="send" type="submit">Send</button>
    </form>
  </div>
</div>

<section class="sheet" id="sheet" hidden aria-label="Inbox">
  <div class="sheet-head"><h2>Inbox</h2><button class="ghost" id="sheetClose" type="button">Close</button></div>
  <div class="sheet-body">
    <p class="hint">What I couldn't answer, answered wrong, or wasn't sure about. Tap the skill it was for: the sentence becomes one of its examples, at once, and stays on this phone.</p>
    <div id="waiting"></div>
    <div class="learned"><h3>Taught on this phone</h3><pre class="rlog" id="learned"></pre></div>
  </div>
</section>

<script>
const __mods = {
"./text.js": (module, require) => {
// Words, as the engine reads them: any alphabet, file names kept whole ("seed.md"), the original
// spelling kept beside the lowercase so values come back as they were typed ("Gab", "Kraków").

const WORD = /[\p{L}\p{N}](?:[\p{L}\p{N}'’._:-]*[\p{L}\p{N}])?/gu;

function tokens(text) {
  return [...String(text).matchAll(WORD)].map(m => ({ w: m[0].toLowerCase().replace(/’/g, "'"), o: m[0] }));
}

const words = text => tokens(text).map(t => t.w);
const join = toks => toks.map(t => t.o).join(" ");
const pick = (variants, random = Math.random) => variants[Math.floor(random() * variants.length) % variants.length];

// "{duration}" in a reply → the value as it is said
function fill(template, values) {
  return template.replace(/\{([@\w.]+)\}/g, (all, k) => (values[k] !== undefined && values[k] !== null ? values[k] : all));
}

// one letter apart (insert, delete, substitute, swap): "timr" → "timer"
function close(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1 || Math.min(a.length, b.length) < 4) return false;
  let i = 0;
  while (i < a.length && a[i] === b[i]) i++;
  const ra = a.slice(i + 1), rb = b.slice(i + 1);
  return ra === b.slice(i) || a.slice(i) === rb || ra === rb || (a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2));
}

if (typeof module !== "undefined") module.exports = { tokens, words, join, pick, fill, close };

},
"./files.js": (module, require) => {
// Reading the Markdown files a pack is made of: front matter, sections, bullet lines.
// No knowledge of what a skill is; skills.js and content.js give the sections their meaning.

function frontMatter(md) {
  const m = md.match(/^---\n([\s\S]*?)\n---\n?/);
  if (!m) return { meta: {}, body: md };
  const meta = {};
  const unq = v => v.trim().replace(/^"(.*)"$|^'(.*)'$/, (a, b, c) => (b !== undefined ? b : c));
  let list = null, obj = null;
  for (const raw of m[1].split("\n")) {
    const line = raw.replace(/\s+#\s.*$/, "");
    const item = line.match(/^\s*-\s+(.*)$/);
    if (item && list) {
      const kv = item[1].match(/^(\w+):\s+(.*)$/); // "- q: Why a stone?" opens an object, "  see: …" adds to it
      if (kv) { obj = { [kv[1]]: unq(kv[2]) }; meta[list].push(obj); } else { obj = null; meta[list].push(unq(item[1])); }
      continue;
    }
    const sub = line.match(/^\s+(\w+):\s+(.*)$/);
    if (sub && obj) { obj[sub[1]] = unq(sub[2]); continue; }
    const kv = line.match(/^([\w-]+):\s*(.*)$/);
    if (!kv) continue;
    obj = null;
    const v = kv[2].trim();
    if (v === "") { list = kv[1]; meta[list] = []; }
    else { list = null; meta[kv[1]] = /^\[.*\]$/.test(v) ? v.slice(1, -1).split(",").map(unq).filter(Boolean) : unq(v); }
  }
  return { meta, body: md.slice(m[0].length) };
}

// "## People say" → { "people say": { text, lines } }; lines are the bullets, without "- "
function sections(body) {
  const out = { "": { text: "", lines: [] } };
  let cur = out[""];
  for (const line of body.split("\n")) {
    const h = line.match(/^##\s+(.+?)\s*$/);
    if (h) { cur = out[h[1].toLowerCase()] = { title: h[1], text: "", lines: [] }; continue; }
    cur.text += line + "\n";
    const b = line.match(/^\s*-\s+(.*\S)\s*$/);
    if (b) cur.lines.push(b[1]);
  }
  return out;
}

// "- done: Timer set. | OK." → { done: ["Timer set.", "OK."] }
function keyed(lines) {
  const out = {};
  for (const l of lines) {
    const m = l.match(/^([\w -]+?):\s+(.*)$/);
    if (m) out[m[1].trim()] = m[2].split(/\s+\|\s+/);
  }
  return out;
}

if (typeof module !== "undefined") module.exports = { frontMatter, sections, keyed };

},
"./entities.js": (module, require) => {
// Rule-based date / time / duration / recurrence entities. No model, no dependencies.
// Shared by every skill that needs time: reminders, timers, calendar, "what day is ...".
// Usage: NLUEntities.parse("remind me next friday at 3pm", { now: new Date() })
// Every result carries `ambiguous` + `alternatives` so the dialogue can ask instead of guessing.

const NLUEntities = (() => {
  // ---------- numbers ----------
  const SMALL_N = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10,

  const TENS_N = { twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60 };
  const SMALL = "thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve";
  const NUM = `(?:\\d+(?:[.,]\\d+)?|(?:twenty|thirty|forty|fifty|sixty)(?:[\\s-](?:one|two|three|four|five|six|seven|eight|nine))?|a\\s+couple\\s+of|couple\\s+of|a\\s+couple|a\\s+few|few|several|${SMALL}|an?)`;
  const HOURW = "one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve";
  const ORD_N = { first: 1, second: 2, third: 3, fourth: 4, fifth: 5, sixth: 6, seventh: 7, eighth: 8, ninth: 9, tenth: 10,
    eleventh: 11, twelfth: 12, thirteenth: 13, fourteenth: 14, fifteenth: 15, sixteenth: 16, seventeenth: 17, eighteenth: 18,
    nineteenth: 19, twentieth: 20, thirtieth: 30 };
  const ORDW = "(?:twenty|thirty)[\\s-](?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth)|thirtieth|twentieth|nineteenth|eighteenth|seventeenth|sixteenth|fifteenth|fourteenth|thirteenth|twelfth|eleventh|tenth|ninth|eighth|seventh|sixth|fifth|fourth|third|second|first";
  // "21", "21st", "twenty-first" → 21
  function ordNum(s) {
    s = s.toLowerCase().replace(/(st|nd|rd|th)$/, m => (/^\d/.test(s) ? "" : m));
    if (/^\d+$/.test(s)) return +s;
    const [a, b] = s.split(/[\s-]/);
    return b ? (a === "twenty" ? 20 : 30) + ORD_N[b] : ORD_N[a];
  }

  function num(s) {
    s = s.trim().toLowerCase().replace(/\s+/g, " ");
    if (/^\d/.test(s)) return parseFloat(s.replace(",", "."));
    if (/couple/.test(s)) return 2;
    if (/few|several/.test(s)) return 3;
    if (s === "a" || s === "an") return 1;
    const [t, u] = s.split(/[\s-]/);
    if (t in TENS_N) return TENS_N[t] + (u ? SMALL_N[u] : 0);
    return SMALL_N[s];
  }

  // ---------- durations ----------
  const UNIT = "seconds?|secs?|minutes?|mins?|hours?|hrs?|days?|weeks?|wks?|fortnights?|months?|years?|yrs?";
  const unitKey = u => {
    u = u.toLowerCase();
    if (/^s/.test(u)) return "seconds";
    if (/^mi|^m$/.test(u)) return "minutes";
    if (/^h/.test(u)) return "hours";
    if (/^d/.test(u)) return "days";
    if (/^w/.test(u)) return "weeks";
    if (/^f/.test(u)) return "fortnight";
    if (/^mo/.test(u)) return "months";
    return "years";
  };
  const comp = named => {
    const g = n => (named ? `?<${n}>` : "?:");
    return [
      `(${g("n1")}${NUM})\\s+and\\s+a\\s+half\\s+(${g("u1")}${UNIT})\\b`,
      `(?:an?\\s+)?half\\s+(?:an?\\s+)?(${g("u2")}hour|day|minute|week|month|year)\\b`,

"./patterns.js": (module, require) => {
// "People say" patterns, read exactly. TermNL's syntax:
//   (a/the)   optional, one of these words        to/into   one of these words
//   {name}    a value, read by its kind           (from (the) {place})   optional groups nest
// A pattern reads a sentence only if it covers every word of it, and every value reads whole.

const { tokens, close } = require("./text.js");

function compile(pattern) {
  const lex = pattern.toLowerCase().replace(/[?!,.](?=\s|$)/g, "").match(/\(|\)|\{[\w]+\}|[^\s(){}]+/g) || [];
  let i = 0;
  function seq() {
    const out = [];
    while (i < lex.length && lex[i] !== ")") {
      const t = lex[i++];
      if (t === "(") { out.push({ opt: seq() }); i++; } // the ")"
      else if (t[0] === "{") out.push({ slot: t.slice(1, -1) });
      else out.push({ alt: t.split("/").map(w => tokens(w).map(x => x.w).join(" ")) });
    }
    return out;
  }
  const items = seq();
  return { pattern, items, slots: slotsOf(items) };
}
const slotsOf = items => items.flatMap(it => (it.slot ? [it.slot] : it.opt ? slotsOf(it.opt) : []));

// every full reading of the sentence: { values, literals, typos }
function* walk(items, k, toks, ti, acc, read) {
  if (k === items.length) { yield { ...acc, ti }; return; }
  const it = items[k];
  if (it.alt) {
    // a word with an apostrophe or a dot is one token, a phrase is several: compare word by word
    for (const a of it.alt) {
      const ws = a.split(" ");
      if (ti + ws.length > toks.length) continue;
      let typos = 0, ok = true;
      for (let j = 0; j < ws.length; j++) {
        const w = toks[ti + j].w;
        if (w === ws[j]) continue;
        if (close(w, ws[j])) typos++; else { ok = false; break; }
      }
      if (ok) yield* walk(items, k + 1, toks, ti + ws.length, { ...acc, literals: acc.literals + ws.length, typos: acc.typos + typos }, read);
    }
    return;
  }
  if (it.opt) {
    for (const r of walk(it.opt, 0, toks, ti, acc, read)) yield* walk(items, k + 1, toks, r.ti, r, read);
    yield* walk(items, k + 1, toks, ti, acc, read);
    return;
  }
  for (let end = ti + 1; end <= toks.length; end++) {
    const text = toks.slice(ti, end).map(t => t.o).join(" ");
    const v = read(it.slot, text);
    if (v) yield* walk(items, k + 1, toks, end, { ...acc, values: { ...acc.values, [it.slot]: { text, ...v } } }, read);
  }
}

// the best reading of a sentence by one compiled pattern, or null. read(slot, text) → value or null
function match(compiled, sentence, read) {
  const toks = typeof sentence === "string" ? tokens(sentence) : sentence;
  let best = null;
  for (const r of walk(compiled.items, 0, toks, 0, { values: {}, literals: 0, typos: 0 }, read)) {
    if (r.ti !== toks.length) continue;
    const typed = Object.values(r.values).filter(v => v.iso || v.seconds !== undefined).length;
    const score = 3 * Object.keys(r.values).length + typed + r.literals - 2 * r.typos;
    if (!best || score > best.score) best = { values: r.values, literals: r.literals, typos: r.typos, score, pattern: compiled.pattern };
  }
  return best;
}

// sentences for the model: each pattern with its optional parts on and off, values from samples
function expand(compiled, samples, limit = 24) {
  const outs = [];
  function* gen(items, k, acc) {
    if (k === items.length) { yield acc; return; }
    const it = items[k];
    if (it.alt) { for (const a of it.alt) yield* gen(items, k + 1, acc.concat(a)); return; }
    if (it.opt) { for (const o of gen(it.opt, 0, [])) yield* gen(items, k + 1, acc.concat(o)); yield* gen(items, k + 1, acc); return; }
    const s = samples[it.slot] || ["something"];
    yield* gen(items, k + 1, acc.concat(s[(acc.length + k) % s.length]));
  }
  for (const words of gen(compiled.items, 0, [])) { outs.push(words.join(" ")); if (outs.length >= 400) break; }
  if (outs.length <= limit) return outs;
  return Array.from({ length: limit }, (_, i) => outs[Math.floor(i * outs.length / limit)]); // spread over all forms
}

if (typeof module !== "undefined") module.exports = { compile, match, expand };

},
"./kinds.js": (module, require) => {
// The kinds of value a skill file can ask for, in the words it writes them ("a duration"), and how each
// is read from what was typed. A value is read whole or not at all: "mum next friday" is no date.
// Dates, times and durations come from ptiLU's rule-based parser (web/entities.js).

const E = require("./entities.js");

const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September",
  "October", "November", "December"];
const sayDay = d => `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const sayTime = d => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const sayAt = iso => { const d = new Date(iso); return iso.length > 10 ? `${sayDay(d)} at ${sayTime(d)}` : sayDay(d); };

function sayDuration(p) {
  const parts = [["hour", p.hours + 24 * (p.days + 7 * p.weeks)], ["minute", p.minutes], ["second", p.seconds]]
    .filter(([, n]) => n).map(([u, n]) => `${n} ${u}${n === 1 ? "" : "s"}`);
  return parts.join(" and ") || null;
}

// the one entity that covers the whole text, if any
function whole(text, now) {
  const t = text.trim();
  const found = E.parse(t, { now }).filter(e => e.start === 0 && e.end === t.length);
  return found[0] || null;
}

const KINDS = {
  "a duration": (text, now) => {
    const e = whole(text, now); // the whole text is the duration, or it isn't one ("how much is a day of your" isn't)
    if (!e || e.type !== "duration") return null;
    const p = E.parseDuration(text);
    const said = p && sayDuration(p);
    return said && /\d|one|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|forty|fifty|sixty|half|an? /i.test(text)
      ? { said, seconds: ((p.days + 7 * p.weeks) * 24 * 3600) + p.hours * 3600 + p.minutes * 60 + p.seconds } : null;
  },
  "a date and time": (text, now) => {
    const e = whole(text, now);
    if (!e || (e.type !== "datetime" && e.type !== "date")) return null;
    const iso = e.type === "date" ? e.value + "T09:00" : e.value; // a day without a time: 9:00
    return { said: sayAt(iso), iso, ambiguous: !!e.ambiguous, alternatives: (e.alternatives || []).map(a => ({ iso: a, said: sayAt(a) })) };
  },
  "a date": (text, now) => {
    const e = whole(text, now);
    return e && e.type === "date" ? { said: sayDay(new Date(e.value)), iso: e.value } : null;
  },
  "a name": text => (text.split(/\s+/).length <= 3 ? { said: text.replace(/^\p{Ll}/u, c => c.toUpperCase()) } : null),
  "a place": text => (text.split(/\s+/).length <= 4 ? { said: text.replace(/(^|\s)\p{Ll}/gu, c => c.toUpperCase()) } : null),
  "some text": text => (text.trim() ? { said: text.trim() } : null),
};

// "a duration" → reader; "one of: low, medium, high" → a reader for that list
function reader(kind) {
  const list = kind.match(/^one of:\s*(.+)$/);
  if (list) {
    const items = list[1].split(/\s*,\s*/).map(s => s.toLowerCase());
    return text => (items.includes(text.toLowerCase()) ? { said: text.toLowerCase() } : null);
  }
  if (!KINDS[kind]) throw new Error(`unknown kind of value: "${kind}"`);
  return KINDS[kind];
}

// values of a kind found anywhere in a sentence, for when no pattern read it: dates and durations only,
// as their shape gives them away; a name or a text can't be told from the words around it
function findIn(kind, sentence, now) {
  if (kind === "a duration") {
    for (const e of E.parse(sentence, { now })) if (e.type === "duration") { const v = KINDS[kind](e.text); if (v) return { text: e.text, ...v }; }
  }
  if (kind === "a date and time" || kind === "a date") {
    for (const e of E.parse(sentence, { now })) { const v = KINDS[kind](e.text, now); if (v) return { text: e.text, ...v }; }
  }
  const list = kind.match(/^one of:\s*(.+)$/);
  if (list) for (const w of sentence.toLowerCase().split(/[^\p{L}\p{N}]+/u)) { const v = reader(kind)(w); if (v) return { text: w, ...v }; }
  return null;
}

// sample values of each kind: to write example sentences (the model's training, the "try saying" chips)
const SAMPLES = {
  "a duration": ["10 minutes", "an hour", "five minutes", "30 seconds", "2 hours", "twenty minutes"],
  "a date and time": ["tomorrow at 9", "next friday at 3pm", "tonight", "in two hours", "on monday", "at 6pm"],
  "a date": ["tomorrow", "next friday", "monday"],
  "a name": ["Gab", "Eva", "Sam"], "a place": ["Munich", "Paris", "Kyoto"],
  "some text": ["call mum", "buy milk", "water the plants"],
};
function samplesFor(skill) {
  const out = {};
  for (const [slot, need] of Object.entries(skill.needs)) {
    const list = need.kind.match(/^one of:\s*(.+)$/);
    out[slot] = skill.samples[slot] || (list ? list[1].split(/\s*,\s*/) : SAMPLES[need.kind]);
  }
  return out;
}

if (typeof module !== "undefined") module.exports = { reader, findIn, sayDay, sayTime, samplesFor };

},
"./skills.js": (module, require) => {
// A skill file, read. One file per kind of question or request:
//
//   ---
//   label: test an idea before the budget      what the agent calls it ("Do you mean: …?")
//   kind: question                              question · about · contact · do · talk
//   leads: [senz]                               the projects a question skill opens (cards, then content)
//   fallback: yes                               where a sentence nothing answers goes (one skill, at most)
//   ---
//   ## People say      patterns, read exactly (TermNL's syntax): they win before any meaning
//   ## Also said       example sentences: what the meaning routes by
//   ## Not for me      sentences that look like this skill but aren't: they keep it from being proposed
//   ## Answer          the reply, in the owner's words (a question skill without one introduces its projects)
//   ## What it needs   values: "- {duration}: a duration. If it's missing, ask: For how long?"
//   ## Does            a command for the page (timer.start {duration}, form.open)
//   ## Replies         done: … | …
//   ## Learned         sentences taught from the inbox, with the day: "- how do we test faster (2026-11-20)"

const F = require("./files.js");
const P = require("./patterns.js");
const K = require("./kinds.js");

const KINDS = ["question", "about", "contact", "do", "talk"];
const LEARNED = /^(.*?)\s+\((\d{4}-\d\d-\d\d)\)$/;

function readSkill(name, md) {
  const { meta, body } = F.frontMatter(md);
  const s = F.sections(body);
  const lines = k => (s[k] || { lines: [] }).lines;
  const fail = why => { throw new Error(`skills/${name}.md: ${why}`); };
  const kind = meta.kind || "do";
  if (!KINDS.includes(kind)) fail(`kind "${kind}" isn't one of ${KINDS.join(", ")}`);
  if (!meta.label) fail("no `label:` line");
  const needs = {};
  for (const line of lines("what it needs")) {
    const m = line.match(/^\{(\w+)\}:\s*(.+)$/);
    if (!m) fail(`can't read "${line}" under What it needs`);
    const [k, rest = ""] = m[2].split(/\.\s+(?=If it)/);
    const ask = rest.match(/^If it's missing, ask:\s*(.+)$/);

  }

  for (const p of patterns) for (const slot of p.slots) if (!needs[slot]) fail(`{${slot}} in "${p.pattern}" isn't under What it needs`);
  const learned = lines("learned").map(l => { const m = l.match(LEARNED); return m ? { text: m[1], on: m[2] } : { text: l, on: null }; });
  const answer = (s["answer"] || { text: "" }).text.trim().replace(/\s*\n\s*/g, " ");

  if (kind !== "question" && !replies.done) fail("no `done:` reply");
  return {
    name, kind, label: meta.label, leads: meta.leads || [], fallback: meta.fallback === "yes",
    needs, patterns, also: lines("also said"), notFor: lines("not for me"), learned, answer, replies,
    command: (s["does"] || { text: "" }).text.trim().split("\n")[0] || null, md,
  };
}

// what the meaning routes by: the patterns written out (values filled with samples), the "Also said"
// sentences and what was taught
function examples(skill) {
  const out = new Set();
  const samples = K.samplesFor({ needs: skill.needs, samples: {} });
  for (const p of skill.patterns) for (const t of P.expand(p, samples, 6)) out.add(t);
  for (const t of skill.also) out.add(t);
  for (const l of skill.learned) out.add(l.text);
  return [...out];
}

// a taught sentence, written under "## Learned" in the skill's own file
function addLearned(skill, text, on) {
  skill.learned.push({ text, on });
  const line = `- ${text} (${on})`;
  skill.md = /\n## Learned\n/.test(skill.md)
    ? skill.md.replace(/\n## Learned\n((?:- .*\n?)*)/, (all, b) => `\n## Learned\n${b.replace(/\n?$/, "\n")}${line}\n`)
    : skill.md.replace(/\n?$/, `\n\n## Learned\n${line}\n`);
  return line;
}

if (typeof module !== "undefined") module.exports = { readSkill, examples, addLearned };

},
"./projects.js": (module, require) => {
// The projects: plain Markdown files, nothing added to them. Front matter for the card (title, question,
// answer, where, year, intro), "##" headings for the parts a conversation can move through. A question
// asked while a project is open is looked for in that project's paragraphs (BM25); the agent only quotes
// them, it never writes its own.

const F = require("./files.js");
const T = require("./text.js");

const plain = s => s.replace(/!\[[^\]]*\]\([^)]*\)/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
  .replace(/<[^>]+>/g, "").replace(/[*_`>#]+/g, "").replace(/\s+/g, " ").trim();
const stem = w => w.length > 4 ? w.replace(/(ations?|ising|izing|ised|ized|ises|izes|ise|ize|ing|ed|es|s)$/, "") : w;

class Projects {
  constructor(files, small = new Set()) {
    this.small = small;
    this.list = files.map(({ id, md }) => this.read(id, md));
    this.byId = new Map(this.list.map(p => [p.id, p]));
    // BM25 statistics over every paragraph
    const all = this.list.flatMap(p => p.paras);
    this.N = all.length;
    this.avg = all.reduce((t, x) => t + x.terms.length, 0) / Math.max(1, all.length);
    this.df = new Map();
    for (const x of all) for (const w of new Set(x.terms)) this.df.set(w, (this.df.get(w) || 0) + 1);
  }
  terms(text) { return T.words(text).filter(w => !this.small.has(w) && w.length > 1).map(stem); }
  read(id, md) {
    const { meta, body } = F.frontMatter(md);
    const parts = [];
    let cur = null;
    for (const block of body.split(/\n\s*\n/)) {
      const h = block.match(/^##\s+(.+)$/m);
      if (h && /^##\s/.test(block.trim())) {
        cur = { title: h[1].trim(), paras: [] }; parts.push(cur);
        const rest = plain(block.trim().split("\n").slice(1).join(" "));
        if (rest.split(" ").length >= 6) cur.paras.push(rest);
        continue;
      }
      if (!cur || /^\s*(\||<|!\[|```|---)/.test(block) || /^#\s/.test(block.trim())) continue;
      const text = plain(block.replace(/^###\s+(.+)$/gm, "$1:"));
      if (text.split(" ").length >= 6) cur.paras.push(text);
    }
    const p = { id, title: meta.title || id, meta, parts: parts.filter(x => x.paras.length) };
    p.paras = p.parts.flatMap((part, pi) => part.paras.map((text, k) => ({ text, pi, k, terms: this.terms(text + " " + part.title) })));
    return p;
  }
  // what a card shows: the owner's own lines from the front matter
  card(id) {
    const p = this.byId.get(id);
    if (!p) return null;
    const m = p.meta;
    return { id, title: p.title, line: m.question || m.brief || "", text: m.answer || m.what || (p.paras[0] || {}).text || "", where: [m.where, m.year].filter(Boolean).join(" · ") };
  }
  // a part of a project: its first paragraphs, up to about 3 sentences
  part(id, pi) {
    const p = this.byId.get(id), part = p && p.parts[pi];
    if (!part) return null;
    let text = "";
    for (const para of part.paras) { if (text && (text + para).split(/(?<=[.!?])\s/).length > 4) break; text += (text ? " " : "") + para; }
    return { title: part.title, text };
  }
  // the parts not yet seen, as follow-ups
  next(id, seen) { const p = this.byId.get(id); return p ? p.parts.map((x, i) => i).filter(i => !seen.has(i)) : []; }
  // a project named in a sentence ("tell me about Senz")
  named(sentence) {
    const ws = new Set(T.words(sentence));
    return this.list.find(p => T.words(p.title).every(w => ws.has(w))) || null;
  }
  // the paragraph that answers a question, in one project or in all of them, if one clearly does: most of
  // the question's words found (at least 2), or its one word, if that word is rare
  search(id, question) {
    const ps = id ? [this.byId.get(id)].filter(Boolean) : this.list, q = [...new Set(this.terms(question))];
    if (!ps.length || !q.length) return null;
    let best = null;
    for (const p of ps) for (const para of p.paras) {
      let score = 0, found = 0;
      for (const w of q) {
        const tf = para.terms.filter(x => x === w).length;
        if (!tf) continue;
        found++;
        const idf = Math.log(1 + (this.N - (this.df.get(w) || 0) + 0.5) / ((this.df.get(w) || 0) + 0.5));
        score += idf * tf * 2.2 / (tf + 1.2 * (0.25 + 0.75 * para.terms.length / this.avg));
      }
      if (!best || score > best.score) best = { p, para, score, found, coverage: found / q.length };
    }
    const rare = best && q.length === 1 && T.words(question).length <= 4 && best.found === 1 && (this.df.get(q[0]) || 0) <= 8;
    return best && ((best.found >= 2 && best.coverage >= 0.5) || rare) ? { project: best.p.id, part: best.para.pi, text: best.para.text, title: best.p.parts[best.para.pi].title, ...best } : null;
  }
}

if (typeof module !== "undefined") module.exports = { Projects };

},
"./router.js": (module, require) => {
// Which skill a sentence is for: the nearest example sentences, by meaning (MiniLM vectors, built ahead in
// meaning.json, taught ones added on the spot), or by words when the model isn't there. Nothing is trained:
// a sentence taught to a skill is one more example, and it counts at once.
//   "Not for me" lines: when a sentence is nearer to one of a skill's "not for me" lines than to any of
//   its examples, that skill isn't proposed.

const T = require("./text.js");
const S = require("./skills.js");
const stem = w => w.length > 4 ? w.replace(/(ations?|ising|izing|ised|ized|ises|izes|ise|ize|ing|ed|es|s)$/, "") : w;

class Router {
  constructor(skills, small = new Set()) {
    this.small = small;
    this.items = [];
    for (const s of skills) {
      for (const text of S.examples(s)) this.items.push({ skill: s.name, text, neg: false });
      for (const text of s.notFor) this.items.push({ skill: s.name, text, neg: true });
    }
    this.vectors = null; // text → Float32Array
    this.reindex();
  }
  terms(text) { return T.words(text).filter(w => !this.small.has(w)).map(stem); }
  reindex() {
    this.df = new Map();
    for (const it of this.items) { it.terms = this.terms(it.text); for (const w of new Set(it.terms)) this.df.set(w, (this.df.get(w) || 0) + 1); }
    for (const it of this.items) it.w = this.weigh(it.terms);
  }
  weigh(terms) {
    const v = new Map(), n = this.items.length;
    for (const w of terms) v.set(w, (v.get(w) || 0) + Math.log(1 + n / (1 + (this.df.get(w) || 0))));
    const len = Math.sqrt([...v.values()].reduce((t, x) => t + x * x, 0)) || 1;
    for (const [w, x] of v) v.set(w, x / len);
    return v;
  }
  setVectors(map) { this.vectors = map; }
  // a taught sentence: one more example of its skill
  add(skill, text, vec) {
    this.items.push({ skill, text, neg: false });
    if (vec && this.vectors) this.vectors.set(text, vec);
    this.reindex();
  }
  // the skills, nearest first: { skill, score, by, example }
  rank(sentence, vec = null) {
    const byMeaning = !!(vec && this.vectors);
    const w = byMeaning ? null : this.weigh(this.terms(sentence));
    const best = new Map(), neg = new Map();
    for (const it of this.items) {
      let c = 0;
      if (byMeaning) { const v = this.vectors.get(it.text); if (!v) continue; for (let i = 0; i < v.length; i++) c += vec[i] * v[i]; }
      else for (const [t, x] of w) c += x * (it.w.get(t) || 0);
      const m = it.neg ? neg : best;
      if (!m.has(it.skill) || c > m.get(it.skill).score) m.set(it.skill, { score: c, example: it.text });
    }
    return [...best].filter(([s, b]) => !neg.has(s) || neg.get(s).score < b.score)
      .map(([skill, b]) => ({ skill, score: b.score, example: b.example, by: byMeaning ? "meaning" : "words" }))
      .sort((a, b) => b.score - a.score);
  }
}

// meaning.json: { dims, texts: [...], data: base64 of int8 × dims per text }
function decode(m) {
  const bin = typeof Buffer !== "undefined" ? Buffer.from(m.data, "base64") : Uint8Array.from(atob(m.data), c => c.charCodeAt(0));
  const i8 = new Int8Array(bin.buffer, bin.byteOffset, bin.length), map = new Map();
  m.texts.forEach((t, k) => {
    const v = new Float32Array(m.dims);
    let n = 0;
    for (let j = 0; j < m.dims; j++) { v[j] = i8[k * m.dims + j] / 127; n += v[j] * v[j]; }
    n = Math.sqrt(n) || 1;
    for (let j = 0; j < m.dims; j++) v[j] /= n;
    map.set(t, v);
  });
  return map;
}
function encode(texts, vecs) {
  const dims = vecs[0].length, i8 = new Int8Array(texts.length * dims);
  vecs.forEach((v, k) => { const top = Math.max(...Array.from(v, Math.abs)) || 1; for (let j = 0; j < dims; j++) i8[k * dims + j] = Math.round(v[j] * 127 / top); });
  return { dims, texts, data: Buffer.from(i8.buffer).toString("base64") };
}

if (typeof module !== "undefined") module.exports = { Router, decode, encode };

},
"./agent.js": (module, require) => {
// The conversation. A sentence goes, in this order, to:
//   1. a follow-up chip it was just offered (a project, a part of it, "tell me more", a skill)
//   2. the question waiting for an answer ("Do you mean…?", a missing value)
//   3. the project the conversation is in: "tell me more", or a paragraph of it that answers the question
//   4. a project named in it, or a skill's "People say" pattern, read exactly
//   5. the skills by meaning: sure, it answers; not sure, it asks "Do you mean…?"; too far, the fallback
// A yes to "Do you mean…?" is the teaching: the sentence becomes an example of that skill (at once on
// your own device, through the inbox on a public page). A "that's not it" sends the sentence to the inbox.

const T = require("./text.js");
const P = require("./patterns.js");
const K = require("./kinds.js");
const S = require("./skills.js");

// how near, in meaning (cosine) or in words, a sentence must be to a skill's examples. Set on my-agent's
// skills examples, each left out (agent/meaning/bars.mjs); checked on tests/held-out.json (measure.mjs)
const NUMBERS = { 2: "Two", 3: "Three", 4: "Four" };
const BARS = { meaning: { sure: 0.525, ask: 0.45, gap: 0.08, far: 0.3 }, words: { sure: 0.75, ask: 0.35, gap: 0.1, far: 0.1 } };

class Agent {
  constructor({ skills, projects, talk, router, now = () => new Date(), random = Math.random, mode = "site" }) {
    Object.assign(this, { skills, projects, talk, router, now, random, mode });
    this.byName = new Map(skills.map(s => [s.name, s]));
    this.fallbackSkill = skills.find(s => s.fallback) || null;
    this.contactSkill = skills.find(s => s.kind === "contact" && !s.fallback) || this.fallbackSkill;
    this.inbox = [];
    this.reset();
  }
  reset() { this.pending = null; this.frame = null; this.offered = new Map(); }
  today() { return this.now().toISOString().slice(0, 10); }
  say(key, values = {}) { return T.fill(T.pick(this.talk.replies[key] || [key], this.random), values); }
  clean(raw) {
    let s = String(raw).trim().replace(/[?!.]+$/, "").trim();
    for (let changed = true; changed;) {
      changed = false;
      for (const f of this.talk.fillers) {
        if (s.toLowerCase().startsWith(f + " ")) { s = s.slice(f.length + 1).replace(/^,\s*/, "").trim(); changed = true; }
        if (s.toLowerCase().endsWith(" " + f)) { s = s.slice(0, -f.length - 1).replace(/,$/, "").trim(); changed = true; }
      }
    }
    return s;
  }
  is(list, s) { const t = T.words(s).join(" "); return this.talk[list].some(w => t === w); }

  // ---- one turn --------------------------------------------------------------------------------------
  // vec: the sentence's MiniLM vector, when the page has it (without it, the skills are found by words)
  respond(raw, vec = null) {
    const sentence = this.clean(raw);
    const offered = this.offered;
    this.offered = new Map();
    if (!sentence) return this.cant("", "nothing said");
    const key = T.words(sentence).join(" ");

    // 1. a chip it was just offered
    const chip = offered.get(key);
    if (chip) { this.pending = null; return this.act(chip, sentence); }

    // 2. the question waiting for an answer
    const p = this.pending;
    this.pending = null;
    if (p && p.type === "confirm") {
      if (this.is("yes", sentence)) return this.chose(p, p.options[0]);
      if (this.is("no", sentence)) return this.declined(p);
    }
    if (p && p.type === "value") {
      const v = K.reader(p.skill.needs[p.slot].kind)(sentence, this.now()) || K.findIn(p.skill.needs[p.slot].kind, sentence, this.now());
      if (v) return this.run(p.skill, { ...p.values, [p.slot]: { text: sentence, ...v } }, p.sentence);
      if (this.is("no", sentence)) return this.turn("act", this.say("ok no"), { why: "cancelled" });
    }

    if (!p && (this.is("yes", sentence) || this.is("no", sentence))) return this.turn("act", this.say("ok"), { why: "nothing was asked", sentence });

    // 3. the project the conversation is in: "tell me more", or one of its parts by name
    if (this.frame && this.is("more", sentence)) return this.more();
    if (this.frame) {
      const pi = this.projects.byId.get(this.frame.project).parts.findIndex(x => T.words(x.title).join(" ") === key);
      if (pi >= 0) return this.showPart(this.frame.project, pi, "part named");
    }

    // 4. a project named, a pattern read exactly
    const named = this.projects && this.projects.named(sentence);
    if (named && T.words(sentence).length <= T.words(named.title).length + 4) return this.open(named.id, `"${named.title}" named`);
    const exact = this.exact(sentence);
    if (exact) return this.run(exact.skill, exact.values, sentence, `"People say": ${exact.pattern}`);

    // 5. the skills, by meaning (or words). Inside a project, a sure skill still wins; otherwise the
    // project's own paragraphs are looked at first
    const ranked = this.router.rank(sentence, vec);
    const by = ranked.length ? ranked[0].by : "words", bar = BARS[by];
    const [a, b] = ranked;
    const why = r => `${r.by} ${r.score.toFixed(2)}: ${r.skill} ("${r.example}")`;
    if (a && a.score >= bar.sure && (!b || a.score - b.score >= bar.gap)) {
      const skill = this.byName.get(a.skill);
      // a skill that does something is never done on a guess: it asks first
      if (skill.kind !== "do" || a.score >= 0.85) return this.run(skill, this.valuesIn(skill, sentence), sentence, why(a));
    }
    if (this.frame) {
      const hit = this.projects.search(this.frame.project, sentence);
      if (hit) return this.showPart(this.frame.project, hit.part, `in ${this.frame.project}: ${hit.found} words of ${Math.round(hit.found / hit.coverage)}`, hit.text);
    }
    if (named) return this.open(named.id, `"${named.title}" named`);
    // a detail of a project, asked without opening it: the paragraph, under its project's card
    const hit = this.projects.search(null, sentence);
    // a question about the owner ("what makes you different") isn't a project detail, even if its words are in one
    const aboutMe = ranked.slice(0, 3).some(r => r.score >= bar.ask - 0.05 && ["about", "contact"].includes(this.byName.get(r.skill).kind));
    if (hit && !aboutMe && (!a || a.score < bar.sure) && hit.coverage >= 0.66) return this.detail(hit, `${hit.project}: ${hit.found} words of ${Math.round(hit.found / hit.coverage)}`);
    if (a && a.score >= bar.ask) {
      const options = ranked.filter(r => r.score >= bar.ask && a.score - r.score < 0.08).slice(0, 2).map(r => r.skill);
      return this.confirm(sentence, vec, options, why(a));
    }
    // far from everything: said plainly, with a way to write; nearer, the invitation (the fallback skill)
    if (!a || a.score < bar.far) { this.inbox.push({ sentence, why: a ? `far: ${why(a)}` : "no skill near", on: this.today() }); return this.turn("abstain", this.say("far"), { why: a ? `far: ${why(a)}` : "no skill near", sentence, chips: this.contactChip() }); }
    return this.nothing(sentence, `nearest: ${why(a)}`);
  }

  exact(sentence) {
    const toks = T.tokens(sentence);
    let best = null;
    for (const skill of this.skills) for (const pat of skill.patterns) {
      const m = P.match(pat, toks, (slot, text) => K.reader(skill.needs[slot].kind)(text, this.now()));
      if (m && (!best || m.score > best.score)) best = { ...m, skill, pattern: pat.pattern };
    }
    return best;
  }
  valuesIn(skill, sentence) {
    const out = {};
    for (const [slot, need] of Object.entries(skill.needs)) { const v = K.findIn(need.kind, sentence, this.now()); if (v) out[slot] = v; }
    return out;
  }

  // ---- what the agent says --------------------------------------------------------------------------
  turn(outcome, say, extra = {}) {
    const t = { outcome, say, chips: [], ...extra };
    for (const c of t.chips) this.offered.set(T.words(c.text).join(" "), c);
    t.chips = t.chips.map(c => c.text);
    return t;
  }
  cant(sentence, why) { return this.turn("abstain", this.say("cant"), { why, sentence }); }

  // "Do you mean…?": the nearest skills as chips, and no
  confirm(sentence, vec, options, why) {
    const pending = this.pending = { type: "confirm", sentence, vec, options };
    const chips = options.map(name => ({ text: this.byName.get(name).label, type: "choose", name, pending }));
    chips.push({ text: "No", type: "no", pending });
    return this.turn("ask", options.length === 1 ? this.say("not sure", { label: this.byName.get(options[0]).label }) : this.say("do you mean"), { chips, why, sentence, options });
  }
  chose(p, name) {
    const skill = this.byName.get(name);
    this.taught(p.sentence, skill, p.vec, "you said yes");
    return this.run(skill, this.valuesIn(skill, p.sentence), p.sentence, `confirmed: ${name}`);
  }
  declined(p) {
    this.inbox.push({ sentence: p.sentence, why: `not ${p.options.map(n => this.byName.get(n).label).join(", not ")}`, not: p.options, vec: p.vec, on: this.today() });
    return this.fallback(p.sentence, "you said no");
  }
  // a yes is an example for the skill: taught at once on your own device, waiting in the inbox on a page
  // anyone can use
  taught(sentence, skill, vec, why) {
    if (this.mode === "own") return this.teach(sentence, skill.name, vec);
    this.inbox.push({ sentence, why, suggest: skill.name, vec, on: this.today() });
  }
  teach(sentence, name, vec = null) {
    const skill = this.byName.get(name);
    if (!skill) return { ok: false, why: `no skill called ${name}` };
    const text = this.clean(sentence);
    if (S.examples(skill).includes(text)) return { ok: false, why: "already one of its examples" };
    const line = S.addLearned(skill, text, this.today());
    this.router.add(name, text, vec);
    if (this.onTeach) this.onTeach({ sentence: text, skill: name, vec });
    this.inbox = this.inbox.filter(e => e.sentence !== text);
    return { ok: true, line, md: skill.md };
  }
  // "that's not it", under an answer
  wrong(t) {
    if (!t || !t.sentence) return;
    this.inbox.push({ sentence: t.sentence, why: `wrong answer (${t.skill || t.project || "?"})`, not: t.skill ? [t.skill] : [], on: this.today() });
  }
  nothing(sentence, why) {
    this.inbox.push({ sentence, why, on: this.today() });
    return this.fallback(sentence, why);
  }
  fallback(sentence, why) {
    if (this.fallbackSkill) return this.run(this.fallbackSkill, {}, sentence, `${why}: the invitation`);
    return this.cant(sentence, why);
  }

  // a chip, tapped or typed
  act(chip, sentence) {
    if (chip.type === "project") return this.open(chip.id, "chip");
    if (chip.type === "part") return this.showPart(chip.id, chip.pi, "chip");
    if (chip.type === "more") return this.more();
    if (chip.type === "skill") return this.run(this.byName.get(chip.name), {}, sentence, "chip");
    if (chip.type === "choose") return this.chose(chip.pending, chip.name);
    if (chip.type === "no") return this.declined(chip.pending);
    return this.cant(sentence, "unknown chip");
  }

  // ---- skills -----------------------------------------------------------------------------------------
  run(skill, values, sentence, why = "") {
    for (const [slot, need] of Object.entries(skill.needs)) {
      if (values[slot]) continue;
      this.pending = { type: "value", skill, slot, values, sentence };
      return this.turn("ask", T.pick(need.ask, this.random), { why, sentence, skill: skill.name });
    }
    const said = Object.fromEntries(Object.entries(values).map(([k, v]) => [k, v.said]));
    const extra = { why, sentence, skill: skill.name };
    if (skill.kind === "question") {
      const leads = skill.leads.filter(id => this.projects && this.projects.byId.has(id));
      if (!leads.length) return this.turn("act", skill.answer || this.say("not written"), { ...extra, command: "form.open", chips: this.contactChip() });
      const first = this.projects.byId.get(leads[0]);
      if (leads.length === 1) return this.openWith(leads[0], skill.answer || first.meta.intro || `That's what ${first.title} was about.`, [], extra);
      // several projects answer it: a card for each, side by side; tapping one opens it
      this.frame = null;
      return this.turn("act", skill.answer || this.say("several", { n: NUMBERS[leads.length] || leads.length }), { ...extra, projects: leads,
        cards: leads.map(id => this.projects.card(id)), chips: [...leads.map(id => ({ text: this.projects.byId.get(id).title, type: "project", id })), ...this.contactChip()] });
    }
    const say = this.read(T.fill(T.pick(skill.replies.done, this.random), said));
