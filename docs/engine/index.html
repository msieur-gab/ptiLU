 conversational layer. The file system stays. An agent sits beside it — greets you by name, surfaces what's missing, accepts delegation in natural language, and points the workspace at the next action. Delivered as working code in the client's production stack, not a reference design.\n\n**Outcome:** In production. The company raised €2M in funding shortly after and now processes €300K+ in active business through the platform. The redesigned data room is the surface where every one of those transactions begins.\n\n## Overview\n\nDowgo is a blockchain-based renewable energy investment platform. Romain Menetrier, CPO/CTO, engaged me to redesign the due diligence data room — a regulated workflow where founders, legal teams, auditors, and investors coordinate around twenty-four required document types across ten categories. Two weeks. One consultant. Working code delivered into the client's git repository in React and Shadcn — the same stack the development team uses in production.\n\n## Problem\n\nEvery due diligence platform on the market is built on the same paradigm: a data room. Folders, files, upload buttons. The metaphor is a filing cabinet — a place to put things so other people can find them. The paradigm works. Users know how file systems behave. That fluency is an asset, not a constraint.\n\nUsers could organise. What they could not do was act.\n\nThe file system showed them what existed. It did not show them what was missing, what was overdue, or who needed to provide what. Every action required holding the full mental model of the regulated process in your head — and no surface anywhere told you where you stood. The cognitive load did not live in filing documents. It lived in tracking the process around them.\n\nThe brief, when Romain first described it, was to add AI categorisation. A modern solution for a modern platform. That instinct was wrong, and saying so was the first job.\n\n## The moment\n\nI pushed back on the brief and asked for time before touching a screen. Not designing. Listening. Mapping how users actually worked — not how they described working.\n\nI sketched five dashboard concepts during the first week. Each was technically correct and emotionally wrong. Dashboards make the user do the same triage that was already exhausting them, just with prettier charts. The problem wasn't a missing view. It was a missing voice. The data room held information. It never spoke.\n\nThe reframe arrived as a constraint, not a feature: *make it feel too easy to be true.* Due diligence platforms compete on visible complexity — every vendor stuffs the screen to justify the price tag. But Dowgo's real value was invisible: blockchain verification, regulatory rigor at the protocol level, code intelligence built by a CTO who understood compliance as infrastructure rather than policy. When that much intelligence flows through interconnected data, a single feature can unfold many tasks at once. Simplifying the interface did not diminish the platform. It magnified it.\n\nThat was the direction. Not a dashboard. A colleague handing you the next thing.\n\n## Approach\n\n### Design principles\n\nThree principles, held together.\n\n**Augment, never replace.** Users had decades of fluency with file systems. Replacing that paradigm meant replacing muscle memory. The cost is retraining. The benefit is aesthetic. Instead, the conversational layer was inserted *alongside* the file system, leaving the existing structure intact and giving it a voice.\n\n**Restraint as a design skill.** In a platform handling sensitive investment documentation — financial records, legal filings, KYC data — sending content to a third-party AI model introduces legal liability that the engagement could not justify. Pattern matching runs locally, costs nothing, exposes no data, and categorises the same documents with the same accuracy. Saying no to the modern answer was harder than saying yes. It was the right call.\n\n**Conversation over command.** The interface splits into two cognitive surfaces — an agent that thinks for you, a workspace that works with you. The agent narrows attention to the next action. The workspace executes it. Neither pretends to do the other's job. The loop closes on every upload.\n\n### Key decisions\n\n*Two surfaces, one loop.* The agent greets by name, knows the time of day, understands the user's role. Drop a ZIP archive — the system unpacks it, reads each file, and sorts everything into the canonical due diligence structure using pattern matching against the known anatomy of a data room. Once files are placed, the agent shifts register: it announces progress as a conversation, surfaces missing items as action cards, and points the workspace at the relevant folder when an action card is tapped. Every upload reassesses the state. The system is always current — not because someone updated a status field, but because the conversation never stops.\n\n*Pattern matching, not AI categorisation.* Twenty-four required document types across ten categories — Overview, Legal, Financials, Tax, Tech, Market, Governance, KYC/AML, Commercial, Risk. Regex with lookahead constraints captures the document anatomy more reliably than any LLM inference, runs in milliseconds on the device, and exposes zero content to a third party. The matching is a small dataset of human knowledge encoded once, not a model retraining problem forever.\n\n*Natural language delegation.* Due diligence involves multiple external parties. Coordinating document requests through form interfaces means filling out fields for recipient, document type, deadline, priority, notes — per request, per party. The delegation input compresses that into a single line: `@legal team provide shareholder agreement by :next Friday`. Trigger characters for people, files, and deadlines. The system parses the sentence, resolves the date in any European format, identifies the document type, and presents the delegation for confirmation. The interface does not ask the user to speak its language. It speaks theirs.\n\n*Welcoming entry, then scroll into the familiar.* The page opens with a greeting, the user's name, an always-visible status tracker, and action cards immediately operable. A smooth scroll then descends into the file system everyone already knew how to use. Two radically different paradigms, representing exactly the same data, connected by a single gesture.\n\n*Built to degrade.* The conversational agent enhances the experience. Remove it, and the core still works — file organisation, completion tracking, missing document alerts. Ambitious features ride on top of solid foundations. They never hold them hostage.\n\n*Delivered in the client's stack.* React and Shadcn, pushed directly into the production repository. Not a reference design to be interpreted by a development team. Working code to be extended. Alongside it: a Figma design system, hand-drawn interaction sketches, and written documentation of the design intent behind each decision — so the team could extend the product without guessing why something was built a certain way.\n\n## Outcome\n\nThe outcome was not a feature list. It was a posture.\n\nThe data room stopped being a place to deposit documents and became a place where action was already on the table. The user's mental model — what's missing, what's due, who needs to act — was no longer something they carried alone. The system carried it with them, and asked for the next move at the moment the next move was possible.\n\nTwo weeks from first conversation to working code in their repository. A 30-minute validation session with Romain confirmed the concept was technically feasible, cost-conscious, and intuitive. The development team took it from there. Dowgo went into production. The company raised €2M in funding shortly after. The platform now processes €300K+ in active business — and every one of those transactions begins inside the surface I redesigned.\n\nThe data room is one face of a deeper system — blockchain-anchored investment infrastructure built by a CTO who understands compliance at the protocol level. The interface had to honour that invisible infrastructure without imitating it. Simple on the surface. Serious underneath.\n\n## What it invites\n\nWalking into someone else's domain — blockchain, renewable energy, investment compliance — and finding the real problem does not require expertise in the domain. It requires expertise in how people work. The question is never \"what technology should we add?\" The question is \"where does the human struggle, and what is the minimum layer that makes the struggle disappear?\"\n\nThe user did not learn anything new. The system started talking. The features that mattered were the ones removed, not the ones added.\n\nThat is not a UX improvement. It is a paradigm shift delivered as a whisper.\n\n## Team\n\nDowgo was a solo engagement. Romain Menetrier carried the client side — he understood the problem deeply enough to recognise the reframing when it arrived, and trusted the engagement enough to let it land in production code. The development team at Dowgo extended the prototype into the live platform.\n\n## AI tools, human ownership\n\nBuilt solo. Product direction, architecture, every design decision, and acceptance criteria were mine. The tools below carried specific weight in the workflow.\n\n**Gemini** — Market-signal research. I framed the questions, weighed returned signals against domain knowledge, and decided which findings shaped product direction.\n\n**Lumo** — European regulation. EU-jurisdictional by design. I framed the compliance questions, tested returned interpretations against project constraints, and decided which guardrails to embed.\n\n**Claude Code (CLI)** — Code pairing, refactor, and review. Implementation against constraints I defined. I owned acceptance, integration, and ship decisions.\n\n**Claude (web)** — Positioning and pressure-testing. Used to stress-test my own framing — challenging assumptions, surfacing competing perspectives, sharpening claims before they shipped.\n\n## Tech\n\nReact + Shadcn/ui + TypeScript production deliverable · regex-based document classification against a canonical 24-required + 8-optional schema across 10 categories · ZIP archive ingestion and local extraction · custom relative-date parser for European formats and natural language (\"next Friday\", \"tomorrow\") · natural language delegation input with trigger characters for people, files, deadlines · React hooks + localStorage state, no global state management · scroll-snap three-section layout · action-card carousel · personal re-implementation in Lit web components + Dexie/IndexedDB · Figma design system + interaction sketches delivered alongside the code.\n"},{"id":"pebbble","md":"---\ntitle: Pebbble\ntype: work\ncontext: self-initiated\nyear: 2024–\nwhere: Self-initiated\nthemes: [distance, privacy, screens]\nintro: Pebbble was born from that question.\nbrief: \"Separated families stay in touch with calls and messaging apps.\"\nquestion: What if a parent's voice lived in something the child can hold, that nobody can block?\nanswer: Hand-formed stones with a sealed NFC tag carrying encrypted voice messages. No screen, no account. Holding the stone is the key, and a message can wait years to open, like one for an 18th birthday.\ntagline: A stone that carries voices.\nwhat: A handcrafted stone with a hidden NFC chip. Tap it to a phone, hear a parent's voice. End-to-end encrypted, stored on IPFS, decrypted only by physical possession of the object.\nwhy: We have dematerialised the things that carry memory — the voice, the touch, the object on the nightstand. Co-parenting apps track schedules. Messaging tools store everything on servers that can be subpoenaed. None of them were designed for a three-year-old who cannot read, or for a family where distance is not chosen but imposed.\nhow: Client-side AES-256-GCM encryption, IPFS for censorship-resistant storage, NFC serial number as key derivation input. No accounts, no server, no database of messages. The system is incapable of betraying its users — not by policy, but by architecture.\nproof: Working PWA with dual playback modes (persistent and ephemeral). The architecture designed for the hardest case serves every other case trivially.\nsource: web-thecube/content/pieces/pebbble\nkeywords: [child, children, kid, kids, daughter, son, parent, parents, father, mother, family, separated, separation, distance, far away, abroad, abduction, custody, divorce, voice, message, messages, presence, memory, memories, keepsake, stone, object, nfc, encrypted, encryption, censorship, blocked, birthday, grandparents, without a phone, without a screen]\nanswers:\n  - How can a child keep a parent's voice when they live apart?\n  - How do I stay present for a child who lives far away?\n  - How do I leave a message my child can only open years from now?\n  - Can technology hide inside an ordinary object?\n  - What happens to my data if the company disappears?\nquestions:\n  - q: How can a parent stay present for a child who lives far away?\n    see: A handcrafted stone with a hidden NFC chip\n  - q: Why voice instead of text or video?\n    see: The physiology is unambiguous.\n  - q: How do you design for a child who cannot read?\n    see: The first attempts were not stones.\n  - q: How can a message stay private without trusting a company?\n    see: The encryption key is derived from the NFC tag\n  - q: What if the device the child uses is monitored?\n    see: Ephemeral mode: the audio plays once.\n  - q: Why a stone?\n    see: The object needed to be convenient\n  - q: Why not an app from the app store?\n    see: An app in the app store can be found\n  - q: Can a message survive censorship?\n    see: Content-addressed, decentralized.\n  - q: What about the right to be forgotten?\n    see: But permanence has a cost.\n  - q: Why design for the worst case?\n    see: The extreme case: no reliable internet\n  - q: Why no accounts or passwords?\n    see: An account is a target.\n  - q: How is the stone made?\n    see: Each Pebbble is hand-shaped\n---\n\n## TLDR\n\n**What:** A handcrafted stone with a hidden NFC chip. Tap it to a phone, hear a parent's voice. End-to-end encrypted, stored on IPFS, decrypted only by physical possession of the object.\n\n**Why:** We have dematerialised the things that carry memory — the voice, the touch, the object on the nightstand. Co-parenting apps track schedules. Messaging tools store everything on servers that can be subpoenaed. None of them were designed for a three-year-old who cannot read, or for a family where distance is not chosen but imposed.\n\n**How:** Client-side AES-256-GCM encryption, IPFS for censorship-resistant storage, NFC serial number as key derivation input. No accounts, no server, no database of messages. The system is incapable of betraying its users — not by policy, but by architecture.\n\n**Proof:** Working PWA with dual playback modes (persistent and ephemeral). The architecture designed for the hardest case serves every other case trivially.\n\n---\n\n**Role:** Creator & Lead Designer/Engineer\n\n**Stack:** Vanilla JS, Web Crypto API (AES-256-GCM, PBKDF2), Web NFC, IPFS/Pinata, Dexie.js\n\n**Period:** 2024–present\n\n## The Slow Fade\n\n> \"Loin des yeux, loin du cœur.\"\n> Far from the eyes, far from the heart.\n> — French proverb\n\nThe proverb exists in every language because the pain exists in every culture. Distance erodes presence. Absence, sustained long enough, becomes its own kind of loss — not the sharp grief of death, but the slow fade of connection stretched too thin.\n\nWe have dematerialised most of what carries memory. The letters are gone. The photo albums are in a cloud. The voice that said goodnight is a notification on a screen that was already dismissed. We traded physical presence for digital convenience and lost something we cannot name but feel every day.\n\nSome distances are chosen. The parent who works across time zones, who trades bedtime stories for quarterly targets. The sacrifice made for provision, paid in presence.\n\nSome distances are imposed. The military family whose parent serves on foreign soil, whose calls come at strange hours if they come at all.\n\nAnd some distances are stolen. The child taken across a border. The parent left searching. The silence that authorities cannot even quantify.\n\nBehind every uncounted case is a parent who cannot hold their child. A child who cannot hear their parent's voice.\n\nI am personally familiar with this silence.\n\nAn entire industry looked at these families — all of them, from the business traveler to the abducted child — and offered them scheduling apps.\n\n## Voice, Not Text\n\nThe first attempts were not stones. They were logbooks — heavily tech-oriented memory systems capturing text, pictures, timestamps, anchors in time. They failed the way most technology fails families: by assuming literacy, by demanding interaction, by feeling like documentation rather than connection. A three-year-old cannot read a logbook. A six-year-old does not find comfort in a timestamped archive. These systems recorded presence. They did not deliver it.\n\nLanguage, persistence, reading ability — each became a constraint that narrowed the question: which stimulus triggers not the recall of a memory, but the feeling of a reconforting presence? The research pointed in one direction. The human brain treats a familiar voice as a neurobiological safety cue. A child recognizes their parent's voice from birth. By two months, that voice is encoded as a marker of safety — a familiar voice evokes the entire mental representation of a person, including visual memories and emotional context, even in the absence of a face. Neuroscience has a clinical term for what a parent's voice does to a child's nervous system: non-pharmacological anxiolytic. It reduces anxiety without medication. Not image, not video, not text. Voice carries the message, the sentiment, the emotions, and most importantly — the presence.\n\nThe physiology is unambiguous. Hearing a loved one's voice triggers a measurable cortisol reduction — stress suppression — and a significant increase in oxytocin, the hormone that mediates bonding. Text messaging produces neither. No cortisol change. No oxytocin release. Physiologically identical to the control group. A text says \"I love you.\" A voice makes the body believe it.\n\nA study of 1,772 participants found that voice-only communication consistently outperforms video in empathetic accuracy — the ability to correctly identify what another person is feeling. Removing visual input forces the brain to focus entirely on paralinguistic cues: tone, inflection, rhythm. Video calls can paradoxically increase distress in children by highlighting physical absence. The screen shows the parent's face but confirms they are not here. Voice does not carry that contradiction. Voice accompanies. It does not remind you of what is missing.\n\nEmotional voices are not only recognised more accurately — they are retained better over time. After one week, the memory trace of an emotional voice is nearly twice as strong as a neutral one. A parent's voice saying goodnight is not just heard in the moment. It persists. The brain holds onto it because it matters.\n\n> A voice in the dark is a presence. A text in the dark is information.\n\n## A Stone\n\nTechnology announces itself. Screens glow. Devices demand charging. Gadgets require learning, updating, maintaining.\n\nA stone does not announce itself. A stone on a nightstand is invisible. A stone in a pocket is unremarkable. A stone in the hands of a child being monitored raises no suspicion.\n\nThe object needed to be convenient — something that fits in a child's pocket, something you could always have with you. Watching children explore their surroundings, one thing always appealed to me: a cross-gender constant, older than any toy. Children collect stones. Simple, dirty stones, cherished like the most precious discovery of the day — sometimes of a life. No child has ever been taught to pick up a stone. They just do.\n\nEach Pebbble is hand-shaped from a water-based composite that solidifies on contact with air and reproduces the exact texture and feel of a river pebble — same grain, same weight, same way it warms progressively in your hand as you hold it. The material allows shaping around water-resistant, sealed NFC tags without seams, without molding marks, without any visible sign that it holds anything at all. People discovering it for the first time try to see how it opens, what it contains. There is nothing to find. It is a stone.\n\nA child might find it interesting at first. But the relationship with the stone changes when they realise it is coated with a fine luminescent layer that makes it glow in the dark — distinguishing it from every other pebble in their collection. And it changes again, permanently, when they witness it connect to a phone and hear a voice they love.\n\nNot just another nice pebble. A magical one. Like the pebbles from *Le Petit Poucet* — the stones that lead him and his brothers and sisters back through the forest, back to their family, back to their loved ones. That is where the stone comes from.\n\nInside each one: an NFC chip. No battery. No screen. No moving parts. Twelve cents of hardware that draws power only at the moment of reading, then waits again. It will wait for decades. Hold the stone to a phone. Hear your parent's voice. A child does not need to understand IPFS or NFC. They need to understand: hold this to the phone, and you hear mama's voice.\n\nI collected reference pebbles from a river. They stand aligned in a box on my desk — guides for shape and weight. Hand-shaping these stones has something relaxing about it, leaning towards meditation. The constraint was finding a material clean enough — non-toxic once cured, safe for a child who will carry it everywhere. Once solved, the process became straightforward. The complexity lives elsewhere.\n\n> What lasts is simple. What matters should last.\n\n## The Worst Case Designs the Architecture\n\nDesign for the extreme case and the common case becomes trivial.\n\nThe extreme case: no reliable internet, active censorship, a monitored device, a child too young for interfaces, content that must survive hostile infrastructure, technology that must last years without maintenance.\n\nEvery layer solves a specific constraint:\n\n**The stone is the key.** The encryption key is derived from the NFC tag's unique serial number plus a timestamp, run through PBKDF2 with 100,000 iterations. The key doesn't exist anywhere — not on a server, not in the app, not in the stone. It is computed at the moment of reading from the physical object itself. No accounts, no passwords. Physical possession is the only authentication.\n\n**IPFS distributes the voice.** Content-addressed, decentralized. Block one node, it routes through another. Block a domain — there is no domain to block. A voice recorded in one country reaches a child in another regardless of what stands between them.\n\n**No central server.** The storage provider never sees plaintext. There is no database of messages, no server logs, no central point that can be compelled to reveal content.\n\n> The system is private by architecture, not by policy. There is no database of messages to subpoena.\n\nIf a parent's voice can reach an abducted child — safely, secretly, persistently — then the military family on deployment, the divorced couple across distance, the grandparent recording stories are all already served.\n\n## Two Modes, One Stone\n\nThe app itself serves two fundamentally different experiences. The reader must be poetic — the interface disappearing to offer nothing but the presence of a warm voice. How do you design a screen that gets out of the way of a parent saying goodnight? The writer is the opposite problem: recording, managing, reusing messages, adding music. A parent recording a bedtime story at 11 PM after a long day cannot afford to fight an interface. Simplicity is not a trend here — it is the constraint that guarantees the system gets used at all.\n\nBut the deeper split is not between reading and writing. It is between safety and evidence.\n\nA child with their own phone keeps the voice always available. Cached, ready whenever loneliness arrives at 2 AM. But what about a child using a borrowed device? A shared tablet at a shelter? A phone belonging to someone who must not know what it accessed?\n\nEphemeral mode: the audio plays once. When the app closes, nothing remains. No history, no cache, no evidence. The voice was heard, and then — nothing.\n\nThis is the hardest design constraint I've worked with. Not technically. Emotionally. The idea that a child needs to hear their parent's voice in secret, and that evidence of hearing it could make things worse.\n\n## What Was Rejected\n\n**Accounts.** An account is a target. It can be discovered, subpoenaed, locked. The stone authenticates by physical possession. Nothing else.\n\n**Cloud storage.** A server is a single point of failure and a single point of compulsion. IPFS distributes content. No entity controls it.\n\n**Mobile app.** An app in the app store can be found on the phone. A PWA launched from an NFC tap operates ephemerally — no installation, no icon, no evidence. The web is the delivery mechanism because the web can disappear.\n\n**User-created passwords.** A child cannot remember a password. The stone itself is the password.\n\n## What Pebbble Shares\n\nPebbble is one of three projects using the same architecture: NFC tag on a physical object triggers a web experience with zero intermediary.\n\n> **Drop** — bottle cap triggers water map. Utility.\n> **Vrooom** — wooden car triggers playground discovery. Play.\n> **Pebbble** — stone triggers encrypted voice. Presence.\n\nSame pattern, different stakes. The NFC tap replaces the entire onboarding flow in all three. But only Pebbble carries the weight of what happens when the physical object is the last connection between a parent and a child. The architecture that makes Drop convenient makes Pebbble necessary.\n\n## The Tension That Stays Unresolved\n\nIPFS permanence is the feature for the humanitarian case. Once pinned, the voice persists independent of any server, company, or jurisdiction.\n\nBut permanence has a cost. What about messages you later regret? What about a child who grows up and wants the voice to stop? This tension — between censorship resistance and the right to be forgotten — is unresolved. I include this because most portfolios present resolved problems. This one isn't resolved. That's honest.\n\n## Ripples\n\nAs a child, it took me hours of practice to learn to skip stones across water. But what I loved most about it — and certainly why I still love it — is not the throw. It is what happens after. Each impact of the stone on the surface creates ripples that spread outward, connect to each other, and travel until they reach the shore. Their final physical destination.\n\nA voice recorded into a Pebbble does the same thing. It leaves one hand, crosses whatever distance stands between two people, and arrives — not as data, not as notification, but as presence. A ripple that reaches the shore.\n\nA stone. A voice. A child who remembers.\n"},{"id":"senz","md":"---\ntitle: Senz\ntype: work\ncontext: commissioned\nyear: 2018–21\nwhere: Allianz · Kaiser X Labs\nthemes: [ideas, trust]\nintro: That's what Senz was about.\nbrief: \"We need to innovate faster.\"\nquestion: What if testing an idea cost less than the meeting about it?\nanswer: Experts sketch an interface on paper and get a deployable MVP built on the company's own design system. 96% less time from idea to MVP, six months before Microsoft's Sketch2Code and seven years before Figma Make.\nwhy: Large organisations lose most of their internal ideas to a validation cycle too expensive to run. Four disciplines, months of sprint, a six-figure budget — most experts never get permission to test what they already know.\nwhat: A platform that lets non-designers and non-developers sketch an interface on paper, have it read by a sovereign vision model, and deploy as production code in the company's own design system — without a developer in the loop.\noutcome: Employees inside Allianz tested radical business ideas in days instead of quarters, including one that opened a new insurance market segment through a service the standard product pipeline would never have produced.\nsource: web-thecube/content/pieces/senz\nkeywords: [innovation, innovate, idea, ideas, prototype, prototyping, mvp, test, testing, experiment, sketch, drawing, design system, developer, developers, faster, speed, slow, budget, deck, board, decision, debate, meeting, corporate, insurance, agency, empower, team, non-technical, proof of concept, poc, validate]\nanswers:\n  - How can my team test an idea before we commit a budget?\n  - How do we stop debating ideas and start learning from them?\n  - Can people without a technical background build a prototype themselves?\n  - How do we make failing cheap enough that people dare to try?\n  - The board wants proof, not another deck. Where do we start?\n  - Our innovation lab is too slow. How do we speed it up?\n  - Everyone agrees something must change. Nobody agrees on what.\nquestions:\n  - q: How do we make a design system adoptable?\n    see: Paper and pen. The most radical\n  - q: How do we transform a large corporation?\n    see: Organisations are closed systems\n  - q: How do we accelerate innovation?\n    see: Senz bypassed the six-figure budget gate\n  - q: How do we reduce the cost of an MVP?\n    see: Large organisations lose most of their internal ideas\n  - q: Can people without a technical background build a prototype themselves?\n    see: A platform that lets non-designers and non-developers\n  - q: How do we stop debating ideas and start testing them?\n    see: Senz bypassed the six-figure budget gate\n  - q: What should an AI do when it is not sure?\n    see: The model was trained by design never to pretend\n  - q: Why did an earlier tool for non-experts fail?\n    see: Momentum had come first\n  - q: How does a drawing become working code?\n    see: A two-stage recognition pipeline.\n  - q: Can one small test open a new market?\n    see: An in-house agent working on bike insurance\n  - q: Should the AI run on our own servers?\n    see: On-device, sovereign model.\n  - q: Who built Senz?\n    see: I led the project end-to-end\n---\n\n*Making sense of ideas — turning a sketch into a deployed prototype without a developer in the loop.*\n\n## Summary\n\n**Why:** Large organisations lose most of their internal ideas to a validation cycle too expensive to run. Four disciplines, months of sprint, a six-figure budget — most experts never get permission to test what they already know.\n\n**What:** A platform that lets non-designers and non-developers sketch an interface on paper, have it read by a sovereign vision model, and deploy as production code in the company's own design system — without a developer in the loop.\n\n**Outcome:** Employees inside Allianz tested radical business ideas in days instead of quarters, including one that opened a new insurance market segment through a service the standard product pipeline would never have produced.\n\n## Overview\n\nSenz was a prototyping tool built at Kaiser X Labs and deployed inside Allianz. It gave domain experts — claims handlers, underwriters, product managers — direct authorship over working product prototypes, without a developer in the chain. I led the project with Sven Martinov and Olivier Gonthier as the core team, inside Kaiser X Labs, Allianz's innovation studio. Shipped seven years before Figma Make.\n\n## Problem\n\nLarge organisations spent the last decade on digital transformation, secretly hoping it would keep startups and market disruptors away from their business. Each new framework, method, and tool they stacked on was meant to make them faster. Instead, it raised the locking bar on budget approval — committing a full team of designers, researchers, and developers to build an MVP that was already outdated before launch.\n\nThey didn't need more matter. They needed to rearrange what they had.\n\nOrganisations are closed systems of a different kind of matter. Frameworks, components, design systems, data, business logic, flows, APIs, and the people who understand them — the latent potentials sitting inside every large company. None of it is missing. Most is underused, mis-combined, or defended by whichever team currently owns its shape.\n\nLavoisier, working on combustion in the 1780s, established a principle that dismantled alchemy: in a closed system, nothing new is created and nothing is lost. Everything is transformed.\n\nSenz was built on this principle.\n\n## The moment\n\nMomentum had come first — a tool we built to let non-experts contribute to Allianz's Angular atomic library. It failed. The learning curve was too steep, and the people it was supposed to empower could not climb it quickly enough to stay engaged. The system was sophisticated. That was the problem.\n\nA few months later, in a meeting about the coming design system, a home claims expert walked to the whiteboard and started sketching a First Notification of Loss — boxes, hero, the few inputs a customer needs to report that something has gone wrong. She asked the builders whether their components could handle the cases and logic she was drawing. My mind slipped sideways, to Google Photos — how it had quietly crossed the threshold where labelling an image was the same thing as reading it. Pixels into signal. Signal into structured matter the system could act on.\n\nPaper and pen. The most radical and simple input on earth. The medium people reach for long before they turn to a computer, available in every office and every country, affordable at every economic tier. If Google could turn photos into structured matter at scale, we could turn drawings into production components the same way. Momentum had tried to teach experts a new tool. Senz would meet them at the tool they already used.\n\n## Approach\n\n### Design principles\n\nSenz was built on three principles, held together.\n\n**Affordance.** The interface mirrored the simplicity of the raw material it accepted. A canvas, a side toolbar, a predict button. No dashboard, no project setup. Input arrived through whichever surface the user already had — a phone photo via the companion app, direct drawing on a touch-enabled laptop, drag-and-drop of pre-made wireframe elements, SVG or image upload. Data arrived the same way: spreadsheet, CSV, database endpoint, one click through connectors. Senz never contained data. It managed the flow between systems that already held it.\n\n**Assistance.** The model was a translation layer, never a generative one. The system recognised the user's intent but did not produce it. Completed steps folded and dismissed as progress was made, clearing the canvas without erasing the path. Real-time collaboration ran through mandate roles — admin, designer, reviewer, approver — so different experts could author different layers of the same prototype without colliding.\n\n**Transparency.** The model was trained by design never to pretend. Confidence thresholds were tuned to surface uncertainty rather than hide it — if the system did not recognise a shape, it said so. Every decision was the user's, and therefore auditable by the user. The stack was there to serve, not to harvest.\n\n### Key decisions\n\n*The companion app preprocessing pipeline.* Users couldn't be asked to stage their shot. A phone photo of a real whiteboard, with glare, angle, and other people's notes in the background, had to be readable by the production system — no special paper, no careful framing, no instructions. Browser-based capture wasn't technically possible at the time, so the companion app handled its own computer-vision preprocessing before the main model ever saw the image: object extraction, foreign-item removal, drop-shadow and flare filtering, perspective correction. Affordance enforced upstream, not just in the UI.\n\n*One predict button, not continuous recognition.* The model ran on our own on-prem hardware. Continuous prediction would have burned compute for marginal UX gain, and we refused it on ecological grounds. The consequence reshaped the interaction: a deliberate predict action invited the user to think first, draw, and then translate. The pause before pressing predict was a thinking space the tool preserved on purpose.\n\n*A two-stage recognition pipeline.* A wireframe is not a grid of pixels. It's a document with layout structure — a button is a button partly because of where it sits in the composition, not only because of how it looks. The recognition ran in two stages to honour that: a detection model (RetinaNet) located the shapes on the page, and a classification model (LayoutLM) read each region in its spatial context, deciding what the shape was given what surrounded it. The system understood composition, not just shapes.\n\n*Direct manipulation on the canvas, versioning for tested journeys.* The drawing was live material. Marks could be erased, redrawn, moved, scaled at any point — the canvas worked the way a sketchbook works, and adjustments happened in the drawing itself. Versioning operated at a different layer. Once a prototype had been predicted and deployed — run against users, shown to stakeholders, tested in the wild — that version was preserved. The user could then branch the project, redraw the canvas, and produce a new version to compare against the first. A/B testing was an intentional capability, not a side effect: projects could be cloned, deployed online with public or password-gated access, and evaluated side by side against real users.\n\n*Side-by-side prediction, then toggle.* The first release showed the original drawing and the recognised version side by side by default. In testing we watched users begin to contort their sketches to help the model read them — the draw-predict-infinity-loop — and we moved side-by-side to a toggle. Transparency, on demand. Default-visible uncertainty had become its own attention tax.\n\n*On-device, sovereign model.* No remote API calls. No third-party cloud dependency that could change its terms or lose compliance posture mid-project. This was a 2018 decision that most 2026 AI products still have not made.\n\n## Outcome\n\nThe outcome was not a metric. It was a capacity.\n\nSenz bypassed the six-figure budget gate that had stood in front of every internal test. No one needed approval to test a business idea. A claims handler, an underwriter, a product manager could now assemble a working prototype from a sketch in days rather than quarters, deploy it, run it against real data, and archive it when it didn't work — without a developer in the chain, without a design sprint, without a proposal deck. The unit of measurement shifted from *the idea* to *the test*. Failure became cheaper than the meeting held to debate it.\n\nOne specific test proves the capacity worked.\n\nAn in-house agent working on bike insurance — a single employee, not a consultant — used Senz to test an idea the company would not have generated otherwise. The observation was plain: many urban cyclists were not ready to commit to monthly or yearly premiums, and the institutional default was to write them off. The hypothesis was that this was the wrong gesture.\n\nWhat if, instead of turning these people away, the company offered them a near-zero-cost service — something small, useful, oriented toward preventing the risk they were not yet ready to insure against? Not a discount. Not a trial. A caring gesture: the business acknowledging it was about risk reduction, not only premium collection.\n\nSenz made it testable in days. The prototype was assembled from existing customer data, infrastructure, and risk models — recombined into a service that would never have survived the budget approval required to build it conventionally. The segment the company had previously been unable to reach began to engage — not with the product, but with the posture behind it. Trust was the outcome. The service was only its instrument.\n\n> Technology like this will revolutionize the way we innovate and supports non-designers and non-developers on their way to build a digital product by themselves.\n> — Kai Kölsch, Founder & CEO, Seedbox Ventures\n\n## What it invites\n\nThe matter is already there. The work doesn't belong where it used to.\n\nIt stops being the specialist's — the consultant, the lab, the people with permission to conjure. It belongs to anyone who touches the matter. The CTO whose systems already contain latent capability. The designer who has seen what the customers actually need. The claims expert at the whiteboard. These are the people who already know. Most of the time, they are waiting for permission.\n\nSenz was one instrument for granting that permission. There will be others. The matter is rarely the obstacle.\n\n## Team\n\nI led the project end-to-end at Kaiser X Labs (Allianz): product concept and design, full UX, end-to-end training dataset and labeling strategy, multi-framework reasoning, and the research-insights connectors that let us validate business models on real data.\n\nThe core team was three.\n\n**Sven Martinov**\n: Built the four ML models. Deployed, ran, and scaled the on-prem inference servers. Scaled the labeling studio. Owned the FastAPI connectors across the ML and no-code surfaces.\n\n**Olivier Gonthier**\n: Rebuilt the multimodal interface — touch, pen, drag-and-drop, upload. Built the multi-framework code-mapping engine and the conditional business-logic builder.\n\nTwo earlier contributors shaped Senz before the core team came together.\n\n**Jakob Berhend**\n: Design and documentation in Senz's early stage. Kept the project's progress legible as the concept took shape.\n\n**Maksim Kipot**\n: Built the front-end of the original Senz prototype.\n\nBjörn Frank sponsored the deployment with continuous support and a visionary commitment to scale the product in-house.\n\n## Tech\n\nFlutter companion app with custom computer-vision preprocessing · RetinaNet for region detection, LayoutLM for contextual classification · on-prem inference, no remote API calls · multi-framework output (Angular, Vue, React) targeting numerous design systems including Allianz's internal library, IBM Carbon, Google Material, Microsoft Fluent · webhook and connector-based integrations · declarative flow and logic composition layer · versioned prototypes with public or password-gated deployment.\n"},{"id":"vrooom","md":"---\ntitle: Vrooom\ntype: work\ncontext: self-initiated\nyear: \"\"\nwhere: Self-initiated\nthemes: [screens]\nintro: Vrooom came from that thought.\nbrief: \"Kids' games belong on screens.\"\nquestion: What if the digital part only existed to send parents and kids outside together?\nanswer: A hand-planed wooden car with an NFC tag. Tap it at a playground or a walk to check in and earn a badge, then print it, colour it and glue it into a handmade travel passport. The phone witnesses the adventure, it doesn't run it.\ntagline: A business model disguised as a wooden car.\nwhat: A wooden toy with an NFC chip links to a playground discovery PWA. Children check in, earn badges, print them through the company website, color them, glue them into a handmade passport. Every print sends a parent to the product catalog — without an ad, a popup, or a captured email.\nwhy: Children's apps monetize attention. Growth hacking monetizes trust. Both extract more than they give. Vrooom inverts the model: the utility earns the visit, the visit earns the discovery, the discovery earns the next purchase — if the product deserves it.\nhow: NFC as entry point, zero accounts, zero tracking, E2E encrypted WebRTC bridge to website for printing. The product serves an immediate need with no compromise. The business grows because people come back, not because they're brought back.\nproof: 15 seconds of screen time per session. Zero data sent to any server. The growth channel is a parent choosing to print something for their child.\nsource: web-thecube/content/pieces/vrooom\nkeywords: [children, kids, child, toy, toys, wooden, wood, screen, screens, screen time, play, playground, outdoor, outside, family, parent, parents, together, nfc, game, games, phygital, physical, without ads, advertising, discovery, crowdfunding, handmade]\nanswers:\n  - Can a toy be connected without being addictive?\n  - Can digital play happen without a screen?\n  - Can the object itself be how people find the product?\nquestions:\n  - q: Can a product grow without advertising?\n    see: This is led-growth without the growth hacking.\n  - q: How do we get parents off their phones at the playground?\n    see: The phone is not the villain.\n  - q: Can a children's product work without tracking children?\n    see: A wooden car. Beech\n  - q: Why refuse gamification?\n    see: No points, no streaks, no leaderboards.\n  - q: How does the business make money without ads?\n    see: A parent standing at a printer\n  - q: Should a connected toy work without its app?\n    see: The first prototypes went to neighborhood kids.\n  - q: How do you align a business model with the user's interest?\n    see: And Vrooom carries a question the others don't ask.\n  - q: How little screen time can a digital product need?\n    see: 15 seconds of screen time per session.\n  - q: Why should the parent hold the phone, not the child?\n    see: The phone belongs to the parent.\n  - q: How do you make an object that lasts?\n    see: Hand-planed from rectangular blocks\n  - q: What is wrong with children's apps?\n    see: Children's apps are a billion-dollar industry\n  - q: How does a child check in at a playground?\n    see: No \"select a playground\" step.\n---\n\n## TLDR\n\n**What:** A wooden toy with an NFC chip links to a playground discovery PWA. Children check in, earn badges, print them through the company website, color them, glue them into a handmade passport. Every print sends a parent to the product catalog — without an ad, a popup, or a captured email.\n\n**Why:** Children's apps monetize attention. Growth hacking monetizes trust. Both extract more than they give. Vrooom inverts the model: the utility earns the visit, the visit earns the discovery, the discovery earns the next purchase — if the product deserves it.\n\n**How:** NFC as entry point, zero accounts, zero tracking, E2E encrypted WebRTC bridge to website for printing. The product serves an immediate need with no compromise. The business grows because people come back, not because they're brought back.\n\n**Proof:** 15 seconds of screen time per session. Zero data sent to any server. The growth channel is a parent choosing to print something for their child.\n\n---\n\n**Role:** Systems Designer & Product Strategist\n\n**Key supporter:** Thomas Duester — kept pushing when I was ready to move on. Some projects survive because someone else refuses to let them die.\n\n**Stack:** Vanilla JS, Three.js, Leaflet, Overpass API, Valhalla routing, Dexie.js\n\n**Design metric:** Screen time measured in seconds per interaction, not minutes.\n\n## The Scene That Repeats\n\nA child runs to the bench where her father sits. She holds up a stick — a wand, perhaps, or a sword, or something that has no name yet because she is still deciding. She wants him to see.\n\nHe glances up from his phone. \"That's nice, honey.\" His eyes return to the screen.\n\nShe waits. The stick lowers. She walks back to the grass, alone.\n\nThe phone is not the villain. The phone is the symptom. The villain is the exhaustion, the isolation, the impossible demands placed on parents who have no village. The phone fills the vacuum we created.\n\nBut what else could fill it?\n\n## The Industry's Bargain\n\nChildren's apps are a billion-dollar industry built on a single transaction: silence purchased with screen time. Engagement is the metric. Retention is the goal. The app succeeds when the child does not look up.\n\nBehind this industry sits another one: growth hacking. Captured emails. Retargeting pixels. Push notifications. Streak mechanics. Dark patterns dressed as engagement. The business model requires the user to be brought back — because the product alone is not worth returning to.\n\nWhat if the product was worth returning to?\n\n## The Inversion\n\nA wooden car. Beech — closed grain, food-safe, built to outlast the child who holds it. Inside: an NFC tag. Tap it to a parent's phone and a PWA opens — a playground discovery app that checks in at parks, earns badges, and gets out of the way. Fifteen seconds of screen time per session. No account. No data sent anywhere. No push notifications. No streaks.\n\nThe app serves one need: a child wants to explore. It serves it completely, then disappears.\n\nBrands win more from being remembered for what they leave behind than from what they took.\n\n> The toy does not need the phone. The phone needs the parent.\n\nThis is the foundation. A product that respects its user has earned something no retargeting pixel can buy: trust. A parent who trusts the product comes back. Not because they were reminded. Because they chose to.\n\n## The Object Earns the System\n\nThe shape descends from a childhood memory — matchbox cars with cork wheels. Why those toys lasted was not their complexity. It was their simplicity. They were substrates for play, not scripts for it. No doors, no windows, no driver. Every detail removed is a story the child gets to add.\n\nHand-planed from rectangular blocks — finding the right taper, grip, and weight happened physically, not in CAD. The bottom tapers at front and back — not decoration, but function. Push it like a friction toy and the taper lifts it slightly, prevents scratching, makes the glide smooth. There is a Japanese carpentry principle: build it in a way that it lasts as long as it took the tree to grow.\n\nThe first prototypes went to neighborhood kids. No instructions, no explanation. They connected with the object before anyone mentioned the app. The wood, the weight, the shape. If the physical object does not stand alone — if it needs the digital to justify itself — the design has failed. The NFC inside is an expansion, not a requirement.\n\nThe design goal for the first moment a child taps the car to a parent's phone: nothing less than magic. Eyes shining. The thing in their hand was hiding this all along.\n\nA product people love is a product people return to. That is not a marketing insight. It is a design decision.\n\n## The System\n\nNo avatar, no account, no login. The child's identity in the app is their wooden car.\n\nThe NFC tag carries a URL pointing to a car configuration — a 3D model with mapped parts, colors, and sounds. Tap the car to the phone, and it appears on screen: a rendered wooden toy that spins, responds to touch, and revs its engine. The 3D viewer captures a side-view snapshot that becomes the child's marker on the map. Their car drives across the neighborhood as they walk.\n\nNo \"select a playground\" step. No trip planning. The child walks. When they arrive — a playground, a park, a pool — they tap \"I'm here.\" Fresh GPS, nearest match within 150 metres, visit logged.\n\n## The Growth Channel Is Paper\n\nThe badge system is designed to end in paper, not pixels.\n\n- **Playground badges** — one per unique place visited\n- **Regular badges** — earned after 10 visits to the same place\n- **Milestone badges** — shields for 1, 5, 10, 25, 50 unique playgrounds\n\nAll badges are SVG line art. Intentionally uncolored. The badge page connects to the Vrooom website via end-to-end encrypted WebRTC — a single button, no account, no cloud. The 3D car viewer doubles as a coloring-book generator — choose an angle and it renders a line-art outline ready for printing.\n\n> Print the badges. Cut along the lines. Color them in. Color the car. Glue them into a handmade passport.\n\nThe badges end in paper. But the path to paper passes through the Vrooom website. That visit is not accidental.\n\nA parent standing at a printer, waiting for badge sheets, is standing inside the company's product catalog. No banner. No popup. No \"you might also like.\" They came because the app was useful. They stay because the products are visible. They return because their child earned new badges.\n\nThis is led-growth without the growth hacking. No captured email. No retargeting pixel. No notification asking them to come back. The utility earns the visit. The visit earns the discovery. The discovery earns the next purchase — if the product deserves it.\n\nEvery children's app monetizes attention. Vrooom monetizes the moment a parent chooses to print something for their child. The difference is who holds the power in that transaction.\n\n## What Was Rejected\n\n**Gamification.** No points, no streaks, no leaderboards. The moment you add streaks, you add anxiety. A playground is not a competition.\n\n**Social features.** No friends, no sharing, no \"see where other kids are.\" Social features shift focus from exploration to performance. The child should discover playgrounds because they are curious, not because their friend did.\n\n**Turn-by-turn navigation.** Vrooom shows walking routes when asked, but does not guide. A child walking to a playground should look at the world, not at a screen.\n\n**Photo capture.** Rejected — it puts the phone back in the child's hands at the moment they should be playing. The check-in is the record. The badge is the memory.\n\n**Child-held device.** The phone belongs to the parent. If the child holds the phone, the phone becomes the toy. If the parent holds the phone, the phone becomes the bridge.\n\n**Ads, emails, push notifications.** The conventional growth toolkit. Every one of them trades user trust for a short-term metric. The product grows by being worth returning to, or it does not grow.\n\n## What Lasts\n\nA shape that carries no date cannot become dated. A material that ages cannot become obsolete. Fifty years from now, the same car will feel the same in a child's hand, will invite the same open stories, will wait for the same imagination to bring it alive.\n\nAnd perhaps, by then, it will carry something more. The passport stamps from trips that became legends. The layers of memory pressed into an object, invisible as the NFC chip, present as the wood's weight.\n\n> The toy is not the legacy. The play is the legacy. The toy is just what holds it.\n\n## What Vrooom Shares\n\nVrooom is the third project in the physical-digital-bridge cluster:\n\n> **Drop** — bottle cap triggers water map. Utility.\n> **Pebbble** — stone triggers encrypted voice. Presence.\n> **Vrooom** — wooden car triggers playground discovery. Play.\n\nBut Vrooom adds something the others don't: the output is physical too. The digital layer is sandwiched between two physical ones — a wooden car on one end, a paper passport on the other.\n\nAnd Vrooom carries a question the others don't ask. Drop proves that public infrastructure can replace proprietary APIs. Pebbble proves that privacy can be enforced by architecture. Vrooom demonstrates something else: a working system where the business model and the user's interest are structurally aligned — not by policy, not by promise, but by architecture. The parent goes to the website because they want to, not because they were nudged.\n\nThe companies that need this thinking are the ones starting to realize that the extraction model has a ceiling. Users leave. Regulation tightens. Brand trust erodes. The ones who figure out how to grow by giving more than they take will outlast the ones still optimizing click-through rates.\n\nA car in the hand. A playground around the corner. The phone already forgotten.\n"}]}}};

<script>
const store = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const packs = EngineLoad.fromFiles(FILES);
const engine = new EngineCore.Engine({ skills: packs.skills, talk: packs.talk, memory: store.get("ptilu.engine.me") || {},
  content: packs.docs.length ? new EngineContent.Content(packs.docs, packs.talk.small, packs.topics) : null,
  model: new NLURuntime.NLU(MODEL) });
if (MEANING) engine.setMeaning(EngineContent.decodeMeaning(MEANING));
const taught = store.get("ptilu.engine.taught") || [];
for (const t of taught) EngineLearn.teach(engine, t.sentence, t.skill, t.marks);
const taughtQ = store.get("ptilu.engine.taughtQ") || [];
for (const t of taughtQ) { const r = EngineLearn.teachQuestion(engine, t.sentence, t.title, t.q); if (r.ok && t.vec) engine.addMeaning(r.key, Float32Array.from(t.vec)); }
for (const t of taught) if (t.vec) engine.addMeaning(`s|${t.skill}|taught`, Float32Array.from(t.vec));
const retrain = () => { engine.model = new NLURuntime.NLU(NLUTrainer.train(EngineTrain.examples(packs), { log: () => {} })); };
if (taught.length) retrain();

const $ = id => document.getElementById(id), log = $("log");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("ver").textContent = `engine · built ${BUILT}`;
const EXAMPLES = engine.examples();

// the bar at the bottom: what it can do, always the same
function chips(list) {
  $("chips").innerHTML = list.map((c, i) => `<button class="chip" type="button" data-i="${i}">${esc(c)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => send(list[+b.dataset.i])));
  $("chips").scrollLeft = 0;
}

function row(k, v, cls = "") { return `<div class="row ${cls}"><span>${k}</span><span>${v}</span></div>`; }
function renderAgent(el, r) {
  el.querySelector(".typing")?.remove();
  let t = row("outcome", esc(r.outcome), r.outcome === "abstain" ? "abstain" : "state") + row("why", esc(r.why || ""));
  if (r.values && Object.keys(r.values).length) t += row("values", esc(Object.entries(r.values).map(([k, v]) => `${k}: ${v}`).join(" · ")));
  if (r.command) t += row("exec", `$ ${esc(r.command)}<em>simulated</em>`, "exec");
  if (r.source) t += row("from", esc(r.source));
  const dot = r.outcome === "abstain" ? "skip" : r.outcome === "act" ? "" : "ask";
  const icon = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // what can follow this answer sits under it, in the conversation; the bar at the bottom keeps the skills
  const follow = r.chips && r.chips.length && !r.chips.every(c => EXAMPLES.includes(c)) ? r.chips : [];
  el.insertAdjacentHTML("beforeend", `<div class="reply">${esc(r.say)}${r.source ? `<span class="src">${esc(r.source)}</span>` : ""}</div>`
    + (follow.length ? `<div class="follow">${follow.map((c, i) => `<button class="chip" type="button" data-i="${i}">${esc(c)}</button>`).join("")}</div>` : "")
    + `<details class="why"><summary aria-label="Show what the engine did">${icon}<span class="dot ${dot}"></span>${esc(r.skill || (r.source ? "content" : r.outcome))}</summary><div class="trace">${t}</div></details>`);
  el.querySelectorAll(".follow .chip").forEach(b => b.addEventListener("click", () => send(follow[+b.dataset.i])));
  log.scrollTop = log.scrollHeight;
}
function renderUser(text, typing) {
  const el = document.createElement("section");
  el.className = "turn";
  el.innerHTML = `<div class="cmd">${esc(text)}</div>` + (typing ? `<div class="reply typing" aria-label="Typing"><span></span><span></span><span></span></div>` : "");
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// by meaning: the MiniLM worker, loaded the first time words find nothing (about 33 MB, then cached)
let worker = null, waiting = new Map(), nextId = 0;
function embed(text) {
  if (!worker) {
    worker = new Worker("meaning/worker.js");
    worker.onmessage = e => { const w = waiting.get(e.data.id); if (w) { waiting.delete(e.data.id); w(e.data); } };
  }
  return new Promise(res => { const id = ++nextId; waiting.set(id, res); worker.postMessage({ id, type: "embed", text }); });
}

// the engine answers in a millisecond; a short pause, longer for a longer reply, makes it a conversation
let busy = false;
function send(text, instant = false) {
  text = String(text).trim();
  if (!text || busy) return false;
  let r = engine.respond(text);
  store.set("ptilu.engine.me", engine.memory);
  updateCount();
  if (instant) { renderAgent(renderUser(text, false), r); return true; }
  busy = true;
  const el = renderUser(text, true);
  const t0 = Date.now();
  const show = r2 => {
    const pause = Math.max(0, 450 + Math.min(r2.say.length * 6, 450) + Math.random() * 250 - (Date.now() - t0));
    setTimeout(() => { renderAgent(el, r2); updateCount(); busy = false; }, pause);
  };
  if (r.outcome === "abstain" && r.meaning && MEANING) {
    const note = setTimeout(() => el.querySelector(".typing")?.setAttribute("title", "reading it by meaning"), 0);
    const first = !worker;
    if (first) el.insertAdjacentHTML("beforeend", `<div class="pending">reading it by meaning · loading the model once, about 33 MB</div>`);
    embed(text).then(out => {
      clearTimeout(note); el.querySelector(".pending")?.remove();
      const m = out.ok ? engine.byMeaning(text, out.vec) : null;
      show(m ? { ...m, why: `${m.why}${out.ms !== undefined ? ` · ${out.ms} ms` : ""}` } : r);
    });
    return true;
  }
  show(r);
  return true;
}
$("form").addEventListener("submit", e => { e.preventDefault(); if (send($("q").value)) $("q").value = ""; });
$("reset").addEventListener("click", () => { log.innerHTML = ""; engine.pending = null; engine.frame = null; chips(EXAMPLES); $("q").focus(); });

// the inbox: pick the skill a sentence meant, mark its values; it's learned at once and kept on this phone
function updateCount() { const n = engine.inbox.length; $("inboxCount").hidden = !n; $("inboxCount").textContent = n; }
$("inboxBtn").addEventListener("click", () => { $("sheet").hidden = false; drawInbox(); });
$("sheetClose").addEventListener("click", () => { $("sheet").hidden = true; updateCount(); });
// a taught sentence is remembered by meaning too: its vector points to the same answer, so sentences
// worded differently find it; the vector is kept on the phone with the sentence
function byMeaningToo(sentence, key, t, storeKey, list) {
  if (!MEANING || !key) return;
  embed(sentence).then(out => {
    if (!out.ok) return;
    engine.addMeaning(key, out.vec);
    t.vec = Array.from(out.vec, x => Math.round(x * 1e4) / 1e4);
    store.set(storeKey, list);
  });
}

function drawInbox() {
  const box = $("waiting"); box.innerHTML = "";
  if (!engine.inbox.length) box.innerHTML = `<div class="empty">Nothing waiting.</div>`;
  for (const item of engine.inbox) {
    const card = document.createElement("div"); card.className = "card";
    const near = item.near || (engine.content ? engine.content.nearest(item.sentence) : []);
    if (!item.near && MEANING) embed(item.sentence).then(out => { if (out.ok) { item.near = engine.questionsByMeaning(out.vec); drawInbox(); } });
    const groups = engine.content ? engine.content.questionsByFile : [];
    card.innerHTML = `<p class="said">${esc(item.sentence)}</p><p class="meta">${esc(item.why)}</p>`
      + (groups.length ? `<p class="meta">Is it one of these questions? Tap it: it will get the same answer.</p>`
        + `<div class="card-actions near">${near.map((x, i) => `<button class="btn" type="button" data-i="${i}">${esc(x.q)} <span class="dim">· ${esc(x.title)}</span></button>`).join("")}</div>`
        + `<div class="card-actions"><select class="anyq"><option value="">another question…</option>${groups.map(g => `<optgroup label="${esc(g.title)}">${g.questions.map(q => `<option value="${esc(g.title)}\u0000${esc(q)}">${esc(q)}</option>`).join("")}</optgroup>`).join("")}</select></div>` : "")
      + `<details><summary class="meta">or teach it to a skill</summary><div class="card-actions"><select class="skill"><option value="">teach it to…</option>${engine.skills.map(s => `<option value="${s.name}">${esc(s.label)}</option>`).join("")}</select></div><div class="slots card-actions"></div></details>`
      + `<div class="card-actions"><button class="btn quiet no" type="button">not for me</button></div><p class="meta msg"></p>`;
    const msg = card.querySelector(".msg");
    const asQuestion = (title, q) => {
      const r = EngineLearn.teachQuestion(engine, item.sentence, title, q);
      msg.textContent = r.ok ? `Learned. It now answers: "${r.say.slice(0, 90)}…"` : "Not learned: " + r.why;
      if (r.ok) {
        const t = { sentence: item.sentence, title, q }; taughtQ.push(t); store.set("ptilu.engine.taughtQ", taughtQ);
        byMeaningToo(item.sentence, r.key, t, "ptilu.engine.taughtQ", taughtQ);
        updateCount(); setTimeout(drawInbox, 1400);
      }
    };
    card.querySelectorAll(".near .btn").forEach(b => b.addEventListener("click", () => asQuestion(near[+b.dataset.i].title, near[+b.dataset.i].q)));
    card.querySelector(".anyq")?.addEventListener("change", e => { const [t, q] = e.target.value.split("\u0000"); if (q) asQuestion(t, q); });
    const sel = card.querySelector(".skill"), slots = card.querySelector(".slots");
    sel.addEventListener("change", () => {
      const sk = engine.byName.get(sel.value); slots.innerHTML = ""; if (!sk) return;
      for (const slot of Object.keys(sk.needs)) slots.insertAdjacentHTML("beforeend", `<input data-slot="${slot}" placeholder="${slot}: the words that are it">`);
      slots.insertAdjacentHTML("beforeend", `<button class="primary" type="button">Teach</button>`);
      slots.querySelector(".primary").addEventListener("click", () => {
        const marks = {};
        slots.querySelectorAll("input").forEach(i => { if (i.value.trim()) marks[i.dataset.slot] = i.value.trim(); });
        const r = EngineLearn.teach(engine, item.sentence, sel.value, marks);
        msg.textContent = r.ok ? "Learned: " + r.pattern : "Not learned: " + r.why;
        if (r.ok) {
          const t = { sentence: item.sentence, skill: sel.value, marks }; taught.push(t); store.set("ptilu.engine.taught", taught);
          byMeaningToo(item.sentence, r.key, t, "ptilu.engine.taught", taught);
          retrain(); updateCount(); setTimeout(drawInbox, 1200);
        }
      });
    });
    if (item.suggest) { card.querySelector("details").open = true; sel.value = item.suggest; sel.dispatchEvent(new Event("change")); }
    card.querySelector(".no").addEventListener("click", () => { engine.inbox.splice(engine.inbox.indexOf(item), 1); updateCount(); drawInbox(); });
    box.appendChild(card);
  }
  const lines = [...taughtQ.map(t => `${t.title} — "${t.sentence}" asks "${t.q}"`), ...taught.map(t => `${t.skill} — "${t.sentence}"`)];
  $("learned").textContent = lines.length ? lines.join("\n") + "\n\nKept on this phone. To keep them for everyone: add each under that question in the file's questions:, or under ## Learned in the skill." : "Nothing yet.";
}

chips(EXAMPLES);
send("what can you do", true);
const d = document.createElement("div"); d.className = "divider"; d.textContent = "your turn"; log.appendChild(d);
</script>
</body>
</html>
