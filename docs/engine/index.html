<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ptiLU engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

/* Layout: one-screen console. Header with model card, scrolling log of turns
   (command → trace → reply), composer pinned at the bottom with suggestion chips. */
:root {
  /* Single light theme by choice: yellow for the person, light grey for the agent. */
  --bg: #f7f7f4;
  --surface: #ffffff;
  --trace: #f1f1ed;
  --fg: #1d1d1b;
  --muted: #6b6a64;
  --line: #e2e1db;
  --user: #ffd84a;
  --user-ink: #1d1d1b;
  --agent: #ebebe7;
  --agent-ink: #1d1d1b;
  --accent: #2e5bd6;
  --exec: #1d6b4a;
  --warn: #9a5a00;
  --slot-name: #d9e4ff;
  --slot-location: #d6f0e2;
  --slot-file_type: #f6e3c8;
  --slot-app: #ecdcf7;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-ui); }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); max-width: 720px; margin: 0 auto; }

header { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
h1 span { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
button { font: inherit; color: inherit; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.ghost:focus-visible, .chip:focus-visible, .send:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
details { font-size: 13px; color: var(--muted); }
summary { cursor: pointer; font-family: var(--font-mono); font-size: 12px; list-style: none; }
summary::-webkit-details-marker { display: none; }
#about > summary::before { content: "▸ "; }
#about[open] > summary::before { content: "▾ "; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px 16px; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-family: var(--font-mono); font-weight: 500; color: var(--fg); font-size: 14px; }
.stats small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.note { margin: 8px 0 2px; max-width: 62ch; }

.log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.turn { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cmd { align-self: flex-end; max-width: 88%; background: var(--user); color: var(--user-ink); padding: 8px 12px; border-radius: 16px 16px 4px 16px; overflow-wrap: anywhere; }
.trace { background: var(--trace); border-radius: 8px; padding: 10px 12px; font: 12.5px/1.6 var(--font-mono); overflow-x: auto; min-width: 0; }
.row { display: grid; grid-template-columns: 4.5em 1fr; gap: 8px; }
.row > span:first-child { color: var(--muted); }
.row > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.conf { font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }
.tagged mark { color: var(--fg); border-radius: 3px; padding: 0 3px; }
.tagged mark sub { font-size: 9.5px; color: var(--muted); margin-left: 3px; vertical-align: baseline; }
mark.name { background: var(--slot-name); }
mark.location { background: var(--slot-location); }
mark.file_type { background: var(--slot-file_type); }
mark.app { background: var(--slot-app); }
.exec { color: var(--exec); }
.exec em { font-style: normal; font-size: 10.5px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; opacity: 0.8; }
.state { color: var(--fg); }
.abstain { color: var(--warn); }
.reply { align-self: flex-start; max-width: 88%; background: var(--agent); color: var(--agent-ink); padding: 8px 12px; border-radius: 16px 16px 16px 4px; overflow-wrap: anywhere; white-space: pre-line; }
.why { margin-top: -2px; padding-left: 4px; }
.typing { display: inline-flex; gap: 5px; align-items: center; padding: 13px 14px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: 0.55; }
@media (prefers-reduced-motion: no-preference) {
  .typing span { animation: hop 1s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
}
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-5px); opacity: 0.9; } }
.why > summary { display: inline-flex; align-items: center; gap: 6px; font: 11.5px var(--font-mono); color: var(--muted); cursor: pointer; padding: 4px 6px 4px 2px; border-radius: 6px; list-style: none; }
.why > summary::-webkit-details-marker { display: none; }
.why > summary::before { content: none; }
.why > summary svg { width: 14px; height: 14px; flex: none; transition: transform 0.15s ease; }
.why[open] > summary svg { transform: rotate(90deg); }
.why > summary .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--exec); flex: none; }
.why > summary .dot.ask { background: var(--accent); }
.why > summary .dot.skip { background: var(--warn); }
.why .trace { margin-top: 4px; }
.divider { text-align: center; font: 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 10px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.composer { min-width: 0; border-top: 1px solid var(--line); padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font: 12.5px var(--font-mono); color: var(--fg); cursor: pointer; white-space: nowrap; }
form { display: flex; gap: 8px; }
input { flex: 1; min-width: 0; font: 16px var(--font-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
input:focus { outline: 2px solid var(--fg); outline-offset: -1px; border-color: transparent; }
.send { background: var(--user); color: var(--user-ink); border: 0; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
.pending { font: 12px var(--font-mono); color: var(--warn); }
.reply.waiting { color: var(--muted); }
.retrain { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; }
.retrain button:disabled { opacity: 0.5; cursor: progress; }
.rlog { font: 12px var(--font-mono); color: var(--dim, #777); min-width: 0; overflow-wrap: anywhere; }

/* Inbox: a sheet over the console */
.actions { display: flex; gap: 6px; }
.count { display: inline-block; min-width: 1.5em; margin-left: 5px; padding: 0 5px; border-radius: 999px; background: var(--user); color: var(--user-ink); font: 500 11px/1.6 var(--font-mono); text-align: center; }
.sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); max-width: 720px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.sheet-body { overflow-y: auto; padding: 14px 16px 32px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.hint { margin: 0; font-size: 13px; color: var(--muted); max-width: 62ch; }
.empty { font-size: 13px; color: var(--muted); padding: 18px 0; text-align: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.said { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.meta { margin: 0; font: 11.5px var(--font-mono); color: var(--muted); }
.card-actions, .ed-buttons, .sheet-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font-size: 13px; cursor: pointer; }
.btn.primary, .primary { background: var(--fg); color: var(--bg); border-color: var(--fg); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn.quiet { color: var(--muted); }
.primary:disabled, .btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, .primary:focus-visible, .word:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.editor { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.editor label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.editor select, .editor input, .editor textarea { font: 14px var(--font-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.editor textarea { resize: vertical; font-size: 13px; }
.words { display: flex; flex-wrap: wrap; gap: 5px; }
.word { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 7px; font: 13.5px var(--font-ui); cursor: pointer; }
.word.sel { background: var(--user); border-color: var(--user); }
.word.marked { background: var(--slot-name); border-color: var(--slot-name); }
.word sub { font: 10px var(--font-mono); color: var(--accent); margin-left: 3px; }
.mark-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.preview { font: 12.5px var(--font-mono); background: var(--trace); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; }
.err { color: var(--warn); font-size: 12.5px; min-height: 1em; }
.learned h3 { margin: 6px 0 8px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.lrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.lrow span { min-width: 0; overflow-wrap: anywhere; }
.lrow em { font: normal 11.5px var(--font-mono); color: var(--muted); margin-left: 6px; }
.tag-new { color: var(--exec); }
.inboxed { font: 11.5px var(--font-mono); color: var(--muted); }
.send-inbox { margin-top: 8px; font-size: 12px; }
.notice { align-self: stretch; font-size: 13px; color: var(--warn); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
@media (prefers-reduced-motion: no-preference) { .turn { animation: rise 0.18s ease-out; } }
@keyframes rise { from { transform: translateY(4px); } to { transform: none; } }

/* the engine's own additions */
.reply .src { display: block; margin-top: 6px; font: 11.5px var(--font-mono); color: var(--muted); }
.turn .follow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.turn .follow .chip { white-space: normal; text-align: left; }
.sheet[hidden], .count[hidden] { display: none; }
.card select { max-width: 100%; }
.card select, .card input { font: 14px var(--font-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <h1>ptiLU<span id="ver"></span></h1>
      <div class="actions">
        <button class="ghost" id="inboxBtn" type="button">Inbox<span class="count" id="inboxCount" hidden></span></button>
        <button class="ghost" id="reset" type="button">Clear</button>
      </div>
    </div>
  </header>
  <main class="log" id="log" aria-live="polite"></main>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="q" type="text" enterkeyhint="send" autocapitalize="none" spellcheck="false" placeholder="Ask or tell me something" aria-label="Ask or tell me something">
      <button class="send" type="submit">Send</button>
    </form>
  </div>
</div>

<section class="sheet" id="sheet" hidden aria-label="Inbox">
  <div class="sheet-head"><h2>Inbox</h2><button class="ghost" id="sheetClose" type="button">Close</button></div>
  <div class="sheet-body">
    <p class="hint">What I couldn't answer or do. Tap the question it means and it gets the same answer from now on, or teach it to a skill. I learn it at once; it stays on this phone.</p>
    <div id="waiting"></div>
    <div class="learned"><h3>Taught on this phone</h3><pre class="rlog" id="learned"></pre></div>
  </div>
</section>

<script>
// Dependency-free NLU runtime. Mirrors nlu/features.py + nlu/runtime.py exactly.
const NLURuntime = (() => {
  const TOKEN_RE = /[A-Za-z0-9_](?:[A-Za-z0-9_.\-]*[A-Za-z0-9_])?|[^\sA-Za-z0-9_]/g;
  const WORD_RE = /^[A-Za-z0-9_]/;
  const ALNUM = /^[A-Za-z0-9]/;
  const EXT_RE = /[a-z0-9_]\.[a-z0-9]{1,5}$/;
  const QUOTES = new Set(["'", '"', "‘", "’", "“", "”", "`"]);

  function tokenize(text) {
    const out = [];
    for (const m of text.matchAll(TOKEN_RE)) out.push([m[0], m.index, m.index + m[0].length]);
    return out;
  }

  function intentFeatures(text) {
    const toks = tokenize(text).map(t => t[0]).filter(t => WORD_RE.test(t)).map(t => t.toLowerCase());
    const feats = [];
    let prev = "<s>";
    for (const t of toks) {
      feats.push("w:" + t, "b:" + prev + "_" + t);
      const p = "<" + t + ">";
      for (const n of [3, 4]) for (let i = 0; i + n <= p.length; i++) feats.push("c:" + p.slice(i, i + n));
      prev = t;
    }
    feats.push("b:" + prev + "_</s>");
    return feats;
  }

  function shape(tok) {
    let out = "";
    for (const ch of tok) {
      const c = ch >= "A" && ch <= "Z" ? "X" : ch >= "a" && ch <= "z" ? "x" : ch >= "0" && ch <= "9" ? "d" : ch;
      if (out[out.length - 1] !== c) out += c;
    }
    return out;
  }

  function quoteMask(text, toks) {
    let inside = false;
    return toks.map(([tok, s, e]) => {
      if (QUOTES.has(tok)) {
        const before = s > 0 ? text[s - 1] : " ";
        const after = e < text.length ? text[e] : " ";
        if (!(ALNUM.test(before) && ALNUM.test(after))) { inside = !inside; return false; }
      }
      return inside;
    });
  }

  function tokenFeatures(text, toks) {
    const low = toks.map(t => t[0].toLowerCase());
    const q = quoteMask(text, toks);
    const n = low.length;
    const at = i => (i < 0 ? "BOS" : i >= n ? "EOS" : low[i]);
    return low.map((w, i) => {
      const f = ["bias", "w=" + w, "s3=" + w.slice(-3), "sh=" + shape(toks[i][0]),
        "w-1=" + at(i - 1), "w-2=" + at(i - 2), "w+1=" + at(i + 1), "w+2=" + at(i + 2),
        "w-1|w=" + at(i - 1) + "|" + w, "w|w+1=" + w + "|" + at(i + 1)];
      if (EXT_RE.test(w)) f.push("ext");
      if (q[i]) f.push("inq");
      return f;
    });
  }

  function f32(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Float32Array(bytes.buffer);
  }

  // format 2: only the kept weights, 1 byte each. Per feature: count, then (intent, value) pairs.
  function unpack(m, nf) {
    const bin = atob(m.weights), K = m.intents.length, coef = new Float32Array(K * nf);
    let o = 0;
    for (let j = 0; j < nf; j++) {
      const n = bin.charCodeAt(o++);
      for (let q = 0; q < n; q++) {
        const k = bin.charCodeAt(o++), v = bin.charCodeAt(o++);
        coef[k * nf + j] = (v > 127 ? v - 256 : v) * m.scale;
      }
    }
    return coef;
  }

  function spansFromLabels(text, toks, labels) {
    const out = [];
    let cur = null;
    toks.forEach(([, s, e], i) => {
      const lab = labels[i];
      if (lab.startsWith("B-") || (lab.startsWith("I-") && (!cur || cur[2] !== lab.slice(2)))) {
        if (cur) out.push(cur);
        cur = [s, e, lab.slice(2)];
      } else if (lab.startsWith("I-") && cur) cur[1] = e;
      else { if (cur) out.push(cur); cur = null; }
    });
    if (cur) out.push(cur);
    return out.map(([s, e, n]) => ({ name: n, value: text.slice(s, e) }));
  }

  class NLU {
    constructor(m) {
      this.m = m;
      this.vocab = new Map(m.vocab.map((f, i) => [f, i]));
      this.idf = f32(m.idf);
      this.nf = m.vocab.length;
      this.coef = m.format === 2 ? unpack(m, this.nf) : f32(m.coef);
      this.L = m.labels.length;
    }
    classify(text) {
      const counts = new Map();
      for (const f of intentFeatures(text)) {
        const j = this.vocab.get(f);
        if (j !== undefined) counts.set(j, (counts.get(j) || 0) + 1);
      }
      const vec = [];
      let norm = 0;
      for (const [j, c] of counts) { const v = (1 + Math.log(c)) * this.idf[j]; vec.push([j, v]); norm += v * v; }
      norm = Math.sqrt(norm) || 1;
      const scores = this.m.intents.map((_, k) => {
        let s = this.m.intercept[k];
        const base = k * this.nf;
        for (const [j, v] of vec) s += this.coef[base + j] * v / norm;
        return s;
      });
      const mx = Math.max(...scores);
      const ex = scores.map(s => Math.exp(s - mx));
      const sum = ex.reduce((a, b) => a + b, 0);
      return ex.map((e, i) => [this.m.intents[i], e / sum]).sort((a, b) => b[1] - a[1]);
    }
    tag(text, toks) {
      const L = this.L, st = this.m.state, tr = this.m.trans;
      const em = tokenFeatures(text, toks).map(feats => {
        const row = new Array(L).fill(0);
        for (const f of feats) {
          const w = st[f];
          if (w) for (let q = 0; q < w.length; q += 2) row[w[q]] += w[q + 1];
        }
        return row;
      });
      if (!em.length) return [];
      let score = em[0].slice();
      const back = [];
      for (let t = 1; t < em.length; t++) {
        const nw = new Array(L), bp = new Array(L);
        for (let b = 0; b < L; b++) {
          let best = -1e18, arg = 0;
          for (let a = 0; a < L; a++) { const v = score[a] + tr[a][b]; if (v > best) { best = v; arg = a; } }
          nw[b] = best + em[t][b]; bp[b] = arg;
        }
        score = nw; back.push(bp);
      }
      let last = 0;
      for (let i = 1; i < L; i++) if (score[i] > score[last]) last = i;
      const path = [last];
      for (let i = back.length - 1; i >= 0; i--) path.push(back[i][path[path.length - 1]]);
      return path.reverse().map(i => this.m.labels[i]);
    }
    parse(text) {
      const t0 = performance.now();
      const ranked = this.classify(text);
      const toks = tokenize(text);
      const labels = this.tag(text, toks);
      const slots = {};
      for (const { name, value } of spansFromLabels(text, toks, labels)) if (!(name in slots)) slots[name] = value;
      return { intent: ranked[0][0], confidence: ranked[0][1], ranking: ranked.slice(0, 3),
        slots, labels, ms: performance.now() - t0 };
    }
  }
  return { NLU, tokenize, intentFeatures, tokenFeatures };
})();
if (typeof module !== "undefined") module.exports = NLURuntime;

// Rule-based date / time / duration / recurrence entities. No model, no dependencies.
// Shared by every skill that needs time: reminders, timers, calendar, "what day is ...".
// Usage: NLUEntities.parse("remind me next friday at 3pm", { now: new Date() })
// Every result carries `ambiguous` + `alternatives` so the dialogue can ask instead of guessing.

const NLUEntities = (() => {
  // ---------- numbers ----------
  const SMALL_N = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
    eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
  const TENS_N = { twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60 };
  const SMALL = "thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve";
  const NUM = `(?:\\d+(?:[.,]\\d+)?|(?:twenty|thirty|forty|fifty|sixty)(?:[\\s-](?:one|two|three|four|five|six|seven|eight|nine))?|a\\s+couple\\s+of|couple\\s+of|a\\s+couple|a\\s+few|few|several|${SMALL}|an?)`;
  const HOURW = "one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve";

const FILES = {"conversation.md":"# Conversation\n\nWhat every pack shares: how people say yes and no, the words that carry no request, and what the\nengine says in its own name. One line can hold several words, separated by commas.\n\n## Yes\n- yes, yeah, yep, yup, sure, ok, okay, go ahead, do it, please do, correct, right, exactly, of course\n\n## No\n- no, nope, nah, cancel, don't, do not, never mind, not now, stop, wrong\n\n## Fillers\nTaken off the start or the end of a sentence, never from the middle.\n- please, can you, could you, would you, will you, can you please, could you please, i want you to\n- i'd like you to, just, quickly, for me, now please, so, ok so\n\n## Small words\nWords that say nothing about which skill is meant: the taught-words check doesn't count them.\n- the, a, an, to, me, my, i, i'm, it, it's, is, are, be, of, for, in, on, at, and, or, this, that\n- you, your, can, could, would, will, please, now, just, some, any, do, does, did, what, what's\n- with, from, about, there, here, up, so, then, also, us, we, our, mine, again, one, by, as\n- which, who, whom, whose, how, why, when, where, much, many, should, must, may, might, shall, was, were, been\n- have, has, had, he, she, his, her, they, them, their, these, those, if, but, not, very, too, more, most, than\n- tell, explain, describe, know, think, want, like, need, said, say\n\n## Follow-up\nA sentence starting with these may complete the request before it.\n- and, and what about, what about, how about, and for, same for, also, and also, then\n\n## More\n- more, tell me more, go on, continue, and then, what else, keep going, anything else, more please\n\n## Question words\nA sentence starting with one of these is a question, and may be answered from the content.\n- what, what's, who, who's, why, how, when, where, which, is, are, does, do, did, tell, explain, describe\n\n## Command words\nA sentence starting with one of these is a command, never a problem told to the content.\n- create, make, move, open, delete, remove, rename, copy, set, start, stop, turn, play, show, send, put\n- close, launch, run, install, download, find, list, add, change, go, take, give, call, write, read\n\n## Chips\n- yes\n- no\n\n## Replies\n- cant: I can't do that yet. | That's not something I can do yet.\n- not sure: Do you want me to {label}?\n- unknown word: I don't know {word} yet. Do you want me to {label}?\n- ok no: OK, I won't. | Alright, never mind.\n- which one: {a}, or {b}?\n- do you mean: I'm not sure I have that. Do you mean one of these?\n- nothing written: I don't have anything written about that. | Nothing I've been given covers that.\n- no more: That's all I have written about {title}.\n- me name: You're {value}.\n- me place: You live in {value}.\n","packs":{"about":{"pack.md":"---\nname: about\nkind: content\nabout: ptiLU itself\nfiles:\n- README.md\n---\n# About ptiLU\n\nQuestions about ptiLU itself, answered from its README and a short page about it. The engine's working\nnotes (ENGINE.md, the reviews) stay out: they quote test sentences word for word, and would answer them. Any Markdown file can be listed here; headings make the sections.\n\n## Also said\nHow people ask about content, for the model to tell a question from a command.\n- what is it\n- tell me about it\n- how does it work\n- why did you build it\n- who made this\n- what went wrong\n- explain the engine\n- what does it mean\n- what is designing by abstention\n- how do you measure it\n","skills":{},"docs":[{"id":"readme","md":"# ptiLU\n\n**ptiLU** (*p'tit LU*): **P**rivate, **T**eachable, **I**nterpretable **L**anguage **U**nderstanding.\nA model of about 350 KB that understands short commands on the device, offline, and says\n\"I can't\" rather than guessing. Formerly MiniOS NLU.\n\nThe first ptiLU is a tiny, CPU-only natural language understanding model for a mini operating system running on an Orange Pi Zero 2W (Armbian). It understands an English command, picks the intent, extracts the parameters, and a small dialogue manager decides what to do and what to answer.\n\nInspired by Snips NLU: no deep learning, no network, deterministic at runtime.\n\n## Why this exists\n\nAssistants today usually sit on a large language model, a cloud connection, or both. For a\nsmall device that should do a handful of things well (make a folder, set a reminder, tell the\ntime) that is far more than needed, and it comes with the wrong trade-offs: heavy, opaque,\nonline, and confidently wrong when it hasn't understood.\n\nThis project tries the opposite: small, single-purpose \"mini-brains\" that run on the CPU of a\ncheap single-board computer, or offline in a phone's browser. It started as a way to replace a\nMiniLM sentence-embedding model with something lighter that needs no retraining from scratch\neach time a capability is added.\n\nWhat it aims for:\n\n- **Small and local.** The model is about 350 KB and trains in about a minute, on a laptop or on\n  the phone itself.\n- **Designed by abstention.** What it leaves out is part of the design: no cloud, no large\n  model, no generated text, no account, nothing collected beyond what a skill declares it\n  sends (the weather skill sends a place name). And it abstains at run time too: below its confidence threshold it says it can't,\n  before changing anything it asks when unsure, and what it didn't understand waits in an\n  inbox to be taught, never guessed. A confident wrong action is worse than \"I can't do that\".\n- **Readable without machine-learning knowledge.** What a skill understands, asks and answers\n  is written in a Markdown file. Adding a skill means writing a file, not changing the engine.\n- **Teachable by the person using it.** In that inbox, on the phone, a sentence can be added to\n  a skill, become a new skill with its own answer, or be refused; the model retrains right there.\n- **Toward permacomputing.** Plain JavaScript and Python with no frameworks or dependencies, a\n  model of about 350 KB, plain-text skill files: it should keep running offline on modest or\n  old hardware for years and stay readable by whoever inherits it. (Training and the demo\n  still rely on a modern browser and GitHub Pages.)\n\nWhat it is not: a general conversational assistant. It recognises the words its skills were\ntaught, not meaning. \"Is precipitation likely tomorrow?\" fails until a weather example uses\n\"precipitation\"; open questions are refused.\n\n## How it works\n\n- **Intent:** TF-IDF features (words, word pairs, character 3–4-grams) and a logistic regression.\n- **Slots:** a linear-chain CRF tagger (BIO labels).\n- **Training:** plain JavaScript, no dependencies (`web/trainer.js`). The same file trains in Node (`node train.js`) and in the browser, so the PWA can retrain itself on the phone. Weak weights are dropped and the rest stored as 1-byte numbers: 358 KB for 22 skills.\n- **Skills as folders:** every skill is `skills/<name>/`: a `skill.md` in plain Markdown and, only where needed, a short `skill.js`. The `skill.md` holds the example sentences, the values the skill takes and their types (`## Slots`: text, place, date or time, duration, a value from a list), the questions to ask when one is missing or wrong, what it says, the API request it makes, and whether it changes something (`acts: yes`) or needs the network (`uses: network`). The examples are also the training data: `node skills.js` turns them into sentences and checks every file, stopping with the file and the reason when something doesn't add up. `web/agent.js` is the dialogue only and knows no skill by name; `web/services.js` holds what skills share (dates in words, folders, network, memory). See `skills/README.md`.\n- **Real APIs:** weather and the time in other places come from Open-Meteo (free, no key). Only the place name and its coordinates are sent; your name and place are stored on the device only.\n- **Inbox:** every sentence the agent can't handle lands in an inbox on the device (plus any reply you flag as wrong). For each one: add it to an existing skill (tap words, then pick which of the skill's declared values they are), make a new skill from it with the answer it should give, or mark it \"not for me\". Retrain on the phone, keep the trained model across reloads, and export what was taught: training lines for existing skills, and a draft `skills/<name>/skill.md` for each new skill, ready to commit.\n- **Runtime:** the model runs in plain JavaScript (`web/runtime.js`) and in dependency-free Python (`nlu/`), both reading the same `model.json`; `python evaluate.py` checks the Python side. The dialogue, the date parser and the skills run in JavaScript only for now. How the Pi will run them (a Python port, or one JavaScript brain with the Pi executing declared commands) is still open: see `HANDOFF.md`.\n- **Dates, times, durations:** a rule-based parser (`web/entities.js`), not part of the model. It reads \"next friday at 3pm\", \"in 2 days\", \"next year\", \"timer 1h30\", \"every weekday at 8\" and flags what is ambiguous (\"next friday\" on a Monday, \"at 9\", \"3/4\") or already past, so the agent asks instead of guessing. Every skill that needs time shares it; adding one needs no retraining of this layer.\n- **Dialogue:** asks for missing or invalid values with the skill's own questions, confirms risky actions (power), asks \"Do you want me to…?\" when unsure before anything that changes something, offers a choice when a date or time is ambiguous (\"20:00 today, or 08:00 tomorrow?\"), says it needs the network when a skill does, abstains below a confidence threshold, and finds list values named anywhere in the sentence (\"it's too loud\", \"rebot the pi\") when the model didn't mark them.\n\nTry it: the `docs/` folder is a Progressive Web App that runs the model fully offline. Commands are simulated: the trace shows the shell command that would run on the device.\n\n## Skills\n\nThe values each skill takes, as declared in its `skill.md`. Dates, times and durations are read\nby the date parser, not marked by the model.\n\n| skill | values | changes something |\n|---|---|---|\n| `create_folder` | name, location | yes |\n| `create_file` | name, file_type, location | yes |\n| `open_file` | name, location | yes |\n| `open_app` | app (from a list) | yes |\n| `adjust_volume`, `adjust_brightness` | direction (from a list), level | yes |\n| `power` | power_action (from a list) | confirms every time |\n| `system_status` | metric | no |\n| `get_time` | place | no |\n| `get_date` | day (date) | no |\n| `get_weather` | place (home by default), day (date); needs the network | no |\n| `set_timer` | duration | yes |\n| `set_reminder` | task, when (date and time) | yes |\n| `remember_me` | name, place | yes |\n| `recall_me` | none | no |\n| `forget_me` | none | yes |\n| `greet`, `thanks`, `help` | none | no |\n| `affirm`, `deny`, `out_of_scope` | none (the dialogue's yes, no and \"I can't\") | no |\n\n## Layout\n\n```\ndata/\n  synth_*.md            externally generated batches, cleaned\n  synth_moved.md        time requests that were labelled out_of_scope before the time skills\n  test.md               handwritten held-out set\n  skills.md             generated from skills/ (don't edit)\nnlu/\n  features.py           tokenizer and features (mirrored in web/runtime.js)\n  dataset.py            annotated Markdown parser\n  runtime.py            dependency-free inference (the Pi side)\nskills/                 one folder per skill: skill.md + optional skill.js (see skills/README.md)\nweb/\n  runtime.js            JS inference, same model.json\n  trainer.js            JS training: TF-IDF + logistic regression (L-BFGS), CRF, pruning, export\n  inbox.js              inbox storage, triage decisions, Markdown export (on the device)\n  entities.js           rule-based dates, times, durations, recurrences\n  agent.js              dialogue: routes to skills, questions, confirmations, choices, sequences\n  services.js           shared services for skills: dates in words, folders, network, memory\n  template.html         the page; build_web.py fills in model, code and data\npwa/                    PWA assets (manifest, icons, service worker template)\ndocs/                   built PWA, served by GitHub Pages\nmodels/model.json       exported model (with its held-out scores)\ntests/                  recorded API answers, expected dialogue transcript\n```\n\n## Data format\n\n```\n## intent: create_folder\n- make a folder called [reports](name) in [documents](location)\n```\n\n## Commands\n\n```\nnode train.js                    # compile the skills, train the shipped model, print held-out scores\npython build_web.py              # build the PWA in docs/ (standard library only)\nTZ=Europe/Berlin node test_entities.js   # date/time parser against fixed phrases\nTZ=Europe/Berlin node test_dialogue.js   # replay scripted conversations; fails if a reply changed\n                                         # (--update accepts the new replies, -v prints them)\npython evaluate.py               # the Python runtime (Pi side) against the test set\n```\n\nTraining takes about a minute on a laptop, in Node or in the browser (training files are listed in `data/manifest.json`). Inference runs in well under a millisecond per sentence.\n\nHeld-out, on the 144 handwritten test sentences that appear in no training file: intent accuracy 97.2%, slot F1 0.96.\n\nThe scikit-learn reference trainer, the dataset cleaning and cross-validation scripts and the raw generated batches were removed on 13 October 2026; they are in the git history before that date.\n"},{"id":"ptilu","md":"---\ntitle: ptiLU\nquestions:\n- what is ptilu\n- what does ptilu mean\n- what is this\n- who are you\n- what does the name mean\nanswer: ptiLU (p'tit LU) stands for Private, Teachable, Interpretable Language Understanding: a small model that understands short commands on the device, offline, and says \"I can't\" rather than guessing.\nnext: engine\n---\n# ptiLU\n\nptiLU (p'tit LU) stands for Private, Teachable, Interpretable Language Understanding. It understands\nshort requests on the device, offline, and says \"I can't\" rather than guessing.\n\n## Why it is small\nAssistants usually sit on a large language model, a cloud connection, or both. For a small device that\nshould do a handful of things well, that is far more than needed: heavy, opaque, online, and confidently\nwrong when it hasn't understood. ptiLU tries the opposite: small, single-purpose minds that run on the CPU\nof a cheap board, or offline in a phone's browser.\n\n## How you teach it\nWhat it didn't understand waits in an inbox. There, a sentence can be added to a skill, become a new skill\nwith its own answer, or be refused. A taught sentence becomes a pattern with placeholders, written in the\nskill's own file, and works at once.\n"}]},"abstention":{"pack.md":"---\nname: abstention\nkind: content\nabout: designing by abstention (Gab's talk at Pforzheim)\n---\n# Designing by Abstention\n\nGab's text from the talk at the School of Design, Hochschule Pforzheim (11 November 2026), as adapted\nfor his article draft of 12 November. Answers are his sentences, word for word.\n\n## Also said\n- what is abstention\n- why should AI hold back\n- will AI replace designers\n- how do you use AI responsibly\n","skills":{},"docs":[{"id":"designing-by-abstention","md":"---\ntitle: Designing by Abstention\nanswer: Knowing what to hold back, at every step, so that AI empowers people rather than replaces them. Not a plain no, nor a plain yes. A \"but\" you can explain, and stand by.\nkeywords: [abstention, abstain, hold back, designing by abstention, method, talk, pforzheim]\nquestions:\n  - q: What is designing by abstention?\n    see: This is a method I'd practised for years without noticing\n  - q: Where does the word abstention come from?\n    see: Borrowed from the Latin abs\n  - q: Is abstention just saying no to AI?\n    see: In design, abstention is a decision, not a reflex.\n  - q: How does abstention work in practice?\n    see: Abstention is where we judge what could happen\n  - q: What does \"but\" mean in abstention?\n    see: Abstention is the third path.\n  - q: Do I need to master AI to abstain?\n    see: Abstention takes mastery\n  - q: Is knowing the technology enough?\n    see: But knowing the technology isn't enough.\n  - q: Will AI take designers' jobs?\n    see: So if you measure your worth as a designer\n  - q: How should designers use AI?\n    see: But if you treat AI not as a mere generator\n  - q: Why does this give designers more responsibility?\n    see: Let me go further.\n  - q: Are the fears about AI real?\n    see: These fears are real.\n  - q: What was Senz?\n    see: The goal was radical\n  - q: What did you learn from Senz?\n    see: What we learned along the way\n  - q: Who wrote this talk?\n    see: I have been a designer for more than twenty years\n  - q: What is a \"yes, but\"?\n    see: The plain yes was easy\n  - q: How did Dowgo use AI without inventing answers?\n    see: So, yes to AI\n  - q: What is a \"no, but\"?\n    see: Vrooom is a no, but.\n  - q: Is there AI inside Vrooom?\n    see: There is no AI inside Vrooom.\n  - q: How do you frame a problem that is too big?\n    see: Some problems are too big to be framed.\n  - q: What is Babiban?\n    see: Babiban answers it with perhaps the most dangerous part\n  - q: How does Babiban avoid inventing what it says?\n    see: Babiban is a yes, but.\n  - q: Where should I start tomorrow?\n    see: Fall in love with a problem.\n  - q: Why does doubt matter?\n    see: When you start doubting, you start creating.\n  - q: How do I keep my own judgement with AI?\n    see: So stay curious.\n  - q: How can we shape a more humane future with AI?\n    see: So how can we shape a more humane future\n---\n# Designing by Abstention\n\n*On knowing what AI should hold back, and why that is our job now. Adapted from a talk given at the School of Design, Hochschule Pforzheim, on 11 November 2026.*\n\nAlmost nine years ago, I set out to tackle what felt like the most challenging design project of my career.\n\nThe goal was radical: make building and testing an idea accessible to anyone, not only to those with a full product team behind them. We called it Senz.\n\nWe trained a first AI, a vision model that translated wireframes and whiteboard diagrams into working, testable applications, just from a simple photo taken with a phone.\n\nOur reality check: one expert, drawing on a whiteboard, turned a new insurance concept into a working application inside Allianz's design system, with real data and pricing.\n\nFrom that day on, my team and I spent four years turning that proof of concept into a reliable assistive design tool: a business logic engine, white-label design systems, and user research with AI-generated insight reports.\n\nWhat we learned along the way was not what to add, but what our AI should abstain from. That's what let it empower humans, rather than replace them.\n\nI have been a designer for more than twenty years, across three continents. But before everything, I'm a father. A maker. A thinker. A human, with the same concerns as yours. I'm writing this as all four.\n\n## A tool, not a verdict\n\nThose concerns often go by one name today: AI. Job disruption, disinformation, the flattening of critical thinking, the averaging of culture. These fears are real. But they come from one corner of AI, not the whole field. Whatever doomers or techno-optimists say, it's still a tool. An impressive one, but a tool.\n\nA tool that promises to make the cost of production drop close to zero.\n\nSo if you measure your worth as a designer by the number of screens or renderings you hand off, you will feel threatened.\n\nBut if you treat AI not as a mere generator, but as a way to feed your curiosity, learn new skills, and explore new territories, it doesn't take your job. It becomes a compass, pointing to problems worth solving.\n\nLet me go further. If AI makes production effortless and puts building within our reach, the human problems that were never profitable enough no longer wait for someone else's budget. By committing to solving them with AI, we learn how this technology works, and that knowledge gives us the authority to steer what it should become for our society. That's how our profession regains its influence, and with it, its responsibility.\n\n## Holding something away, on purpose\n\nAnd taking that responsibility often starts with knowing what to hold back. This is a method I'd practised for years without noticing, until I named it: designing by abstention. Borrowed from the Latin *abs*, away, and *tenere*, to hold: holding something away, on purpose.\n\nIn design, abstention is a decision, not a reflex. It is not a shortcut to the easiest answer. It is not a plain no, refusing out of fear or ignorance. Nor is it a plain yes, taking everything for granted.\n\nAbstention is where we judge what could happen, and act on it, at every step. First, judging whether you need AI at all. Then, knowing its limits when you author with it. And most importantly, preventing its side effects when you build it into what you make. Abstention is the third path. \"But\" is the modulator. It works both ways: you can accept with a condition, or refuse with an alternative.\n\nAbstention takes mastery: you cannot decide where AI should step back unless you know how it operates. When you master your craft, you can delegate, because you can judge what comes back. When you don't, you're offloading, and everything it returns becomes, if you're honest, a new doubt to resolve. Done with care, that checking is how you grow.\n\nBut knowing the technology isn't enough. You also need an ethical grounding, to know why it matters, and the critical thinking to evaluate where it builds human value, and where it strips human agency away. That's what abstention is: a position you earn, through experience and learning. One that lets you explain why you hold back, and stand by it.\n\n## Three \"buts\"\n\n### Accept, with a condition\n\nWhat businesses fear losing is retention, satisfaction, adoption. Dowgo's CTO asked me to simplify their data room: buttons were everywhere. But the interface wasn't the problem. Most of those buttons existed only because files arrived unsorted.\n\nThe plain yes was easy: plug in an LLM and let it sort. But in due diligence, a document is there and right, or it isn't. There is no room for an answer someone invented. So, yes to AI: a small language-understanding model that reads file names, their context and their language. But it generates nothing, and what it doesn't recognise is never guessed: it goes to a person.\n\nFounders drop their files, and the files land in the right folders. I didn't remove buttons. I removed the reasons for them.\n\n### Refuse, with an alternative\n\nWhat families fear is losing their data, and their kids hooked on screens. Vrooom is a hand-planed wooden car that helps children discover the playgrounds around them.\n\nThe plain yes is what most products do: an account, a profile, points and streaks to keep the child coming back. The plain no is a toy, and nothing else. Vrooom is a no, but. No account, but the car is the child's identity. No data stored online, but everything stays on the phone. No streaks, but badges you print, colour and glue into a passport.\n\nThere is no AI inside Vrooom. But it was authored with AI: it helped me break down the complexity of not signing a user in. To recognise the child, I didn't need to know who he is.\n\n### When the stakes are highest\n\nSome problems are too big to be framed. Maybe they aren't problems at all, just the rough path of life. You can't solve them. So you frame a problem by cutting a small window into what you believe could be solved.\n\nMy daughters live 13,000 km away. Through that window, I fell in love with one problem: how can I stay present in their days? Not in every moment. In the rituals we had together: in the morning, in the evening, and during the day.\n\nBabiban answers it with perhaps the most dangerous part of generative AI: voice cloning. A device that talks with my voice, in Mandarin, a language I don't speak well. The plain no: voice cloning is dangerous, leave it alone. The plain yes: plug in a chatbot, and let a machine improvise as their father.\n\nBabiban is a yes, but. Yes to the voice. No to the invention. It understands what they ask, then answers only with lines I wrote myself. It runs offline, so nothing they say leaves the device. And when they ask something I never wrote an answer for, it doesn't pretend.\n\nEverything it says, I can stand behind.\n\n## Where to start tomorrow\n\n**Fall in love with a problem.** A real human problem, one you're happy to wake up for in the morning, or one that keeps you awake at night. And keep track of every decision you make along the way. This is where AI earns its place: you fall in love with the problem, it keeps the record. Every move, every choice, in plain text you can revisit one day.\n\n**Doubt.** When you start doubting, you start creating. And this is where AI is useful: it can harvest hundreds of sources and condense them for you. Done right, it hands you every link, so you can check each one yourself. That's how you move from doubt to beyond reasonable doubt.\n\n**To say \"but\", you need something to oppose.** So stay curious. Look for the ideas you disagree with, and the fields you know nothing about. Every idea is a thesis waiting for its antithesis. What you make of the two, the synthesis, is yours alone: it's your uniqueness. AI can bring you the antithesis in seconds, from anywhere. Only you can make the synthesis.\n\nSo how can we shape a more humane future with a technology that could threaten our humanity? My answer is abstention. Knowing what to hold back, at every step, so that AI empowers people rather than replaces them. Not a plain no, nor a plain yes. A \"but\" you can explain, and stand by.\n"}]},"everyday":{"pack.md":"---\nname: everyday\nkind: skills\n---\n# Everyday\n\nWhat a phone or a small board can do alone, offline: the time and the date, timers and reminders, and\nwhat you tell it about yourself. Nothing here needs an account or the network.\n","skills":{"check-date":{"skill.md":"---\ndoes: check date\nlabel: tell the date\n---\nToday's date on this device.\n\n## People say\n- what's the date (today)\n- what is the date (today)\n- what day is it (today)\n- what's today's date\n- what is today's date\n- what's today\n- which day is it (today)\n- (tell me) the date (please)\n- what's the day today\n\n## Also said\n- what day of the week is it\n- can you tell me the date\n- what's the date, I need it for a form\n- is it friday today\n- which date are we\n\n## Replies\n- done: Today is {@date}. | It's {@date}.\n","tests.md":"# Tests: check-date\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- what's the date today please\n- tell me today's date\n- what day are we\n- which day of the week is today\n- date please\n- do you know the date\n"},"check-time":{"skill.md":"---\ndoes: check time\nlabel: tell the time\n---\nThe time on this device.\n\n## People say\n- what time is it (now/please)\n- what's the time (now/please)\n- what is the time (now)\n- (tell me) the time (please)\n- time (please)\n- do you know what time it is\n- have you got the time\n\n## Also said\n- what's the time right now\n- could you tell me what time it is\n- what hour is it\n- is it late already\n- how late is it\n\n## Replies\n- done: It's {@time}. | {@time}.\n","tests.md":"# Tests: check-time\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- what time is it right now\n- tell me the current time\n- do you have the time\n- time check\n- what's the clock say\n- is it noon yet\n"},"forget-me":{"skill.md":"---\ndoes: forget me\nlabel: forget what it knows about you\napprove: yes\n---\nClears everything it keeps about you. Asks first, every time.\n\n## People say\n- forget (everything) (about) me\n- forget my name\n- forget where i live\n- forget (everything) (what) you know about me\n- delete (everything) (you know) about me\n- (please) forget everything\n\n## Also said\n- erase what you know about me\n- wipe my data\n- I want you to forget me\n\n## Does\nmemory.forget\n\n## Replies\n- approve: Forget everything I know about you?\n- done: Done, I've forgotten everything about you.\n- empty: I didn't know anything about you.\n","tests.md":"# Tests: forget-me\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- forget all about me\n- remove what you know about me\n- clear my details\n"},"greet":{"skill.md":"---\ndoes: greet\nlabel: say hello\nrole: talk\n---\n## People say\n- hi (there)\n- hello (there)\n- hey (there)\n- good morning/afternoon/evening\n- morning\n- hiya\n- yo\n\n## Also said\n- hello ptilu\n- hi, how are you\n- hey, good to see you\n\n## Replies\n- done: Hello! What can I do for you? | Hi. What do you need?\n","tests.md":"# Tests: greet\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- hello hello\n- good morning ptilu\n- hey hey\n"},"help":{"skill.md":"---\ndoes: help\nlabel: say what it can do\nrole: talk\n---\n## People say\n- help\n- what can you do\n- what do you do\n- how can you help (me)\n- what are you able to do\n- what can i ask (you)\n\n## Also said\n- what are your skills\n- show me what you can do\n- I'm lost, help me\n\n## Replies\n- done: I can {@skills}. And I can answer questions about {@content}.\n","tests.md":"# Tests: help\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- what are you good at\n- what can I say to you\n- help me please\n"},"recall-me":{"skill.md":"---\ndoes: recall me\nlabel: say what it knows about you\n---\nWhat it keeps about you, and nothing else.\n\n## People say\n- what's my name\n- what is my name\n- who am i\n- where do i live\n- what do you know about me\n- (do you) know my name\n- (do you) remember my name\n- what do you remember about me\n- tell me what you know about me\n\n## Also said\n- what have I told you about me\n- do you remember where I live\n- say my name\n\n## Does\nmemory.recall\n\n## Replies\n- done: {@me}\n- empty: I don't know anything about you yet. Tell me your name: \"call me …\".\n","tests.md":"# Tests: recall-me\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- do you know who I am\n- what did I tell you my name was\n- what do you have on me\n"},"remember-name":{"skill.md":"---\ndoes: remember name\nlabel: remember your name\nacts: yes\n---\nWhat to call you. Kept on this device only, with the sentence you said it in.\n\n## People say\n- (you can) call me {name}\n- my name is {name}\n- my name's {name}\n- i'm called {name}\n- (remember (that)) my name is {name}\n- (please) call me {name} from now on\n\n## Also said\n- I'd like you to call me Sam\n- the name is Eva\n- you can address me as Gab\n\n## What it needs\n- {name}: a name. If it's missing, ask: What should I call you?\n\n## Samples\n- name: Gab | Eva | Sam | Noor | Kenji\n\n## Does\nmemory.set name {name}\n\n## Replies\n- done: Nice to meet you, {name}. | OK, I'll call you {name}.\n- refused: I didn't catch your name.\n","tests.md":"# Tests: remember-name\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- call me Noor\n- my name is Kenji\n- you can call me Lou\n- from now on call me Gab\n"},"remember-place":{"skill.md":"---\ndoes: remember place\nlabel: remember where you live\nacts: yes\n---\nWhere home is. Kept on this device only, with the sentence you said it in.\n\n## People say\n- i live in {place}\n- (remember (that)) i live in {place}\n- my home is (in) {place}\n- home is {place}\n- i'm living in {place}\n- i've moved to {place}\n\n## Also said\n- I'm based in Munich\n- I stay in Lyon these days\n- my town is Kyoto\n\n## What it needs\n- {place}: a place. If it's missing, ask: Where do you live?\n\n## Samples\n- place: Munich | Paris | Kyoto | Lisbon | Shenzhen\n\n## Does\nmemory.set place {place}\n\n## Replies\n- done: OK, home is {place}. | Noted: you live in {place}.\n- refused: I didn't catch the place.\n","tests.md":"# Tests: remember-place\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- I live in Lisbon\n- I moved to Berlin\n- home is Shenzhen now\n"},"set-reminder":{"skill.md":"---\ndoes: set reminder\nlabel: set a reminder\nacts: yes\n---\nA reminder on this device, once. A day without a time is 9:00. When a time could be two (\"at 9\"),\nit asks which one.\n\n## People say\n- remind me (to) {task} {when}\n- remind me {when} to {task}\n- {when} remind me to {task}\n- remind me to {task}\n- remind me (about) {task} {when}\n- remind me about {task}\n- remind me {when}\n- (set/add/make/create) a reminder (to/for/about) {task} {when}\n- (set/add/make/create) a reminder (for/at/on) {when}\n- (set/add/make/create) a reminder (to/for/about) {task}\n- (set/add/make/create) a reminder\n- don't let me forget to {task} ({when})\n- (ping/nudge) me {when} (to/about) {task}\n\n## Also said\n- I need a reminder to water the plants tonight\n- make sure I don't forget to pay the rent\n- can you remind me later\n- remember to buy milk tomorrow\n- I keep forgetting to call the bank, remind me on monday\n\n## What it needs\n- {task}: some text. If it's missing, ask: What should I remind you of? | Remind you to do what?\n- {when}: a date and time. If it's missing, ask: When? | When should I remind you?\n\n## Samples\n- task: call mum | buy milk | water the plants | send the invoice | oil the cedar box | book the dentist\n\n## Does\nreminder.add {when} {task}\n\n## Replies\n- done: I'll remind you to {task} on {when}. | OK: {task}, {when}.\n","tests.md":"# Tests: set-reminder\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- remind me to call the bank tomorrow at 10\n- could you remind me to feed the cat tonight\n- set a reminder to print the tickets on friday\n- remind me next monday to pay the rent\n- don't let me forget to charge the camera\n- create a reminder\n"},"set-timer":{"skill.md":"---\ndoes: set timer\nlabel: set a timer\nacts: yes\n---\nA countdown on this device. It rings when the time is up.\n\n## People say\n- (set/start) (a/the) timer (for) {duration}\n- (set/start) (a/the) {duration} timer\n- timer (for) {duration}\n- {duration} timer\n- (set/start) (a/the) timer\n- countdown (of/for) {duration}\n- (set/start) (a) countdown (of/for) {duration}\n\n## Also said\n- wake me in twenty minutes\n- give me ten minutes\n- I need a timer\n- let me know when 5 minutes are up\n- time 3 minutes for the eggs\n- ring in an hour\n\n## What it needs\n- {duration}: a duration. If it's missing, ask: For how long? | How long should it run?\n\n## Does\ntimer.start {duration}\n\n## Replies\n- done: Timer set for {duration}. | OK, {duration} on the clock.\n","tests.md":"# Tests: set-timer\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- put a timer on for 25 minutes\n- start a ten minute countdown\n- timer twelve minutes\n- could you set a timer of 45 seconds\n- I need a 2 hour timer\n- set the timer\n"},"thanks":{"skill.md":"---\ndoes: thank\nlabel: say thanks\nrole: talk\n---\n## People say\n- thanks (a lot)\n- thank you (very much/so much)\n- cheers\n- (great/perfect/nice) thanks\n- (that's) perfect\n\n## Also said\n- much appreciated\n- thanks for that\n- that's great, thank you\n\n## Replies\n- done: You're welcome. | Anytime.\n","tests.md":"# Tests: thanks\n\nSentences people would say, never trained on. Written alongside the patterns, so not truly blind: add your own.\n\n- thanks a bunch\n- many thanks\n- thank you kindly\n"}},"docs":[],"out-of-scope.md":"# Out of scope\n\nWhat this pack should not try to do. Taught as \"I can't\", never as a skill.\n\n- book me a flight to Lisbon\n- what's the weather like\n- play some jazz\n- send an email to Eva\n- order a pizza\n- translate this into French\n- write me a poem\n- what's the capital of Peru\n- turn on the lights in the kitchen\n- call mum\n- how much is a bitcoin\n- delete all my files\n- tell me a joke\n- what's the news today\n- can you code a website\n- open the terminal\n- make a folder called bikes\n- show me the map of Munich\n- who won the match last night\n- buy milk\n"},"work":{"pack.md":"---\nname: work\nkind: content\nabout: Gab's work (Senz, Dowgo, AutoFlow, Pebbble, Vrooom)\n---\n# Work\n\nGab's work pages, copied as they are from my-agent (content/work), to try the engine on real content.\nTheir keywords, answers and questions are used when present; nothing was added for the engine.\n\n## Also said\n- how can my team test an idea before we commit a budget\n- my kids live abroad\n- can we use AI and still pass GDPR\n- our innovation lab is too slow\n","skills":{},"docs":[{"id":"autoflow","md":"---\ntitle: AutoFlow\ntype: work\ncontext: self-initiated\nyear: 2026–\nwhere: Independent project\nthemes: [gdpr, trust, privacy]\nintro: AutoFlow is my answer to that.\nbrief: \"We need to be GDPR-compliant.\"\nquestion: Why can only legal see where the risk is?\nanswer: Draw how data moves through the company by hand. A tiny model running in the browser turns the drawing into a working pipeline that anonymises, encrypts and documents the data, without it ever leaving the device.\ntagline: A visual GDPR governance workbench where you draw the data flow — and the diagram itself shows you where the risk lives.\nwhy: Every Record of Processing Activities tool on the market turns a spatial, relational question — how does personal data move through our organisation? — into a spreadsheet. The structure of the tool prevents the understanding it is supposed to produce.\nwhat: A local-first workbench where hand-drawn shapes become GDPR compliance modules, connected by Sankey-style bands whose thickness shows how much personal data flows through and whose colour shows how exposed it is. A canvas that recognises drawings on the device. A scoring formula published openly so anyone can inspect it. Zero server infrastructure.\noutcome: The tool that maps an organisation's data flows never lets that map leave the device. The scoring is published mathematics, not vendor opinion. The act of building the flow teaches the regulation's logic — the interaction IS the audit.\nsource: web-thecube/content/pieces/autoflow\nkeywords: [gdpr, privacy, data protection, personal data, compliance, compliant, regulation, regulatory, legal, risk, dpo, anonymise, anonymize, anonymisation, anonymization, encrypt, encryption, sensitive data, hr, patient, health, sharing data, data flow, audit, explain, explainable, ai act, local, on-device, browser, sovereignty]\nanswers:\n  - Where does our personal data actually go?\n  - How do we make GDPR understandable to people outside legal?\n  - Can we use our customer data with AI and stay GDPR-compliant?\n  - Compliance keeps saying no. What would a yes look like?\n  - Can regulation be a design brief instead of a blocker?\n  - Can the data stay on the user's device?\n  - How do we anonymise data before sharing it?\nquestions:\n  - q: How do we see where personal data flows in our organisation?\n    see: A ROPA describes a network\n  - q: Is there an alternative to compliance spreadsheets?\n    see: GDPR requires every organisation processing personal data\n  - q: How can a data protection officer see risk at a glance?\n    see: The Sankey clicked because\n  - q: Our compliance tool is hosted in the US. Is that a problem?\n    see: There is a second problem layered on the first.\n  - q: How can we trust a risk score?\n    see: The scoring model publishes itself.\n  - q: How do we help people understand what GDPR requires?\n    see: AutoFlow is a training tool as much as a compliance tool.\n  - q: What should a tool do when it cannot recognise what you drew?\n    see: The classifier is not allowed to guess.\n  - q: Why build without frameworks or a build step?\n    see: No build step, no framework dependency.\n  - q: How is the risk colour calculated?\n    see: The Sankey carries two dimensions in one band.\n  - q: Can the tool extend to healthcare data or NIS2?\n    see: The schema is the architecture.\n  - q: Who is compliance tooling really for?\n    see: The deeper argument the tool makes\n  - q: How do you train a small model that works for real users?\n    see: The training data comes from the same canvas\n---\n\n*Creator — Systems Designer & Design Engineer — 2026 — solo*\n\n## TL;DR\n\n**Why:** Every Record of Processing Activities tool on the market turns a spatial, relational question — how does personal data move through our organisation? — into a spreadsheet. The structure of the tool prevents the understanding it is supposed to produce.\n\n**What:** A local-first workbench where hand-drawn shapes become GDPR compliance modules, connected by Sankey-style bands whose thickness shows how much personal data flows through and whose colour shows how exposed it is. A canvas that recognises drawings on the device. A scoring formula published openly so anyone can inspect it. Zero server infrastructure.\n\n**Outcome:** The tool that maps an organisation's data flows never lets that map leave the device. The scoring is published mathematics, not vendor opinion. The act of building the flow teaches the regulation's logic — the interaction IS the audit.\n\n## Overview\n\nAutoFlow is an independent project — a data sovereignty workbench for domain experts who bear legal responsibility for personal data they cannot technically protect. HR managers, GPs, compliance officers, legal secretaries: people told to \"anonymise this before sharing it\" without ever being given a tool that lets them do so without involving a developer or a cloud service. Built solo, in vanilla web components, with on-device classification and a published scoring model.\n\n## Problem\n\nGDPR requires every organisation processing personal data to maintain a Record of Processing Activities — Article 30. The industry response was spreadsheets, SaaS dashboards, and compliance platforms that turn a regulation about protecting people into a data entry exercise. A Data Protection Officer opens a tool, fills in fields, saves a row. The output is a table that satisfies an auditor but teaches no one anything about where risk actually lives.\n\nThe problem is not that these tools are bad at their job. The problem is that their job is wrong.\n\nA ROPA describes a network — who collects personal data, what happens to it, where it is stored, who receives it. That is a spatial, directional, relational question. Every tool on the market answers it with rows and columns. When a DPO needs to know \"what happens to health records after they enter our system?\" — the answer is a path through a network. Not cell B247.\n\nThere is a second problem layered on the first. The data a DPO enters into a ROPA tool is itself sensitive — a complete map of an organisation's personal data processing. The market leaders host that map on third-party servers, often under US jurisdiction. The compliance tool creates a compliance problem about the compliance tool. The territory and the map should be made from the same material.\n\n## The moment\n\nThe first sketches were node graphs. Boxes, lines, arrows — the obvious answer when you say \"diagram.\" They failed almost immediately. A node graph lets you connect anything to anything, which is technically expressive and operationally meaningless. A DPO does not need infinite freedom. They need a *sequence* — where the data enters, what happens to it, where it leaves. Freedom was making the structure invisible again.\n\nI redrew the canvas as a sequencer. Left to right. Modules arranged like a signal chain — load, condition, transform, enrich, export. The same metaphor a music producer uses to think about audio passing through effects. The horizontal axis became the story: data starts on the left, has things done to it in the middle, ends on the right. There is no other path to walk. The shape of the canvas teaches the shape of the regulation.\n\nThen the second question. If the diagram is the document, the diagram has to *show risk*. Not after you click. Not after you read. At a glance. I tried colour-coded cells, heatmap overlays, badge icons — all of them turned risk into a separate vocabulary layered on top of the structure. The DPO had to learn the dashboard before they could read it.\n\nThe Sankey clicked because it carries two dimensions in a single band. Thickness is how much personal data is moving. Colour is how exposed that data is. The information lives in the connection itself, not in a legend you have to consult. A thick red band crossing a border is not a chart annotation. It is the picture, drawn correctly.\n\nThat was the moment. The diagram stopped being a representation of the document and became the document.\n\n## Approach\n\n### Design principles\n\nThree principles, held together.\n\n**Affordance.** The canvas IS the workspace. You draw where you want the module to live, and the shape itself decides what it is — circle becomes Data Subject, square becomes Data Store, diamond becomes a compliance gate. There is no \"add module\" button. No mode switch. The interaction is indistinguishable from sketching on a whiteboard, except the whiteboard understands what you drew.\n\n**Transparency.** The scoring model is published mathematics, not a black box. A separate audit page imports the same code the application runs and exposes every weight, every threshold, every multiplier — with an interactive calculator that lets any regulator, auditor, or DPO verify the result themselves. Trust is structural here, not promised.\n\n**Sovereignty.** The data a ROPA tool sees is the most sensitive map in an organisation. AutoFlow runs entirely client-side. No server, no account, no telemetry. The classifier runs on the device. The scoring runs on the device. The flow never leaves the browser tab that drew it. The tool practices what the regulation preaches.\n\n### Key decisions\n\n*The Sankey carries two dimensions in one band.* Each personal data field adds 4 pixels of band width — a connection carrying name and email is thin, a connection carrying twelve fields is visibly heavier. The colour is computed from three factors: sensitivity (Article 9 special categories score highest), state (clear text exposes fully, encryption neutralises, anonymisation eliminates), and destination (US jurisdiction under CLOUD Act, EU encrypted access-controlled, and everything between). Multiply the three. Above the high threshold — red. Above the medium — orange. Below — blue. Three colours, matching the decision space a DPO actually operates in: act now, review, or accept.\n\n*The band is a gradient, not a single colour.* Source colour on the left, arrival colour on the right. A band that leaves blue and arrives red is telling you: this data was protected when it departed, but the destination undid that protection. A band that stays red end to end is telling you: this data was never protected at all. The gradient is the narrative. The thickness is the scale. Together they answer \"how bad is this?\" faster than any dashboard.\n\n*The classifier is not allowed to guess.* Below the confidence threshold, the drawn strokes flash red and erase themselves. The canvas returns to blank. A compliance tool that misinterprets a gesture produces a record that misleads the regulator. A tool that admits uncertainty produces trust. Accountability over confidence — the same principle that governed Senz eight years earlier.\n\n*The training data comes from the same canvas as the inference data.* The first version of the classifier was trained on a public dataset of crowd-sourced drawings. It scored well on tests and failed on real fingers. The strokes a single user makes on a specific canvas do not look like crowd-sourced sketches. So the training set was redrawn — on the same canvas the tool uses to recognise. The model is small because it is exact, trained where it lives, on the strokes it will actually see. Not an engineering detail. The same design instinct as everything else in the tool: the territory and the map are made from the same material.\n\n*The scoring model publishes itself.* `audit.html` is a standalone page that imports the same scoring code the application uses. Every weight, every threshold, every multiplier is inspectable. An interactive calculator lets anyone pick any combination and see the score and colour update in real time. A regulator or DPO opens the page and verifies: health record + clear + US store = red band. Not an opinion. Arithmetic. The same arithmetic the tool runs every time a connection is made.\n\n*The schema is the architecture.* Every module type owns a schema file: its fields, its risk logic, its output contract, its validation warnings. The card component is a dumb renderer — it reads a schema, builds a form, displays the result. All domain knowledge lives in the schemas. Adding a new module type — FHIR healthcare bundle, NIS2 incident output, EHDS interoperability — is adding a schema file, not modifying core code. The architecture scales by addition.\n\n*No build step, no framework dependency.* Vanilla JavaScript. Web components. No NPM supply chain. No forced upgrades. The application is the source code. A sovereignty decision, not a minimalism preference — the tool is small enough to inspect end-to-end, and stable across the decade-scale timelines that compliance regulations actually live on.\n\n## Outcome\n\nAutoFlow is in development. The outcome it points at is not a metric but a stance.\n\nThe deeper argument the tool makes is about who compliance tooling is for. If it is for auditors, a spreadsheet suffices — rows satisfy checkboxes. If it is for the people responsible for protecting personal data, the tool should make risk visible, not just recordable. A DPO should be able to glance at their screen and see the problem — a thick red band crossing a border — not discover it in a quarterly report.\n\nAutoFlow is a training tool as much as a compliance tool. The act of building the flow — drawing shapes, connecting them, watching bands change colour as you configure jurisdictions and encryption — teaches the regulation's logic. The interaction IS the education. The colour IS the feedback. The Sankey IS the understanding. A DPO who builds one flow learns more about their organisation's data posture than they would reading the spreadsheet they spent three months filling in.\n\nThe same architecture extends naturally. FHIR R4 bundles for EHDS healthcare interoperability. Verifiable Credential issuance for eIDAS 2.0. Audit trail artifacts for NIS2 incident reporting. Each is a new schema file. The core does not change. The published scoring formula does not change. The on-device boundary does not change.\n\n## What it invites\n\nThe map should look like the territory. The tool that protects data should not be the tool that leaks it. The mathematics behind a risk score belong in front of the user, not behind a vendor's confidence.\n\nThese are not innovations. They are the obvious shape of the work, recovered after a decade of compliance tools that treated regulation as a billing surface rather than a design constraint. AutoFlow is one instance of that recovery. The principles transfer.\n\n## AI tools, human ownership\n\nBuilt solo. Product direction, architecture, every design decision, and acceptance criteria were mine. The tools below carried specific weight in the workflow.\n\n**Gemini** — Market-signal research. I framed the questions, weighed returned signals against domain knowledge, and decided which findings shaped product direction.\n\n**Lumo** — European regulation. EU-jurisdictional by design. I framed the compliance questions, tested returned interpretations against project constraints, and decided which guardrails to embed.\n\n**Claude Code (CLI)** — Code pairing, refactor, and review. Implementation against constraints I defined. I owned acceptance, integration, and ship decisions.\n\n**Claude (web)** — Positioning and pressure-testing. Used to stress-test my own framing — challenging assumptions, surfacing competing perspectives, sharpening claims before they shipped.\n\nThe principles that shaped the approach — accountability-over-confidence, on-device NLU, schema-driven architecture — carry forward from earlier collaboration with Sven Martinov and Olivier Gonthier on Senz at Kaiser X Labs.\n\n## Tech\n\nONNX Runtime Web (WASM backend, SIMD) for on-device shape classification · tiny CNN trained on hand-drawn samples from the same canvas as inference · MiniLM-L6-v2 for natural language module configuration · vanilla web components, no framework, no build step · schema-driven module cards with shared reference data for jurisdictions, data categories, encryption methods, legal bases, transfer mechanisms · Sankey-band renderer with thickness-by-volume and gradient-by-exposure encoding · standalone `audit.html` that imports the live scoring code · Web Crypto API (RSA-OAEP + AES-GCM hybrid) for the encryption module · DID-based key management for recipient-encrypted output · roadmap modules: FHIR R4 bundle output, Verifiable Credential issuance, audit-trail compliance artifact.\n"},{"id":"dowgo","md":"---\ntitle: Dowgo\ntype: work\ncontext: commissioned\nyear: 2024\nwhere: Dowgo · two-week consulting engagement\nthemes: [ideas, trust]\nintro: Dowgo was exactly that.\nbrief: \"Our due diligence data room needs to be better organised.\"\nquestion: What if the data room showed what's missing and who has to act, instead of only storing files?\nanswer: A two-week engagement that redesigned a due diligence data room around a conversational layer. The file system stays, and an agent beside it surfaces what's missing, takes delegation in plain language and points to the next action. Delivered as working code, in production.\ntagline: A due diligence data room redesign that turned passive document storage into guided action — without making anyone learn anything new.\nwhy: Due diligence platforms treat document management as an organisation problem. It isn't. Users can organise. What they cannot do is see what's missing, who needs to act, and what comes next — while juggling legal teams, auditors, and deadlines across borders.\nwhat: A two-week consulting engagement that redesigned the data room around a conversational layer. The file system stays. An agent sits beside it — greets you by name, surfaces what's missing, accepts delegation in natural language, and points the workspace at the next action. Delivered as working code in the client's production stack, not a reference design.\noutcome: In production. The company raised €2M in funding shortly after and now processes €300K+ in active business through the platform. The redesigned data room is the surface where every one of those transactions begins.\nsource: web-thecube/content/pieces/dowgo\nkeywords: [due diligence, data room, fundraising, raising, funding, investors, investor, auditors, audit, legal, documents, document management, process, complex, complexity, friction, workflow, onboarding, agent, conversational, delegation, consulting, two weeks, prototype, production, fintech, blockchain, renewable energy]\nanswers:\n  - We're raising. How do we get due diligence under control?\n  - Our process has grown too complex. Where does the friction come from?\n  - How do we improve a tool without making people learn something new?\n  - What can a consultant deliver in two weeks?\nquestions:\n  - q: We are raising money. How do we get due diligence under control?\n    see: The file system showed them what existed.\n  - q: How do we improve a tool without making people learn something new?\n    see: Users had decades of fluency with file systems\n  - q: Should we add AI to sort our documents?\n    see: Pattern matching, not AI categorisation.\n  - q: Is it safe to send sensitive documents to an AI model?\n    see: In a platform handling sensitive investment documentation\n  - q: Why not just build a dashboard?\n    see: I sketched five dashboard concepts\n  - q: What can be delivered in two weeks?\n    see: Two weeks from first conversation to working code\n  - q: How do you coordinate document requests between many parties?\n    see: Natural language delegation.\n  - q: What did the redesign change for the business?\n    see: In production. The company raised\n  - q: How do you work in a domain you do not know?\n    see: Walking into someone else's domain\n  - q: What happens if the ambitious feature fails?\n    see: Built to degrade.\n  - q: How do you hand work over to a development team?\n    see: Delivered in the client's stack.\n  - q: How do you push back on a client's brief?\n    see: I pushed back on the brief\n---\n\n*External Consultant — Systems Design & Prototyping — 2024 — engaged by Romain Menetrier, CPO/CTO of Dowgo*\n\n## TL;DR\n\n**Why:** Due diligence platforms treat document management as an organisation problem. It isn't. Users can organise. What they cannot do is see what's missing, who needs to act, and what comes next — while juggling legal teams, auditors, and deadlines across borders.\n\n**What:** A two-week consulting engagement that redesigned the data room around a
